name = "fcmobiletools"
compatibility_date = "2026-09-11"
main = "./src/worker.mjs"

[secrets]
required = [
  "CMS_SESSION_SECRET",
  "CMS_USERS_JSON",
  "GITHUB_TOKEN",
  "CLOUDINARY_CLOUD_NAME",
  "CLOUDINARY_API_KEY",
  "CLOUDINARY_API_SECRET"
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/admin", "/admin/*", "/api/*"]
not_found_handling = "404-page"
