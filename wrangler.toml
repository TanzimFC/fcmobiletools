name = "tanzimfc"
compatibility_date = "2026-09-11"
main = "./dist/_worker.js/index.js"
keep_vars = true
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = [ "/*", "!/assets/*", "!/_astro/*" ]
not_found_handling = "404-page"
[[routes]]
pattern = "fcmobiletools.online"
custom_domain = true

[[routes]]
pattern = "www.fcmobiletools.online"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "fcmobiletools-content"
database_id = "b54ead2b-0b7f-4daf-8e0b-d9eb1ebce98e"

# Giveaway claim-code encryption uses a cryptographically generated key held in the
# private giveaway_settings row. Do not add a GIVEAWAY_CODE_KEY Worker secret.
# SUPABASE_SECRET_KEY and IMAGEBB_API_KEY remain required for the giveaway API and proof uploads.
[secrets]
required = [ "SUPABASE_SECRET_KEY", "IMAGEBB_API_KEY" ]

[previews.placement]
mode = "smart"

[triggers]
crons = ["0 * * * *"]
