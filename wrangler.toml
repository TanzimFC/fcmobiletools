name = "tanzimfc"
compatibility_date = "2026-09-11"
main = "./dist/_worker.js/index.js"
keep_vars = true
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = [ "/*", "!/assets/*", "!/_astro/*" ]
not_found_handling = "404-page"
[[routes]]
pattern = "fcmobiletools.online"
custom_domain = true

[[routes]]
pattern = "www.fcmobiletools.online"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "fcmobiletools-content"
database_id = "b54ead2b-0b7f-4daf-8e0b-d9eb1ebce98e"

# GIVEAWAY_CODE_KEY (32 or more random characters) is also needed before a giveaway can go live.
# It is not listed as required so a missing value never blocks a site deploy; the admin panel
# readiness strip and the go-live button refuse to launch without it.
#   openssl rand -base64 48 | npx wrangler secret put GIVEAWAY_CODE_KEY
[secrets]
required = [ "SUPABASE_SECRET_KEY", "IMAGEBB_API_KEY" ]

[previews.placement]
mode = "smart"

[triggers]
crons = ["0 * * * *"]
