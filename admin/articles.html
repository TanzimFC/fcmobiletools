<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Articles — FC Mobile Tools</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b10;color:#f4f8fb;font:14px system-ui,sans-serif}.shell{width:min(1180px,calc(100% - 28px));margin:auto;padding:26px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.top h1{margin:0;font-size:28px;letter-spacing:-.04em}.top p{margin:5px 0 0;color:#8296a3;font-size:10px}.btn{border:1px solid #29404d;border-radius:10px;background:#0c151b;color:#dff7ff;padding:10px 13px;font-weight:800;font-size:10px;cursor:pointer}.primary{background:linear-gradient(135deg,#69e0ff,#2aa8e8);color:#04131c;border-color:#69dcff}.grid{display:grid;grid-template-columns:330px 1fr;gap:14px}.panel{border:1px solid #20323d;border-radius:17px;background:#0b141a;box-shadow:0 20px 55px #0006}.list{padding:10px}.row{width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:10px;text-align:left;padding:10px;border:1px solid transparent;border-radius:11px;background:transparent;color:#dbe6eb;cursor:pointer}.row:hover,.row.active{background:#ffffff06;border-color:#29404d}.thumb{width:52px;height:42px;border-radius:7px;background:#0d1b23;object-fit:cover}.row b{display:block;font-size:10px}.row small{display:block;color:#718692;font-size:8px;margin-top:4px}.row i{color:#56d6ff;font-style:normal}.editor{padding:18px}.fields{display:grid;gap:10px}.two{grid-template-columns:1fr 1fr}.input,select,textarea{width:100%;padding:11px 12px;border:1px solid #293d49;border-radius:10px;background:#081117;color:#f5f8fb;outline:0;font:inherit}.input:focus,select:focus,textarea:focus{border-color:#56d6ff;box-shadow:0 0 0 3px #56d6ff10}.title{font-size:23px;font-weight:800}.toolbar{display:flex;flex-wrap:wrap;gap:5px;padding:8px;border:1px solid #223641;border-bottom:0;border-radius:12px 12px 0 0;background:#0a1218}.toolbar button{border:1px solid #263d49;background:#0d181f;color:#9db1bc;border-radius:7px;padding:7px 9px;font-size:9px;font-weight:800;cursor:pointer}.toolbar button:hover{color:#fff;border-color:#56d6ff}.editorbox{min-height:430px;padding:18px;border:1px solid #223641;border-radius:0 0 12px 12px;background:#071016;outline:0;line-height:1.8;font-size:15px}.editorbox:empty:before{content:attr(data-placeholder);color:#506773}.editorbox img{max-width:100%;border-radius:10px;border:1px solid #29404d}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}.status{color:#7f96a2;font-size:9px}.picker{position:fixed;inset:0;display:none;place-items:center;background:#000c;padding:20px;z-index:5}.picker.open{display:grid}.pickerbox{width:min(850px,100%);max-height:85vh;overflow:auto;padding:18px;border:1px solid #29404d;border-radius:18px;background:#0b141a}.pickergrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.pick{border:1px solid #29404d;background:#081117;border-radius:9px;padding:0;overflow:hidden;color:#8ca1ac;cursor:pointer}.pick img{display:block;width:100%;height:100px;object-fit:cover}.pick span{display:block;padding:7px;font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:850px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.pickergrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.shell{width:calc(100% - 18px)}.editor{padding:11px}.editorbox{min-height:360px}.pickergrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="shell"><header class="top"><div><h1>Articles</h1><p>Write with rich formatting, inline Cloudinary media, preview and fast draft/publish controls.</p></div><button class="btn" id="new">+ New article</button></header><div class="grid"><section class="panel list" id="list">Loading…</section><section class="panel editor"><div class="fields"><input class="input title" id="title" placeholder="Article title"><div class="fields two"><input class="input" id="slug" placeholder="slug"><select id="type"><option value="news">Updates</option><option value="guide">Guides</option><option value="analysis">Analysis</option><option value="player-review">Reviews</option><option value="leaks">Leaks</option><option value="event-guide">Event Guide</option></select></div><div class="fields two"><input class="input" id="category" placeholder="Category" value="Guides"><input class="input" id="image" placeholder="Feature image URL"></div><textarea class="input" id="description" rows="3" placeholder="Short description"></textarea><input class="input" id="tags" placeholder="Tags, comma separated"><select id="fact"><option value="verified">Confirmed</option><option value="partially-verified">Partially verified</option><option value="community-reported">Unconfirmed / community reported</option></select><div><div class="toolbar"><button data-cmd="bold">Bold</button><button data-cmd="italic">Italic</button><button data-block="h2">H2</button><button data-block="h3">H3</button><button data-block="blockquote">Quote</button><button data-list="ul">List</button><button id="inlineImage">+ Image</button><button id="link">Link</button><button id="preview">Preview</button></div><div id="editor" class="editorbox" contenteditable="true" spellcheck="true" data-placeholder="Start writing…"></div></div></div><div class="actions"><span class="status" id="status">Ready</span><div><button class="btn" id="draft">Save draft</button> <button class="btn primary" id="publish">Publish</button></div></div></section></div></main><div class="picker" id="picker"><div class="pickerbox"><div class="top"><div><h1>Media Library</h1><p>Choose an existing Cloudinary image or upload one.</p></div><button class="btn" id="closePicker">Close</button></div><button class="btn primary" id="upload">Upload image</button><input id="file" type="file" accept="image/*" hidden><div class="pickergrid" id="pickergrid"></div></div></div><script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=null,items=[];
async function api(path,opt={}){const r=await fetch('/api/admin'+path,{credentials:'same-origin',...opt});const b=await r.json().catch(()=>({}));if(r.status===401){location.replace('/admin/');throw Error('Session expired')}if(!r.ok)throw Error(b.error||'Request failed');return b}
function setStatus(s,bad=false){$('#status').textContent=s;$('#status').style.color=bad?'#ff8d82':''}
function toHTML(md){return esc(md||'').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">')}
function toMD(html){const d=document.createElement('div');d.innerHTML=html;const w=n=>{if(n.nodeType===3)return n.nodeValue;if(n.nodeType!==1)return '';const t=n.tagName.toLowerCase(),x=[...n.childNodes].map(w).join('');if(t==='h2')return '\n\n## '+x+'\n\n';if(t==='h3')return '\n\n### '+x+'\n\n';if(t==='p')return '\n\n'+x+'\n\n';if(t==='strong'||t==='b')return '**'+x+'**';if(t==='em'||t==='i')return '*'+x+'*';if(t==='blockquote')return '\n\n> '+x+'\n\n';if(t==='a')return '['+x+']('+n.getAttribute('href')+')';if(t==='img')return '\n\n!['+(n.alt||'Article image')+']('+n.src+')\n\n';if(t==='br')return '\n';if(t==='li')return x;if(t==='ul')return '\n\n'+[...n.children].map(y=>'- '+w(y)).join('\n')+'\n\n';if(t==='ol')return '\n\n'+[...n.children].map((y,i)=>(i+1)+'. '+w(y)).join('\n')+'\n\n';return x};return [...d.childNodes].map(w).join('').replace(/\n{3,}/g,'\n\n').trim()}
function reset(){current=null;$('#title').value='';$('#slug').value='';$('#type').value='guide';$('#category').value='Guides';$('#image').value='';$('#description').value='';$('#tags').value='';$('#fact').value='verified';$('#editor').innerHTML='';setStatus('New article')}
function fill(a){current=a;const d=a.data||{};$('#title').value=d.title||'';$('#slug').value=d.slug||'';$('#type').value=d.type||'guide';$('#category').value=d.category||'Guides';$('#image').value=d.image||'';$('#description').value=d.description||'';$('#tags').value=(d.tags||[]).join(', ');$('#fact').value=d.factStatus||'verified';$('#editor').innerHTML=toHTML(a.body||'');setStatus('Editing '+(d.status||'draft'))}
async function load(){const b=await api('/articles');items=b.articles||[];$('#list').innerHTML=items.map(a=>'<button class="row" data-path="'+esc(a.path)+'"><span class="thumb">'+(a.data.image?'<img class="thumb" src="'+esc(a.data.image)+'" alt="">':'FC')+'</span><span><b>'+esc(a.data.title||a.path)+'</b><small>'+esc(a.data.category||'Guides')+' · '+esc(a.data.status||'draft')+'</small></span><i>→</i></button>').join('')||'<div style="padding:20px;color:#718692">No articles yet.</div>';document.querySelectorAll('.row').forEach(b=>b.onclick=()=>fill(items.find(a=>a.path===b.dataset.path)))}
async function save(status){const title=$('#title').value.trim();if(!title)return setStatus('Add a title',true);try{setStatus('Saving…');const payload={...current?.data,title,slug:$('#slug').value.trim()||title,type:$('#type').value,category:$('#category').value.trim()||'Guides',image:$('#image').value.trim(),description:$('#description').value.trim(),tags:$('#tags').value.split(',').map(x=>x.trim()).filter(Boolean),factStatus:$('#fact').value,status,author:current?.data?.author||'TanzimFC',body:toMD($('#editor').innerHTML),createOnly:!current};await api('/articles',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});setStatus(status==='published'?'Published':'Draft saved');await load()}catch(e){setStatus(e.message,true)}}
async function media(){const b=await api('/media');$('#pickergrid').innerHTML=(b.resources||[]).map(x=>'<button class="pick" data-url="'+esc(x.url)+'"><img src="'+esc(x.url)+'" alt=""><span>'+esc(x.publicId)+'</span></button>').join('');$('#picker').classList.add('open');document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{if(window.mediaTarget==='feature')$('#image').value=b.dataset.url;else{document.execCommand('insertHTML',false,'<img src="'+esc(b.dataset.url)+'" alt="Article image">')}$('#picker').classList.remove('open')})}
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>document.execCommand(b.dataset.cmd,false,null));document.querySelectorAll('[data-block]').forEach(b=>b.onclick=()=>document.execCommand('formatBlock',false,b.dataset.block));document.querySelectorAll('[data-list]').forEach(b=>b.onclick=()=>document.execCommand('insertUnorderedList'));$('#link').onclick=()=>{const u=prompt('Link URL');if(u)document.execCommand('createLink',false,u)};$('#inlineImage').onclick=()=>{window.mediaTarget='inline';media()};$('#image').addEventListener('dblclick',()=>{window.mediaTarget='feature';media()});$('#closePicker').onclick=()=>$('#picker').classList.remove('open');$('#new').onclick=reset;$('#draft').onclick=()=>save('draft');$('#publish').onclick=()=>save('published');$('#preview').onclick=()=>{const w=window.open('','_blank');w.document.write('<title>'+esc($('#title').value)+'</title><style>body{max-width:850px;margin:50px auto;background:#070b10;color:#eaf3f7;font:16px system-ui;line-height:1.8;padding:20px}img{max-width:100%}</style><h1>'+esc($('#title').value)+'</h1><p>'+esc($('#description').value)+'</p>'+$('#editor').innerHTML);w.document.close()};$('#upload').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const s=await api('/media/sign');const fd=new FormData();fd.append('file',f);fd.append('api_key',s.apiKey);fd.append('timestamp',s.timestamp);fd.append('folder',s.folder);fd.append('signature',s.signature);const r=await fetch('https://api.cloudinary.com/v1_1/'+s.cloudName+'/image/upload',{method:'POST',body:fd});const b=await r.json();if(!r.ok)throw Error(b?.error?.message||'Upload failed');if(window.mediaTarget==='feature')$('#image').value=b.secure_url;else document.execCommand('insertHTML',false,'<img src="'+esc(b.secure_url)+'" alt="Article image">');$('#picker').classList.remove('open')}catch(x){setStatus(x.message,true)}};load();
</script></body></html>
