.btn:hover:not(:disabled){border-color:rgba(76,201,255,.55);transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{border:0;color:#041724;background:linear-gradient(180deg,#c8f3ff,#4cc9ff 55%,#238cb8)}

.btn.ok{border-color:rgba(78,224,160,.45);color:#a6f3d2;background:rgba(78,224,160,.08)}

.tabs{display:flex;gap:6px;padding:5px;border:1px solid var(--line);border-radius:15px;background:rgba(9,19,29,.8);width:fit-content;max-width:100%;overflow:auto;margin-bottom:20px}
.tabs button{border:0;border-radius:11px;background:transparent;color:var(--mut);padding:9px 15px;font:700 13px/1 var(--sans);white-space:nowrap}

<main class="sh">
  <header class="top">
    <div>
      <span class="eb"><i></i> GIVEAWAYS</span>
      <h1>Giveaway control room</h1>
      <p>Create giveaways, review proof, run or reroll the draw, verify private claim codes and record reward delivery. Sensitive code reveals and decisions are written to the audit log.</p>
    </div>
    <a class="back" href="/admin/accounts/">&larr; Account System</a>

</main>

'use strict';
const $=(s,r)=>(r||document).querySelector(s);

const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={tab:'list',list:[],sel:null,sub:'overview',settings:null,health:null,entries:{rows:[],total:0},filters:{status:'provisional',flag:'',q:'',sort:'created'},checked:new Set(),winners:[],roi:null,rulesVersion:''};
const BASE='/api/admin/giveaways';

const toLocalInput=i=>{if(!i)return '';const d=new Date(i);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())};

async function api(path,opt){
  opt=opt||{};
  const r=await fetch(BASE+path,{method:opt.method||'GET',credentials:'same-origin',cache:'no-store',headers:{'content-type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});

  const ct=r.headers.get('content-type')||'';
  const b=ct.includes('json')?await r.json().catch(()=>({})):await r.text();
  if(!r.ok){const e=new Error((b&&b.error)||'Request failed.');e.body=b;e.status=r.status;throw e}
  return b;
}

async function act(btn,fn){if(btn&&btn.disabled)return;if(btn)btn.disabled=true;try{return await fn()}catch(e){toast(e.message,true)}finally{if(btn)btn.disabled=false}}

function closeModal(){$('#modal').classList.remove('on')}

// Asks for a reason (and optional extras) before a decision. Returns a promise of the values or null.
function ask(o){
  return new Promise(resolve=>{
    const d=openModal('<h3>'+esc(o.title)+'</h3><p class="sub">'+esc(o.text||'')+'</p>'+(o.fields||[]).map(f=>'<div class="f"><label>'+esc(f.label)+'</label>'+(f.type==='select'?'<select class="in" data-k="'+f.k+'">'+f.options.map(x=>'<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>').join('')+'</select>':f.type==='area'?'<textarea class="in" data-k="'+f.k+'" placeholder="'+esc(f.ph||'')+'"></textarea>':'<input class="in" data-k="'+f.k+'" placeholder="'+esc(f.ph||'')+'" value="'+esc(f.value||'')+'">')+(f.hint?'<span class="hint">'+esc(f.hint)+'</span>':'')+'</div>').join('')+'<div class="row" style="margin-top:16px"><button class="btn" id="mNo">Cancel</button><button class="btn '+(o.cls||'pri')+' sp" id="mOk">'+esc(o.ok||'Confirm')+'</button></div>');
    const first=$('[data-k]',d);if(first)first.focus();
    $('#mNo').onclick=()=>{closeModal();resolve(null)};
    $('#mOk').onclick=()=>{const v={};$$('[data-k]',d).forEach(i=>v[i.dataset.k]=i.value.trim());closeModal();resolve(v)};
  });
}

// ───────────── draw stage (full-screen show for screen recording) ─────────────
const maskName=n=>{n=String(n||'player');return n.length<=2?'**':n.length<=4?n[0]+'*'.repeat(n.length-1):n.slice(0,2)+'*'.repeat(Math.min(6,n.length-4))+n.slice(-2)};

const entryEstimate=g=>{const c=g.entryCounts||{};return(Number(c.provisional)||0)+(Number(c.approved)||0)};
function stageRows(g,rows){
  const pz=prizeText(g);
  return rows.filter(x=>x.slot&&['selected','awaiting_claim','code_verified','paid'].includes(x.status)).sort((a,b)=>a.slot-b.slot).map(x=>({slot:x.slot,name:maskName(x.account&&x.account.username),prize:Number(x.prize_cents||0)>0?money(x.prize_cents):pz}));
}
function stageAlts(rows){return rows.filter(x=>x.status==='alternate').sort((a,b)=>a.rank_position-b.rank_position).map(x=>maskName(x.account&&x.account.username))}
async function drawFacts(g){
  try{const d=await api('/audit?giveaway='+g.id);const r=(d.audit||[]).find(a=>a.action==='draw_completed');if(r&&r.detail)return{entries:Number(r.detail.entries)||0,entriesHash:String(r.detail.entriesHash||g.entries_hash||'')}}catch(e){}
  return{entries:entryEstimate(g),entriesHash:g.entries_hash||''};
}
async function openStage(g,mode,v,extra){
  const S=await loadStage();
  return S.openDrawStage(Object.assign({mode:mode,title:g.title,prize:prizeText(g),speed:(v&&v.speed)||'standard',sound:Boolean(v&&v.sound==='on'),seedCommit:g.seed_commit||'',entries:entryEstimate(g),winnersTotal:Math.max(1,Number(g.winner_count)||1),
    verifyUrl:g.results_published_at?'/giveaways/'+g.slug+'/':''},extra||{}));
}
function runLiveDraw(g,v){
  let drawn=false;
  return openStage(g,'live',v,{
    finalNote:'Next: review each winner\u2019s proof, then publish the results.',
    prepare:async()=>{
      const r=await api('/'+g.id+'/draw',{method:'POST',body:{confirm:true}});drawn=true;
      let w;try{w=await api('/'+g.id+'/winners')}catch(e){const er=new Error('The draw ran and is saved, but the winners list could not load. Close this and open Draw and winners.');er.title='The draw ran, but the show stopped';throw er}

  const r=state.roi,e=r.estimate,roi=state.settings.roi||{};
  $('#sub').innerHTML='<div class="note">These are estimates from the numbers you enter below. Your real earnings are in AdSense. Nothing here promises a return.</div>'+
  '<div class="grid g4"><div class="stat"><small>Page views</small><strong>'+r.funnel.views+'</strong></div><div class="stat"><small>Started entry</small><strong>'+r.funnel.starts+'</strong></div><div class="stat"><small>Entries</small><strong>'+r.funnel.entries+'</strong></div><div class="stat"><small>Approved</small><strong>'+r.funnel.approved+'</strong></div></div>'+
  '<div class="card" style="margin-top:14px"><h3>Giveaway reach and estimated ad revenue</h3><div class="grid g4"><div class="stat"><small>Reward type</small><strong>'+esc(g.prize_label||'In-game reward')+'</strong></div><div class="stat"><small>Estimated page views</small><strong>'+e.pageviews.toLocaleString()+'</strong></div><div class="stat"><small>Estimated revenue</small><strong>'+(e.configured?money(e.revenueCents):'Set RPM')+'</strong></div></div>'+
  '</div>'+
  '<div class="card"><h3>Your assumptions</h3><p>RPM is what you earn per 1,000 page views, from your AdSense report. Pages per entrant is how many pages an entrant typically views because of the giveaway (hub, giveaway, survey, quest, return visits).</p><div class="grid g3"><div class="f"><label>RPM (USD per 1,000 views)</label><input class="in" id="r_rpm" type="number" min="0" step="0.1" value="'+(roi.rpm_usd||0)+'"></div><div class="f"><label>Pages per entrant</label><input class="in" id="r_pp" type="number" min="1" value="'+(roi.pages_per_entrant||6)+'"></div></div><button class="btn pri" id="r_save">Save and recalculate</button></div>'+
  '<div class="card"><h3>Grow the giveaway without changing the odds</h3><ul style="margin:0;padding-left:20px;display:grid;gap:6px;color:var(--mut)"><li>Share the public page in creator posts and Discord announcements. Sharing never creates an extra entry.</li><li>Use community milestones to unlock additional winners, not extra tickets.</li><li>Keep requirements clear and review proof before temporary screenshots expire.</li><li>Never ask people to click or view ads. That breaks AdSense policy and can end the account.</li><li>Publish the entry deadline and draw record so every entrant can check the process.</li></ul></div>';
  $('#r_save').onclick=ev=>act(ev.currentTarget,async()=>{state.settings=await api('/settings',{method:'PUT',body:{roi:{rpm_usd:+$('#r_rpm').value,pages_per_entrant:+$('#r_pp').value}}});toast('Saved.');subRoi()});
}

// ───────────── verify claim code ─────────────
function renderVerify(){
  $('#view').innerHTML='<div class="card"><h3>Verify a claim code</h3><p>When a winner sends you their code, paste it here with the handle it came from. Claim codes are encrypted at rest. Every admin code reveal is logged. Compare the supplied Discord username and FC Mobile UID with the saved winner record before marking a claim verified or delivering the reward.</p><div class="grid g2"><div class="f"><label>Claim code</label><input class="in" id="v_code" placeholder="FCM-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false"></div><div class="f"><label>Discord username supplied by claimant</label><input class="in" id="v_handle" placeholder="Exact Discord username" autocomplete="off"></div><div class="f"><label>FC Mobile UID supplied by claimant</label><input class="in" id="v_uid" placeholder="6 to 20 digits" inputmode="numeric" maxlength="20" autocomplete="off"></div></div><button class="btn pri" id="v_go">Check code and winner details</button></div><div id="v_out"></div>';
  $('#v_go').onclick=e=>act(e.currentTarget,async()=>{const r=await api('/verify-code',{method:'POST',body:{code:$('#v_code').value,handle:$('#v_handle').value,fcUid:$('#v_uid').value}});const o=$('#v_out');
    if(!r.found){o.innerHTML='<div class="note bad"><b>No match.</b> This code is not valid for any winner. It may be mistyped, replaced, or fake. Do not mark a reward as delivered.</div>';return}
    const w=r.winner,m=r.handleMatch,u=r.uidMatch,allMatch=m===true&&u===true;
    o.innerHTML='<div class="card" style="border-color:'+(m===false||u===false?'rgba(255,143,134,.5)':'rgba(78,224,160,.4)')+'"><h3>Claim code found</h3><div class="grid g2"><div><div class="sub">Winner</div><b style="font:700 20px var(--disp)">'+esc(w.username)+'</b></div><div><div class="sub">Prize</div><b style="font:700 20px var(--disp)">'+esc(w.prize)+'</b> · '+esc(w.giveaway)+'</div></div>'+
    '<div class="chips"><span class="tag">'+esc(w.status.replace(/_/g,' '))+'</span>'+(w.overdue?'<span class="tag bad">Claim window passed</span>':'')+(m===true?'<span class="tag ok">Discord username matches</span>':m===false?'<span class="tag bad">Discord username mismatch</span>':'<span class="tag go">Discord username not saved</span>')+(u===true?'<span class="tag ok">FC Mobile UID matches</span>':u===false?'<span class="tag bad">FC Mobile UID mismatch</span>':'<span class="tag go">FC Mobile UID not saved</span>')+'</div>'+
    '<div class="sub">Saved Discord: '+(w.contactHandle?esc(w.contactHandle):'none')+'<br>Saved FC Mobile UID: '+(w.fcUid?esc(w.fcUid):'none')+'</div>'+
    (!allMatch?'<div class="note bad">Do not verify or deliver the reward while either detail is missing or mismatched. Confirm the winner through the official community before overriding.</div>':'<div class="note ok">Both submitted details match the saved winner record.</div>')+
    (w.status==='awaiting_claim'?'<button class="btn pri" id="v_mark" '+(allMatch?'':'')+'>Mark claim verified</button>':'')+'</div>';
    const mk=$('#v_mark');if(mk)mk.onclick=ev=>act(ev.currentTarget,async()=>{const body={action:'verify',handle:$('#v_handle').value,fcUid:$('#v_uid').value};try{await api('/'+w.giveawayId+'/winners/'+w.id+'/action',{method:'POST',body})}catch(er){if(er.body&&er.body.confirmable){const c=await ask({title:'Claim details mismatch',text:er.message,fields:[{k:'reason',label:'Override reason (required)',type:'area',ph:'Explain how you independently confirmed the winner'}],ok:'I verified the winner',cls:'bad'});if(!c)return;if(!c.reason||c.reason.trim().length<5){toast('Add an override reason of at least five characters.',true);return}body.force=true;body.reason=c.reason;await api('/'+w.giveawayId+'/winners/'+w.id+'/action',{method:'POST',body})}else throw er}toast('Claim verification recorded. You can now mark delivery in the winners tab.');$('#v_go').click()})});
}

// ───────────── penalties ─────────────
async function renderBans(){
  $('#view').innerHTML='<div class="skel"></div>';let d;try{d=await api('/bans')}catch(e){$('#view').innerHTML='<div class="note bad">'+esc(e.message)+'</div>';return}
  $('#view').innerHTML='<div class="card"><h3>Pause an account from giveaways</h3><p>Ladder: 14 days, 60 days, 180 days, then permanent. Rejecting an entry with a penalty does this for you. Use this for other cases.</p><div class="grid g3"><div class="f"><label>Username</label><input class="in" id="b_u"></div><div class="f"><label>Days (empty uses the ladder)</label><input class="in" id="b_days" type="number" min="1"></div><div class="f"><label>Permanent</label><select class="in" id="b_p"><option value="0">No</option><option value="1">Yes</option></select></div></div><div class="f"><label>Reason (shown to the user)</label><input class="in" id="b_r"></div><button class="btn bad" id="b_go">Apply pause</button></div>'+
  '<div class="card"><h3>Penalty records</h3><div class="wrapx"><table class="tbl"><thead><tr><th>User</th><th>Strike</th><th>Reason</th><th>Until</th><th></th></tr></thead><tbody>'+(d.bans.map(b=>'<tr><td><b>'+esc(b.username)+'</b></td><td>'+b.strike+'</td><td>'+esc(b.reason)+'</td><td>'+(b.lifted_at?'<span class="tag">Lifted</span>':b.ends_at?(b.active?when(b.ends_at):'<span class="tag">Expired</span>'):'<span class="tag bad">Permanent</span>')+'</td><td>'+(b.active?'<button class="btn sm" data-lift="'+b.id+'">Lift</button>':'')+'</td></tr>').join('')||'<tr><td colspan="5" class="hint">No penalties.</td></tr>')+'</tbody></table></div></div>';
  $('#b_go').onclick=e=>act(e.currentTarget,async()=>{await api('/bans',{method:'POST',body:{username:$('#b_u').value,reason:$('#b_r').value,days:$('#b_days').value||undefined,permanent:$('#b_p').value==='1'}});toast('Pause applied.');renderBans()});
  $$('[data-lift]').forEach(b=>b.onclick=()=>act(b,async()=>{const v=await ask({title:'Lift this pause?',fields:[{k:'reason',label:'Reason'}],ok:'Lift'});if(!v)return;await api('/bans/'+b.dataset.lift+'/lift',{method:'POST',body:{reason:v.reason}});toast('Lifted.');renderBans()}));
}

// ───────────── settings and audit ─────────────
async function renderSettings(){
  $('#view').innerHTML='<div class="skel"></div>';try{state.settings=await api('/settings')}catch(e){$('#view').innerHTML='<div class="note bad">'+esc(e.message)+'</div>';return}
  const o=state.settings.official||{};
  $('#view').innerHTML='<div class="card"><h3>Official contact points</h3><p>These are shown to winners and on the Claim Safety page. Winners are told to send their code only to these handles. Double check the spelling.</p><div class="grid g2"><div class="f"><label>Discord server invite (https)</label><input class="in" id="o_di" value="'+esc(o.discord_invite||'')+'"></div><div class="f"><label>Official Discord handle for claims</label><input class="in" id="o_dh" value="'+esc(o.discord_handle||'')+'"></div><div class="f"><label>Official Instagram handle (no @)</label><input class="in" id="o_ih" value="'+esc(o.instagram_handle||'')+'"></div><div class="f"><label>Instagram profile link (https)</label><input class="in" id="o_iu" value="'+esc(o.instagram_url||'')+'"></div></div><div class="f"><label>Notice shown on safety pages (optional)</label><input class="in" id="o_n" value="'+esc(o.notice||'')+'"></div><button class="btn pri" id="o_save">Save</button></div>';
  $('#o_save').onclick=e=>act(e.currentTarget,async()=>{state.settings=await api('/settings',{method:'PUT',body:{official:{discord_invite:$('#o_di').value,discord_handle:$('#o_dh').value,instagram_handle:$('#o_ih').value,instagram_url:$('#o_iu').value,notice:$('#o_n').value}}});toast('Saved.');loadHealth()});
}
async function renderAudit(){
  $('#view').innerHTML='<div class="skel"></div>';let d;try{d=await api('/audit')}catch(e){$('#view').innerHTML='<div class="note bad">'+esc(e.message)+'</div>';return}
  $('#view').innerHTML='<div class="card"><h3>Audit log</h3><p>Append only. Every draw, decision, penalty, code verification and reward delivery is recorded.</p><div class="wrapx"><table class="tbl"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr></thead><tbody>'+d.audit.map(a=>'<tr><td class="hint">'+when(a.created_at)+'</td><td>'+esc(a.actor)+'</td><td><b>'+esc(a.action.replace(/_/g,' '))+'</b></td><td class="hint mono">'+esc(JSON.stringify(a.detail||{}))+'</td></tr>').join('')+'</tbody></table></div></div>';
}

loadHealth();render();
})();
</script>
</body>
</html>
