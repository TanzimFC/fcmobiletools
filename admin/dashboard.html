function articleMarkdownToHTML(markdown) {
  const source=String(markdown||'');
  return esc(source)
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/\n/g,'<br>');
}
function articleHTMLToMarkdown(html) {
  const root=document.createElement('div'); root.innerHTML=html;
  const walk=(node)=>{
    if(node.nodeType===3) return node.nodeValue;
    if(node.nodeType!==1) return '';
    const tag=node.tagName.toLowerCase();
    const inner=[...node.childNodes].map(walk).join('');
    if(tag==='h2') return '\n\n## '+inner+'\n\n';
    if(tag==='h3') return '\n\n### '+inner+'\n\n';
    if(tag==='p') return '\n\n'+inner+'\n\n';
    if(tag==='strong'||tag==='b') return '**'+inner+'**';
    if(tag==='em'||tag==='i') return '*'+inner+'*';
    if(tag==='blockquote') return '\n\n> '+inner+'\n\n';
    if(tag==='a') return '['+inner+']('+node.getAttribute('href')+')';
    if(tag==='img') return '\n\n!['+(node.getAttribute('alt')||'Article image')+']('+node.getAttribute('src')+')\n\n';
    if(tag==='li') return '- '+inner+'\n';
    if(tag==='br') return '\n';
    return inner;
  };
  return [...root.childNodes].map(walk).join('').replace(/\n{3,}/g,'\n\n').trim();
}

async function articleMediaPicker(callback) {
  const result=await api('/media');
  openModal('<div class="dialoghead"><div><h3>Media Library</h3><div class="muted">Choose an existing Cloudinary image or upload one.</div></div><button class="close" data-close>×</button></div>'
    +'<div class="dialogbody"><button class="btn primary" id="articleUpload">Upload image</button><input id="articleUploadFile" type="file" accept="image/*" hidden><div class="pickergrid article-picker">'
    +(result.resources||[]).map(x=>'<button class="pickeritem" data-article-media="'+esc(x.url)+'"><img src="'+esc(x.url)+'" alt=""><span>'+esc(x.publicId)+'</span></button>').join('')
    +'</div></div>');
  document.querySelectorAll('[data-article-media]').forEach(b=>b.onclick=()=>{callback(b.dataset.articleMedia);closeModal()});
  $('#articleUpload').onclick=()=>$('#articleUploadFile').click();

    const file=e.target.files?.[0]; if(!file)return;
    try{
      const s=await api('/media/sign'); const fd=new FormData();
      fd.append('file',file); fd.append('api_key',s.apiKey); fd.append('timestamp',s.timestamp); fd.append('folder',s.folder); fd.append('signature',s.signature);
      const up=await fetch('https://api.cloudinary.com/v1_1/'+s.cloudName+'/image/upload',{method:'POST',body:fd});
      const data=await up.json(); if(!up.ok) throw Error(data?.error?.message||'Upload failed');
      callback(data.secure_url); closeModal();
    }catch(err){state(err.message,false);}
  };

async function loadTipTap(editorEl, initialHTML){
  if(tiptapEditor) return tiptapEditor;
  try{
    const [core,starter,link,image,placeholder,underline,textStyle,color,highlight,textAlign,typography]=await Promise.all([
      import('https://esm.sh/@tiptap/core@2.11.5'),
      import('https://esm.sh/@tiptap/starter-kit@2.11.5'),
      import('https://esm.sh/@tiptap/extension-link@2.11.5'),
      import('https://esm.sh/@tiptap/extension-image@2.11.5'),
      import('https://esm.sh/@tiptap/extension-placeholder@2.11.5'),
      import('https://esm.sh/@tiptap/extension-underline@2.11.5'),
      import('https://esm.sh/@tiptap/extension-text-style@2.11.5'),
      import('https://esm.sh/@tiptap/extension-color@2.11.5'),
      import('https://esm.sh/@tiptap/extension-highlight@2.11.5'),
      import('https://esm.sh/@tiptap/extension-text-align@2.11.5'),
      import('https://esm.sh/@tiptap/extension-typography@2.11.5')
    ]);
    const {Editor}=core;
    const StarterKit=starter.default||starter;
    const Link=link.default||link;
    const Image=image.default||image;
    const Placeholder=placeholder.default||placeholder; const Underline=underline.default||underline; const TextStyle=textStyle.default||textStyle; const Color=color.default||color; const Highlight=highlight.default||highlight; const TextAlign=textAlign.default||textAlign; const Typography=typography.default||typography;
    tiptapEditor=new Editor({element:editorEl,content:initialHTML||'',extensions:[
      StarterKit.configure({heading:{levels:[1,2,3]},link:false}),
      Link.configure({openOnClick:false,autolink:true,HTMLAttributes:{class:'article-link'}}),
      Image.configure({allowBase64:false,HTMLAttributes:{class:'article-inline-image'}}),
      Underline,TextStyle,Color,Highlight.configure({multicolor:true}),TextAlign.configure({types:['heading','paragraph']}),Typography,
      Placeholder.configure({placeholder:'Start writing your article here…'})
    ],onUpdate:()=>{$('#saveHint').textContent='Unsaved changes';dirty=true;}});
    return tiptapEditor;
  }catch(err){console.warn('TipTap unavailable; using basic editor.',err);return null}
}

        workspaceRole='admin'; workspaceUser=admin;
        const boot=await api('/creators/bootstrap-self',{method:'POST'}).catch(()=>null);
        if(boot?.created){openModal('<div class="dialoghead"><div><h3>Creator account created</h3><div class="muted">Save this temporary password now. It is not stored in plain text.</div></div></div><div class="dialogbody"><div class="notice"><b>Username</b><br>tanzimfc<br><br><b>Temporary password</b><br><code style="font-size:15px;color:#dff8ff;user-select:all">'+esc(boot.temporaryPassword)+'</code></div><p class="muted" style="margin-top:12px">Creator login: /creator/login — change the password from Account after signing in.</p></div><div class="dialogfoot"><button class="btn primary" data-close>Done</button></div>');}
        document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>load(b.dataset.section));
        $('#logout').onclick=async()=>{try{await api('/logout',{method:'POST'})}finally{location.replace('/admin/')}};
        await load('overview');
        return;
      }
    }
    const creatorResponse=await fetch('/api/creator/me',{credentials:'same-origin',cache:'no-store'});
    if(creatorResponse.ok){
      const creator=await creatorResponse.json();
      if(creator?.creator){
        workspaceRole='creator'; workspaceUser=creator.creator;
        document.querySelectorAll('[data-admin-only]').forEach(x=>x.remove());
        document.querySelectorAll('.nav-external').forEach(x=>x.remove());
        document.querySelectorAll('[data-section]').forEach(x=>{if(!['overview','redeem','articles','inbox','account'].includes(x.dataset.section))x.remove();});
        document.querySelector('.side-card').innerHTML='<span>WORKSPACE MODE</span><strong>Creator workspace</strong><p>Write, save and submit your own articles for review</p>';
        document.querySelector('.navlabel').textContent='Creator';
        $('#crumb').textContent='Overview';$('#title').textContent='Overview';
        document.querySelector('.brand small').textContent='Creator workspace';
        $('#logout').onclick=async()=>{try{await fetch('/api/creator/logout',{method:'POST',credentials:'same-origin'})}finally{location.replace('/admin/')}};
        await load('overview');
        return;
      }
    }
    app.innerHTML='<div class="error">Admin session could not be verified. Please sign in again.</div>';
    state('Session verification failed',false);
  } catch(error) {
    app.innerHTML='<div class="error">'+esc(error?.message||'Unable to load admin workspace.')+'</div>';
    state('Workspace error',false);
  }
}
bootstrapWorkspace();
</script></body></html>
