<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>FC Mobile Tools Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f4f7ff;font:15px system-ui,-apple-system,sans-serif}aside{position:fixed;inset:0 auto 0 0;width:250px;padding:24px;background:#11182a;border-right:1px solid #26314a;display:flex;flex-direction:column;gap:9px}aside button{padding:11px;border:1px solid #303d59;border-radius:9px;background:#182238;color:#dce5f5;text-align:left;cursor:pointer}aside button.active{background:#263754;border-color:#5b739e}aside strong{margin-bottom:18px;font-size:12px;letter-spacing:.08em}#logout{margin-top:auto}main{margin-left:250px;padding:32px;max-width:1280px}header{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid #26314a;padding-bottom:22px;margin-bottom:22px}small,.muted{color:#8fa1bf}.eyebrow{color:#8fa1bf;letter-spacing:.08em;font-size:12px}h1{margin:7px 0;font-size:30px}h2{margin-top:0}.card,.panel{background:#121b2d;border:1px solid #263550;border-radius:14px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}label{display:block;margin:10px 0;font-weight:600}input,select,textarea{width:100%;padding:11px;margin-top:6px;border:1px solid #35445f;border-radius:8px;background:#0d1526;color:#fff;font:inherit}textarea{min-height:100px;resize:vertical}.primary,.secondary,.danger{padding:10px 15px;border-radius:8px;font-weight:700;cursor:pointer}.primary{border:0;background:#fff;color:#111}.secondary{border:1px solid #35445f;background:#182238;color:#fff}.danger{border:1px solid #713d49;background:#321822;color:#ffb8c2}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.status{min-height:20px}.ok{color:#76e0a0}.error{color:#ff8585}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.subnav button{padding:9px 12px;border:1px solid #35445f;background:#101a2d;color:#dce5f5;border-radius:8px;cursor:pointer}.subnav button.active{background:#2a3b5d}.club{display:grid;grid-template-columns:52px 1fr 1fr 1.6fr;gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid #25334d}.club img{width:42px;height:42px;object-fit:contain}.match{display:grid;grid-template-columns:90px 80px 1fr 1fr;gap:10px;align-items:end;padding:14px 0;border-bottom:1px solid #25334d}.match:last-child,.club:last-child{border-bottom:0}.section-title{margin:0 0 8px;font-size:18px}.hint{font-size:13px;color:#8fa1bf;margin-top:5px}.danger-zone{border-color:#633543}.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.media-card{border:1px solid #2c3a54;border-radius:10px;padding:10px}.media img{width:100%;height:140px;object-fit:cover;border-radius:8px;background:#0a0f1b}.metric{font-size:13px;color:#8fa1bf}.metric b{display:block;font-size:28px;color:#fff;margin-top:5px}.savebar{position:sticky;bottom:12px;display:flex;justify-content:space-between;gap:12px;padding:12px;background:#10192aee;border:1px solid #35445f;border-radius:12px;backdrop-filter:blur(8px)}@media(max-width:800px){aside{position:static;width:auto;flex-direction:row;flex-wrap:wrap}#logout{margin-top:0}main{margin-left:0;padding:18px}.grid.two{grid-template-columns:1fr}.club{grid-template-columns:42px 1fr}.club label:nth-child(n+3){grid-column:1/-1}.match{grid-template-columns:1fr 1fr}.match label:nth-child(3),.match label:nth-child(4){grid-column:1/-1}}
</style>
</head>
<body>
<aside><strong>FC MOBILE TOOLS · ADMIN</strong><button data-section="overview">Overview</button><button data-section="redeem">Redeem Codes</button><button data-section="football">Football Centre</button><button data-section="media">Media Library</button><button id="logout">Sign out</button></aside>
<main><header><div><div class="eyebrow">PRIVATE CONTROL PANEL</div><h1 id="title">Overview</h1></div><span id="status" class="status">Ready</span></header><section id="app"></section></main>
<script>
const $=s=>document.querySelector(s),app=$('#app'),status=$('#status');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch('/api/admin'+path,{credentials:'same-origin',...options});const b=await r.json().catch(()=>({}));if(r.status===401){location.replace('/admin/');throw Error('Session expired.')}if(!r.ok)throw Error(b.error||`Request failed (${r.status}).`);return b}
function msg(text,ok=false){status.textContent=text;status.className=`status ${ok?'ok':'error'}`}
function busy(button,on){if(button){button.disabled=on;button.dataset.old=button.dataset.old||button.textContent;button.textContent=on?'Saving…':button.dataset.old}}
async function overview(){app.innerHTML=`<div class="grid"><div class="card metric">Admin role<b>Administrator</b></div><div class="card metric">Content source<b>GitHub</b></div><div class="card metric">Publishing<b>Build → deploy</b></div></div><div class="card"><h2>Content control</h2><p class="muted">The Football Centre editor below controls the public Football Centre content without changing its public layout. Redeem Codes and Media Library remain separate tools.</p></div>`}
async function redeem(){const {codes}=await api('/redeem');app.innerHTML=`<div class="panel"><h2>Redeem Codes</h2><div class="grid"><label>Code<input id="code"></label><label>Reward<input id="reward"></label><label>Status<select id="codeStatus"><option value="active">Active</option><option value="scheduled">Scheduled</option><option value="expired">Expired</option></select></label><label>Release date<input id="releaseDate" type="date"></label><label>Expiry date<input id="expiryDate" type="date"></label><label>Region<input id="region" value="Global"></label></div><div class="savebar"><span class="muted">${codes.length} codes loaded from GitHub.</span><button class="primary" id="saveCode">Save code</button></div></div><div class="panel"><h3>Existing codes</h3>${codes.map(x=>`<div class="match"><strong>${esc(x.code)}</strong><span>${esc(x.status)}</span><span>${esc(x.reward)}</span><span>${esc(x.releaseDate)}${x.expiryDate?' → '+esc(x.expiryDate):''}</span></div>`).join('')}</div>`;$('#saveCode').onclick=async()=>{const b=$('#saveCode');busy(b,true);try{const r=await api('/redeem',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:$('#code').value,reward:$('#reward').value,status:$('#codeStatus').value,releaseDate:$('#releaseDate').value,expiryDate:$('#expiryDate').value||null,region:$('#region').value})});msg(`Saved to GitHub. Commit ${r.commitSha}`,true);await redeem()}catch(e){msg(e.message)}finally{busy(b,false)}}}
function footballTabs(active){return `<div class="subnav">${[['content','Content'],['matches','Matches'],['analysis','Analysis'],['totw','TOTW'],['settings','Settings']].map(([k,n])=>`<button data-ftab="${k}" class="${active===k?'active':''}">${n}</button>`).join('')}</div>`}
async function football(active='content'){const {content}=await api('/football');let html='';
if(active==='content') html=`${footballTabs(active)}<div class="panel"><h2>Clubs & logos</h2><p class="hint">These values feed the existing public Football Centre match cards.</p>${Object.entries(content.clubs).map(([id,c])=>`<div class="club"><img src="${esc(c.logo)}" alt=""><label>ID<input data-club="${id}" data-k="name" value="${esc(c.name)}"></label><label>Short name<input data-club="${id}" data-k="short" value="${esc(c.short)}"></label><label>Logo URL<input data-club="${id}" data-k="logo" value="${esc(c.logo)}"></label></div>`).join('')}</div>`;
if(active==='matches') html=`${footballTabs(active)}<div class="panel"><h2>Showdown matches</h2><p class="hint">Edit the actual public fixture list: week and home/away clubs. The existing prediction, result and points logic remains unchanged.</p>${content.matches.map((m,i)=>`<div class="match"><strong>Showdown ${String(i+1).padStart(2,'0')}</strong><label>Week<select data-match="${m.id}" data-k="week">${[1,2,3,4].map(w=>`<option ${Number(m.week)===w?'selected':''}>${w}</option>`).join('')}</select></label><label>Home<select data-match="${m.id}" data-k="home">${Object.entries(content.clubs).map(([id,c])=>`<option value="${id}" ${m.home===id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Away<select data-match="${m.id}" data-k="away">${Object.entries(content.clubs).map(([id,c])=>`<option value="${id}" ${m.away===id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div>`).join('')}</div>`;
if(active==='analysis') html=`${footballTabs(active)}<div class="panel"><h2>Analysis</h2><div class="grid"><label>Section label<input id="aLabel" value="${esc(content.analysis?.label)}"></label><label>Title<input id="aTitle" value="${esc(content.analysis?.title)}"></label></div><label>Warning<textarea id="aWarning">${esc(content.analysis?.warning)}</textarea></label><div class="grid"><label>Video embed URL<input id="aEmbed" value="${esc(content.analysis?.videoEmbedUrl||content.videoEmbedUrl)}"></label><label>Video watch URL<input id="aWatch" value="${esc(content.analysis?.videoWatchUrl||content.videoWatchUrl)}"></label><label>Video title<input id="aVideoTitle" value="${esc(content.analysis?.videoTitle)}"></label></div><label>Video body<textarea id="aVideoBody">${esc(content.analysis?.videoBody)}</textarea></label><label>Video warning<textarea id="aVideoWarning">${esc(content.analysis?.videoWarning)}</textarea></label></div>`;
if(active==='totw') html=`${footballTabs(active)}<div class="panel"><h2>Team of the Week</h2><div class="grid"><label>Label<input id="tLabel" value="${esc(content.totw?.label)}"></label><label>Title<input id="tTitle" value="${esc(content.totw?.title)}"></label><label>Chip<input id="tChip" value="${esc(content.totw?.chip)}"></label></div><label>Description<textarea id="tDesc">${esc(content.totw?.description)}</textarea></label><div class="grid"><label>Status label<input id="tStatusLabel" value="${esc(content.totw?.statusLabel)}"></label><label>Status title<input id="tStatusTitle" value="${esc(content.totw?.statusTitle)}"></label></div><label>Status body<textarea id="tStatusBody">${esc(content.totw?.statusBody)}</textarea></label><div class="grid"><label>Safety label<input id="tSafetyLabel" value="${esc(content.totw?.safetyLabel)}"></label><label>Safety title<input id="tSafetyTitle" value="${esc(content.totw?.safetyTitle)}"></label></div><label>Safety body<textarea id="tSafetyBody">${esc(content.totw?.safetyBody)}</textarea></label></div>`;
if(active==='settings') html=`${footballTabs(active)}<div class="grid two"><div class="panel"><h2>Cycle</h2><label>Cycle ID<input id="sCycle" value="${esc(content.settings?.cycleId||content.cycle?.id)}"></label><label>Starting balance<input id="sStart" type="number" min="0" value="${Number(content.settings?.startingBalance||0)}"></label></div><div class="panel"><h2>Scoring</h2><label>Played points<input id="sPlayed" type="number" min="0" value="${Number(content.settings?.scoring?.played??80)}"></label><label>World Class bonus<input id="sWorld" type="number" min="0" value="${Number(content.settings?.scoring?.worldClass??20)}"></label><label>Correct prediction bonus<input id="sCorrect" type="number" min="0" value="${Number(content.settings?.scoring?.correctPrediction??400)}"></label></div></div><div class="panel danger-zone"><h3>Important</h3><p class="muted">These are public event settings. Changing scoring changes what the Football Centre displays for future visitors; browser-local progress is not rewritten.</p></div>`;
app.innerHTML=html+`<div class="savebar"><span class="muted">Changes are written to GitHub only when you press Save.</span><button class="primary" id="saveFootball">Save Football Centre</button></div>`;
document.querySelectorAll('[data-ftab]').forEach(b=>b.onclick=()=>football(b.dataset.ftab));
$('#saveFootball').onclick=async()=>{const b=$('#saveFootball');busy(b,true);try{if(active==='content'){for(const [id,c] of Object.entries(content.clubs)){for(const k of ['name','short','logo'])content.clubs[id][k]=document.querySelector(`[data-club="${id}"][data-k="${k}"]`).value.trim()}}
if(active==='matches'){for(const m of content.matches){for(const k of ['week','home','away']){const el=document.querySelector(`[data-match="${m.id}"][data-k="${k}"]`);m[k]=k==='week'?Number(el.value):el.value}}}
if(active==='analysis'){content.analysis={...(content.analysis||{}),label:$('#aLabel').value.trim(),title:$('#aTitle').value.trim(),warning:$('#aWarning').value.trim(),videoEmbedUrl:$('#aEmbed').value.trim(),videoWatchUrl:$('#aWatch').value.trim(),videoTitle:$('#aVideoTitle').value.trim(),videoBody:$('#aVideoBody').value.trim(),videoWarning:$('#aVideoWarning').value.trim()};content.videoEmbedUrl=content.analysis.videoEmbedUrl;content.videoWatchUrl=content.analysis.videoWatchUrl}
if(active==='totw'){content.totw={...(content.totw||{}),label:$('#tLabel').value.trim(),title:$('#tTitle').value.trim(),chip:$('#tChip').value.trim(),description:$('#tDesc').value.trim(),statusLabel:$('#tStatusLabel').value.trim(),statusTitle:$('#tStatusTitle').value.trim(),statusBody:$('#tStatusBody').value.trim(),safetyLabel:$('#tSafetyLabel').value.trim(),safetyTitle:$('#tSafetyTitle').value.trim(),safetyBody:$('#tSafetyBody').value.trim()}}
if(active==='settings'){content.settings={cycleId:$('#sCycle').value.trim(),startingBalance:Number($('#sStart').value||0),scoring:{played:Number($('#sPlayed').value||0),worldClass:Number($('#sWorld').value||0),correctPrediction:Number($('#sCorrect').value||0)}};content.cycle={...(content.cycle||{}),id:content.settings.cycleId}}
const r=await api('/football',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content})});msg(`Saved to GitHub. Commit ${r.commitSha}`,true)}catch(e){msg(e.message)}finally{busy(b,false)}}}
async function media(){app.innerHTML='<div class="panel"><h2>Media Library</h2><p class="hint">Cloudinary images are stored centrally and can be copied into content fields.</p><input id="upload" type="file" accept="image/*"><div id="media" class="media"></div></div>';try{const {resources}=await api('/media');$('#media').innerHTML=resources.map(x=>`<div class="media-card"><img src="${esc(x.url)}" alt=""><button class="secondary" data-url="${esc(x.url)}">Copy URL</button></div>`).join('')||'<p>No Cloudinary images found.</p>';document.querySelectorAll('[data-url]').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(b.dataset.url);msg('URL copied.',true)})}catch(e){$('#media').innerHTML=`<p class="error">${esc(e.message)}</p>`}$('#upload').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const p=await api('/media/sign');const form=new FormData();form.append('file',file);form.append('api_key',p.apiKey);form.append('timestamp',p.timestamp);form.append('folder',p.folder);form.append('signature',p.signature);const r=await fetch(`https://api.cloudinary.com/v1_1/${p.cloudName}/image/upload`,{method:'POST',body:form});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b?.error?.message||`Upload failed (${r.status}).`);msg('Upload complete.',true);await media()}catch(x){msg(x.message)}}}
async function load(section){document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===section));$('#title').textContent=section==='overview'?'Overview':section==='redeem'?'Redeem Codes':section==='football'?'Football Centre':'Media Library';try{await ({overview,redeem,football,media}[section])()}catch(e){app.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>load(b.dataset.section));$('#logout').onclick=async()=>{await api('/logout',{method:'POST'});location.replace('/admin/')};load('overview');
</script></body></html>
