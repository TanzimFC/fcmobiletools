<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>FC Mobile Tools — Admin</title><style>
:root{--bg:#070a10;--panel:#0f141d;--panel2:#131a24;--line:#242d3a;--text:#f7f8fb;--muted:#8792a4;--accent:#786cff;--good:#42d99a;--bad:#ff6978}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:#0b0f16}.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 24px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#8175ff,#5548d6);font-weight:900}.brand b{font-size:13px}.brand small{display:block;color:var(--muted);font-size:11px}.label{color:#5f6979;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:10px}.nav{display:grid;gap:4px}.nav button{width:100%;border:1px solid transparent;background:transparent;color:#9ba5b5;text-align:left;padding:11px 12px;border-radius:10px}.nav button:hover{background:#141a24;color:#fff}.nav button.active{background:#1a2030;border-color:#30394b;color:#fff;box-shadow:inset 3px 0 #786cff}.signout{margin-top:auto;padding-top:20px}.signout button{width:100%;border:1px solid var(--line);background:#111721;color:#b9c1ce;border-radius:10px;padding:10px}.main{min-width:0}.top{height:74px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid var(--line);background:#070a10ed;backdrop-filter:blur(16px)}.crumb{font-size:11px;color:var(--muted)}.top h1{font-size:20px;margin:2px 0}.state{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}.state i{width:7px;height:7px;border-radius:50%;background:var(--good)}.state i.bad{background:var(--bad)}.body{padding:30px 34px 60px;max-width:1450px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.hero h2{font-size:30px;letter-spacing:-.035em;margin:0 0 4px}.hero p{margin:0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:linear-gradient(180deg,#111721,#0e131b);border:1px solid var(--line);border-radius:15px}.stat{padding:18px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:5px}.stat span{display:block;color:#667183;font-size:11px;margin-top:3px}.section{padding:21px;margin-top:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:17px}.head h3{margin:0;font-size:16px}.head p{margin:3px 0 0;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field span{display:block;color:#c8cfda;font-size:12px;font-weight:650;margin-bottom:7px}.field small{display:block;color:#657082;margin-top:5px}.input,select,textarea{width:100%;border:1px solid #2a3443;border-radius:10px;background:#090e15;color:#fff;padding:11px 12px;outline:none}.input:focus,select:focus,textarea:focus{border-color:#7669f4;box-shadow:0 0 0 3px #786cff14}textarea{min-height:105px;resize:vertical}.btn{border:1px solid #303a4b;background:#151c27;color:#e9edf5;border-radius:9px;padding:9px 13px;font-weight:650}.btn:hover{background:#1c2532}.primary{border-color:#8d84ff;background:linear-gradient(135deg,#7d70ff,#6559e8);box-shadow:0 8px 22px #6f62ff25}.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);background:#0d1219;border-radius:11px;width:max-content;max-width:100%;overflow:auto;margin-bottom:17px}.tabs button{border:0;background:transparent;color:#808b9d;padding:8px 12px;border-radius:8px;white-space:nowrap}.tabs button.active{background:#20283a;color:#fff}.notice{padding:12px 14px;border:1px solid #293444;background:#0c121a;border-radius:10px;color:#98a3b3;font-size:12px;margin-bottom:14px}.clubgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.club{padding:15px;border:1px solid #273140;border-radius:13px;background:#0d131b}.clubhead{display:flex;align-items:center;gap:11px;margin-bottom:12px}.clubimg{width:46px;height:46px;object-fit:contain;padding:5px;border-radius:11px;background:#080d13;border:1px solid #293342}.clubname{font-weight:750}.clubid{font-size:10px;color:#657082;margin-top:2px}.matchgrid{display:grid;gap:10px}.match{display:grid;grid-template-columns:70px 1fr 1fr;gap:12px;align-items:end;padding:14px;border:1px solid #273140;background:#0d131b;border-radius:13px}.num{color:#9d94ff;font-weight:850}.week{font-size:10px;color:#697487}.codegrid{display:grid;gap:8px}.code{display:grid;grid-template-columns:1.1fr 1.6fr .8fr 1fr 1fr auto;gap:12px;align-items:center;padding:13px 14px;border:1px solid #273140;background:#0d131b;border-radius:11px}.code.headrow{border:0;background:transparent;color:#657082;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.pill{display:inline-block;border-radius:99px;padding:4px 8px;font-size:10px;font-weight:750}.active{background:#123426;color:#5be5a8}.scheduled{background:#2b2413;color:#f3cc6d}.expired{background:#2b171c;color:#ff8e9b}.mediahead{display:flex;gap:10px;align-items:center;margin-bottom:15px}.search{max-width:340px}.upload{border:1px dashed #3a4659;border-radius:13px;padding:24px;text-align:center;margin-bottom:17px;background:#0b1118}.upload b{display:block;font-size:14px}.upload span{display:block;color:var(--muted);font-size:12px;margin:4px 0 13px}.mediagrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.media{overflow:hidden;border:1px solid #273140;border-radius:13px;background:#0d131b}.thumb{height:145px;background:#080d13}.thumb img{width:100%;height:100%;object-fit:cover}.minfo{padding:10px}.minfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}.minfo small{display:block;color:#667183;font-size:10px;margin-top:2px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.save{position:sticky;bottom:16px;z-index:8;margin-top:20px;padding:12px 14px;border:1px solid #303a4b;border-radius:12px;background:#101620eb;backdrop-filter:blur(15px);display:flex;justify-content:space-between;align-items:center;box-shadow:0 16px 45px #0007}.muted{color:var(--muted)}.error{padding:14px;border:1px solid #5a2934;background:#211218;color:#ffabb3;border-radius:11px}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.mediagrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.layout{display:block}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;font-size:11px}.signout{display:none}.top{padding:0 18px}.body{padding:22px 18px}.grid,.grid3,.clubgrid{grid-template-columns:1fr}.code.headrow{display:none}.code{grid-template-columns:1fr 1fr}.code>*:last-child{grid-column:1/-1}.match{grid-template-columns:55px 1fr 1fr}.hero{align-items:start;flex-direction:column}.save{position:static}.mediagrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="layout"><aside class="side"><div class="brand"><div class="logo">FC</div><div><b>FC Mobile Tools</b><small>Admin workspace</small></div></div><div class="label">Workspace</div><nav class="nav"><button data-section="overview">Overview</button><button data-section="redeem">Redeem Codes</button><button data-section="football">Football Centre</button><button data-section="media">Media Library</button></nav><div class="signout"><button id="logout">Sign out</button></div></aside><div class="main"><header class="top"><div><div class="crumb">Admin / <span id="crumb">Overview</span></div><h1 id="title">Overview</h1></div><div class="state"><i id="dot"></i><span id="status">Ready</span></div></header><main class="body" id="app"></main></div></div><script>
const $=s=>document.querySelector(s),app=$('#app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let football=null,mediaTarget=null,editing=null;
async function api(path,o={}){const r=await fetch('/api/admin'+path,{credentials:'same-origin',...o});const b=await r.json().catch(()=>({}));if(r.status===401){location.replace('/admin/');throw Error('Session expired.')}if(!r.ok)throw Error(b.error||`Request failed (${r.status}).`);return b}
function state(t,ok=true){$('#status').textContent=t;$('#dot').className=ok?'':'bad'}function busy(b,on){if(!b)return;b.disabled=on;if(on){b.dataset.t=b.textContent;b.textContent='Saving…'}else b.textContent=b.dataset.t||b.textContent}function nav(s){document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===s));const n=s==='overview'?'Overview':s==='redeem'?'Redeem Codes':s==='football'?'Football Centre':'Media Library';$('#title').textContent=n;$('#crumb').textContent=n}
function tabs(a){return `<div class="tabs">${[['content','Content'],['matches','Matches'],['analysis','Analysis'],['totw','TOTW'],['settings','Settings']].map(x=>`<button class="${a===x[0]?'active':''}" data-tab="${x[0]}">${x[1]}</button>`).join('')}</div>`}function savebar(){return `<div class="save"><span class="muted">Nothing is published until you save.</span><button class="btn primary" id="save">Save changes</button></div>`}
async function overview(){const [r,f,m]=await Promise.all([api('/redeem'),api('/football'),api('/media')]);app.innerHTML=`<div class="hero"><div><h2>Dashboard</h2><p>Your content workspace at a glance.</p></div></div><div class="cards"><div class="card stat"><small>Redeem codes</small><strong>${r.codes.length}</strong><span>${r.codes.filter(x=>x.status==='active').length} active</span></div><div class="card stat"><small>Football clubs</small><strong>${Object.keys(f.content.clubs||{}).length}</strong><span>Your editable club library</span></div><div class="card stat"><small>Showdowns</small><strong>${f.content.matches?.length||0}</strong><span>Current fixture list</span></div><div class="card stat"><small>Media assets</small><strong>${m.resources?.length||0}</strong><span>Cloudinary library</span></div></div><div class="card section"><div class="head"><div><h3>Quick actions</h3><p>Go directly to the tool you need.</p></div></div><div class="grid3"><button class="btn" data-go="redeem">Create / edit code</button><button class="btn" data-go="football">Edit Football Centre</button><button class="btn" data-go="media">Manage media</button></div></div>`;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>load(b.dataset.go))}
async function redeem(){const {codes}=await api('/redeem');const c=editing?codes.find(x=>String(x.code).toUpperCase()===editing):null;app.innerHTML=`<div class="hero"><div><h2>Redeem Codes</h2><p>Manage live, scheduled and expired codes without touching the public layout.</p></div><button class="btn primary" id="new">+ New code</button></div><div class="card section"><div class="head"><div><h3>${c?'Edit code':'Create code'}</h3><p>Use the native calendar controls for release and expiry dates.</p></div></div><div class="grid"><label class="field"><span>Code</span><input class="input" id="code" value="${esc(c?.code||'')}"></label><label class="field"><span>Reward</span><input class="input" id="reward" value="${esc(c?.reward||'')}"></label><label class="field"><span>Status</span><select id="status"><option value="active" ${c?.status==='active'?'selected':''}>Active</option><option value="scheduled" ${c?.status==='scheduled'?'selected':''}>Scheduled</option><option value="expired" ${c?.status==='expired'?'selected':''}>Expired</option></select></label><label class="field"><span>Region</span><input class="input" id="region" value="${esc(c?.region||'Global')}"></label><label class="field"><span>Release date</span><input class="input" id="release" type="date" value="${esc(c?.releaseDate||'')}"></label><label class="field"><span>Expiry date</span><input class="input" id="expiry" type="date" value="${esc(c?.expiryDate||'')}"></label></div><div class="toolbar" style="margin-top:16px"><button class="btn primary" id="saveCode">${c?'Update code':'Create code'}</button>${c?'<button class="btn" id="cancel">Cancel</button>':''}</div></div><div class="card section"><div class="head"><div><h3>Code list</h3><p>${codes.length} total</p></div></div><div class="codegrid"><div class="code headrow"><span>Code</span><span>Reward</span><span>Status</span><span>Release</span><span>Expiry</span><span></span></div>${codes.length?codes.map(x=>`<div class="code"><strong>${esc(x.code)}</strong><span>${esc(x.reward)}</span><span><i class="pill ${esc(x.status)}">${esc(x.status)}</i></span><span>${esc(x.releaseDate||'—')}</span><span>${esc(x.expiryDate||'No expiry')}</span><button class="btn" data-edit="${esc(x.code)}">Edit</button></div>`).join(''):'<div class="muted">No codes found.</div>'}</div></div>`;$('#new').onclick=()=>{editing=null;redeem()};if($('#cancel'))$('#cancel').onclick=()=>{editing=null;redeem()};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit.toUpperCase();redeem()});$('#saveCode').onclick=async()=>{const b=$('#saveCode');busy(b,true);try{const r=await api('/redeem',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:$('#code').value,reward:$('#reward').value,status:$('#status').value,releaseDate:$('#release').value,expiryDate:$('#expiry').value||null,region:$('#region').value})});editing=null;state(r.action==='updated'?'Code updated.':'Code created.');await redeem()}catch(e){state(e.message,false)}finally{busy(b,false)}}}
async function media(){let resources=[];try{resources=(await api('/media')).resources||[]}catch(e){app.innerHTML=`<div class="error">${esc(e.message)}</div>`;return}app.innerHTML=`<div class="hero"><div><h2>Media Library</h2><p>Browse, search, upload and reuse images from one place.</p></div><label class="btn primary" for="upload">+ Upload image</label><input id="upload" type="file" accept="image/*" hidden></div><div class="card section"><div class="upload"><b>Drop your visual workflow here</b><span>Upload an image to Cloudinary, then reuse its URL in Football Centre.</span><label class="btn" for="upload">Choose image</label></div><div class="mediahead"><input class="input search" id="search" placeholder="Search media…"><span class="muted">${resources.length} assets</span></div><div class="mediagrid" id="grid">${resources.length?resources.map(x=>`<article class="media" data-card data-name="${esc(x.publicId||'')}" data-url="${esc(x.url)}"><div class="thumb"><img src="${esc(x.url)}" alt=""></div><div class="minfo"><b title="${esc(x.publicId||'')}">${esc(x.publicId||'Image')}</b><small>${esc(x.format||'image')} · ${x.width||'—'}×${x.height||'—'}</small><div class="toolbar" style="margin-top:9px"><button class="btn" data-use="${esc(x.url)}">Use image</button><button class="btn" data-copy="${esc(x.url)}">Copy URL</button></div></div></article>`).join(''):'<div class="muted">No media assets found.</div>'}</div></div>`;$('#search').oninput=e=>document.querySelectorAll('[data-card]').forEach(x=>x.style.display=(x.dataset.name||'').toLowerCase().includes(e.target.value.toLowerCase())?'':'none');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);state('URL copied.')}catch{state('Clipboard access failed.',false)}});document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{if(!mediaTarget){state('Open Football Centre → Clubs and choose a logo field first.',false);return}mediaTarget.value=b.dataset.use;mediaTarget.dispatchEvent(new Event('input'));state('Image selected.')});$('#upload').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const p=await api('/media/sign');const f=new FormData();f.append('file',file);f.append('api_key',p.apiKey);f.append('timestamp',p.timestamp);f.append('folder',p.folder);f.append('signature',p.signature);const r=await fetch(`https://api.cloudinary.com/v1_1/${p.cloudName}/image/upload`,{method:'POST',body:f});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b?.error?.message||`Upload failed (${r.status}).`);state('Image uploaded.');await media()}catch(e){state(e.message,false)}e.target.value=''}}
function club(id,c){return `<article class="club"><div class="clubhead"><img class="clubimg" src="${esc(c.logo)}" alt=""><div><div class="clubname">${esc(c.name||'Unnamed club')}</div><div class="clubid">ID · ${esc(id)}</div></div></div><div class="grid"><label class="field"><span>Name</span><input class="input" data-club="${esc(id)}" data-k="name" value="${esc(c.name)}"></label><label class="field"><span>Short name</span><input class="input" data-club="${esc(id)}" data-k="short" value="${esc(c.short)}"></label></div><label class="field" style="margin-top:12px"><span>Logo URL</span><input class="input" data-club="${esc(id)}" data-k="logo" value="${esc(c.logo)}"></label><button class="btn" data-pick="${esc(id)}" style="margin-top:7px">Choose from Media Library</button></article>`}
async function footballTab(active='content'){football=(await api('/football')).content;let h=tabs(active);if(active==='content')h+=`<div class="hero"><div><h2>Club library</h2><p>These are the only clubs available to the match editor. Add as many real clubs as your content needs.</p></div><button class="btn primary" id="add">+ Add club</button></div><div class="notice"><b>Flexible club source:</b> the current clubs are existing data, not a rule that Showdown must use these teams. Add or edit clubs here and the match dropdowns update automatically.</div><div class="clubgrid">${Object.entries(football.clubs).map(([id,c])=>club(id,c)).join('')}</div>`;if(active==='matches')h+=`<div class="hero"><div><h2>Showdown schedule</h2><p>Every Home/Away selector is populated from the editable club library.</p></div></div><div class="notice"><b>No fixed team assumption:</b> the editor stores club IDs, while the public page resolves those IDs to the current club names and logos.</div><div class="matchgrid">${football.matches.map((m,i)=>{const opts=Object.entries(football.clubs).map(([id,c])=>`<option value="${esc(id)}" ${m.home===id?'selected':''}>${esc(c.name)}</option>`).join(''),away=Object.entries(football.clubs).map(([id,c])=>`<option value="${esc(id)}" ${m.away===id?'selected':''}>${esc(c.name)}</option>`).join('');return `<article class="match"><div><div class="num">${String(i+1).padStart(2,'0')}</div><div class="week">Week ${esc(m.week)}</div></div><label class="field"><span>Home club</span><select data-match="${esc(m.id)}" data-k="home">${opts}</select></label><label class="field"><span>Away club</span><select data-match="${esc(m.id)}" data-k="away">${away}</select></label></article>`}).join('')}</div>`;if(active==='analysis')h+=`<div class="card section"><div class="head"><div><h3>Analysis</h3><p>Public Football Centre analysis and video content.</p></div></div><div class="grid"><label class="field"><span>Section label</span><input class="input" data-field="analysis.label" value="${esc(football.analysis?.label)}"></label><label class="field"><span>Title</span><input class="input" data-field="analysis.title" value="${esc(football.analysis?.title)}"></label></div><label class="field"><span>Warning</span><textarea data-field="analysis.warning">${esc(football.analysis?.warning)}</textarea></label><div class="grid"><label class="field"><span>Video embed URL</span><input class="input" data-field="analysis.videoEmbedUrl" value="${esc(football.analysis?.videoEmbedUrl)}"></label><label class="field"><span>Video watch URL</span><input class="input" data-field="analysis.videoWatchUrl" value="${esc(football.analysis?.videoWatchUrl)}"></label><label class="field"><span>Video title</span><input class="input" data-field="analysis.videoTitle" value="${esc(football.analysis?.videoTitle)}"></label></div><label class="field"><span>Video body</span><textarea data-field="analysis.videoBody">${esc(football.analysis?.videoBody)}</textarea></label><label class="field"><span>Video warning</span><textarea data-field="analysis.videoWarning">${esc(football.analysis?.videoWarning)}</textarea></label></div>`;if(active==='totw')h+=`<div class="card section"><div class="head"><div><h3>Team of the Week</h3><p>Edit the actual TOTW text fields present in the current public data model.</p></div></div><div class="grid"><label class="field"><span>Label</span><input class="input" data-field="totw.label" value="${esc(football.totw?.label)}"></label><label class="field"><span>Title</span><input class="input" data-field="totw.title" value="${esc(football.totw?.title)}"></label><label class="field"><span>Chip</span><input class="input" data-field="totw.chip" value="${esc(football.totw?.chip)}"></label></div><label class="field"><span>Description</span><textarea data-field="totw.description">${esc(football.totw?.description)}</textarea></label><div class="grid"><label class="field"><span>Status label</span><input class="input" data-field="totw.statusLabel" value="${esc(football.totw?.statusLabel)}"></label><label class="field"><span>Status title</span><input class="input" data-field="totw.statusTitle" value="${esc(football.totw?.statusTitle)}"></label></div><label class="field"><span>Status body</span><textarea data-field="totw.statusBody">${esc(football.totw?.statusBody)}</textarea></label><div class="grid"><label class="field"><span>Safety label</span><input class="input" data-field="totw.safetyLabel" value="${esc(football.totw?.safetyLabel)}"></label><label class="field"><span>Safety title</span><input class="input" data-field="totw.safetyTitle" value="${esc(football.totw?.safetyTitle)}"></label></div><label class="field"><span>Safety body</span><textarea data-field="totw.safetyBody">${esc(football.totw?.safetyBody)}</textarea></label></div>`;if(active==='settings')h+=`<div class="grid"><div class="card section"><div class="head"><div><h3>Cycle</h3><p>Active Football Centre cycle.</p></div></div><label class="field"><span>Cycle ID</span><input class="input" data-field="settings.cycleId" value="${esc(football.settings?.cycleId)}"></label><label class="field"><span>Starting balance</span><input class="input" type="number" min="0" data-field="settings.startingBalance" value="${Number(football.settings?.startingBalance||0)}"></label></div><div class="card section"><div class="head"><div><h3>Scoring</h3><p>Values used by public reward logic.</p></div></div><label class="field"><span>Played points</span><input class="input" type="number" min="0" data-field="settings.scoring.played" value="${Number(football.settings?.scoring?.played||0)}"></label><label class="field"><span>World Class bonus</span><input class="input" type="number" min="0" data-field="settings.scoring.worldClass" value="${Number(football.settings?.scoring?.worldClass||0)}"></label><label class="field"><span>Correct prediction bonus</span><input class="input" type="number" min="0" data-field="settings.scoring.correctPrediction" value="${Number(football.settings?.scoring?.correctPrediction||0)}"></label></div></div>`;app.innerHTML=h+savebar();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>footballTab(b.dataset.tab));document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{mediaTarget=document.querySelector(`[data-club="${b.dataset.pick}"][data-k="logo"]`);load('media')});document.querySelectorAll('[data-club][data-k="logo"]').forEach(i=>i.oninput=()=>{const im=i.closest('.club')?.querySelector('.clubimg');if(im)im.src=i.value});if($('#add'))$('#add').onclick=()=>{const id=prompt('Club ID (letters, numbers, hyphens):','club-'+(Object.keys(football.clubs).length+1));if(!id)return;if(!/^[a-z0-9-]+$/i.test(id)||football.clubs[id])return state('Use a unique club ID.',false);football.clubs[id]={name:'New Club',short:'New Club',logo:''};footballTab('content')};$('#save').onclick=async()=>{const b=$('#save');busy(b,true);try{const set=(p,v)=>{const a=p.split('.');let o=football;for(const k of a.slice(0,-1))o=o[k];o[a.at(-1)]=v};document.querySelectorAll('[data-field]').forEach(e=>{const p=e.dataset.field;const n=p.startsWith('settings.')&&p!=='settings.cycleId';set(p,n?Number(e.value):e.value.trim())});for(const id of Object.keys(football.clubs))for(const k of ['name','short','logo']){const e=document.querySelector(`[data-club="${id}"][data-k="${k}"]`);if(e)football.clubs[id][k]=e.value.trim()}for(const m of football.matches){for(const k of ['home','away']){const e=document.querySelector(`[data-match="${m.id}"][data-k="${k}"]`);if(e)m[k]=e.value}}const r=await api('/football',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content:football})});state('Football Centre saved.')}catch(e){state(e.message,false)}finally{busy(b,false)}}}
