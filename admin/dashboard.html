const rxaApi=(path,body,method)=>api('/redeem'+path,body===undefined&&!method?{}:{method:method||'POST',headers:{'content-type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});

async function rxaLoad(){
  const d=await api('/redeem');
  RXA.codes=d.codes||[];RXA.stats=d.stats||{};RXA.serverDate=d.serverDate||'';
  for(const c of [...RXA.selected])if(!RXA.codes.some(x=>x.code===c))RXA.selected.delete(c);
}

function rxaFiltered(){
  const words=RXA.q.toLowerCase().split(/\s+/).filter(Boolean);
  let list=RXA.codes.filter(c=>{
    if(RXA.status==='attention'){if(!rxaNeedsAttention(c))return false}
    else if(RXA.status!=='all'&&c.status!==RXA.status)return false;
    if(!words.length)return true;
    const hay=[c.code,c.reward,c.region,c.notes,c.status,c.releaseDate,c.expiryDate].filter(Boolean).join(' ').toLowerCase();
    return words.every(w=>hay.includes(w));
  });
  if(RXA.sort==='old')list=[...list].sort((a,b)=>a.releaseDate.localeCompare(b.releaseDate));
  else if(RXA.sort==='az')list=[...list].sort((a,b)=>a.code.localeCompare(b.code));
  else if(RXA.sort==='edited')list=[...list].sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));
  return list;
}

function rxaRow(c,latest){
  const ex=rxaExpiry(c),sel=RXA.selected.has(c.code),admin=workspaceRole==='admin';
  const auto=c.storedStatus==='active'&&c.status==='expired';
  const due=c.status==='scheduled'&&c.releaseDate<=rxaToday();
  const acts=[
    `<button class="rxa-ib" data-act="edit" title="Edit" aria-label="Edit ${esc(c.code)}">${rxaSvg('edit')}</button>`,
    c.status==='active'?`<button class="rxa-ib" data-act="verify" title="Mark verified today" aria-label="Verify ${esc(c.code)}">${rxaSvg('check')}</button><button class="rxa-ib rxa-warn" data-act="expire" title="Mark expired" aria-label="Expire ${esc(c.code)}">${rxaSvg('clock')}</button>`:'',
    c.status==='scheduled'?`<button class="rxa-ib rxa-go" data-act="activate" title="Go live now" aria-label="Activate ${esc(c.code)}">${rxaSvg('bolt')}</button>`:'',
    `<button class="rxa-ib" data-act="dup" title="Duplicate" aria-label="Duplicate ${esc(c.code)}">${rxaSvg('dup')}</button>`,
    admin?`<button class="rxa-ib rxa-bad" data-act="delete" title="Delete" aria-label="Delete ${esc(c.code)}">${rxaSvg('trash')}</button>`:''
  ].join('');
  return `<div class="rxa-row${sel?' is-sel':''}" data-code="${esc(c.code)}">
    <label class="rxa-check"><input type="checkbox" data-sel="${esc(c.code)}" ${sel?'checked':''} aria-label="Select ${esc(c.code)}"></label>
    <div class="rxa-c-code"><button type="button" class="rxa-codebtn" data-act="copy" title="Copy code">${esc(c.code)}${rxaSvg('copy',13)}</button>${latest?'<em class="rxa-latest">LATEST</em>':''}</div>
    <div class="rxa-c-reward"><div class="rxa-chips">${rxaChips(c.reward)}</div><small>${esc(c.region)}${c.notes?' · '+esc(c.notes):''}</small></div>
    <div class="rxa-c-status">${rxaPill(c)}${auto?'<small class="rxa-hint">Auto-expired · tidy up</small>':''}${due?'<small class="rxa-hint rxa-hint-go">Release date reached</small>':''}</div>
    <div class="rxa-c-dates"><span>Added ${esc(rxaFmt(c.releaseDate))}</span><span class="${ex.tone?'rxa-t-'+ex.tone:''}">${esc(ex.t)}</span></div>
    <div class="rxa-c-ver"><span>${esc(rxaRel(c.lastVerified))}</span><small>by ${esc(String(c.updatedBy||'').replace('creator:',''))}</small></div>
    <div class="rxa-acts">${acts}</div>
  </div>`;
}

function rxaRender(){
  const s=RXA.stats,list=rxaFiltered();
  const set=(id,v)=>{const n=$('#'+id);if(n)n.textContent=v};
  set('rxaK-active',s.active||0);set('rxaK-soon',s.expiringSoon||0);set('rxaK-sched',s.scheduled||0);set('rxaK-exp',s.expired||0);set('rxaK-total',s.total||0);
  const attn=RXA.codes.filter(rxaNeedsAttention).length;
  const counts={all:RXA.codes.length,active:s.active||0,scheduled:s.scheduled||0,expired:s.expired||0,attention:attn};
  $('#rxaTabs').innerHTML=[['all','All'],['active','Active'],['scheduled','Scheduled'],['expired','Expired'],['attention','Needs attention']]
    .map(([k,l])=>`<button type="button" class="${RXA.status===k?'is-on':''}${k==='attention'&&attn?' has-alert':''}" data-tab="${k}">${l}<em>${counts[k]}</em></button>`).join('');
  const latestCode=(RXA.codes.find(c=>c.status==='active')||{}).code;
  const allSel=list.length&&list.every(c=>RXA.selected.has(c.code));
  $('#rxaList').innerHTML=list.length?list.map(c=>rxaRow(c,c.code===latestCode)).join(''):
    `<div class="rxa-empty">${RXA.codes.length?'No codes match these filters.':'No codes yet. Publish your first one above.'}</div>`;
  const head=$('#rxaSelAll');if(head){head.checked=Boolean(allSel);head.indeterminate=!allSel&&list.some(c=>RXA.selected.has(c.code))}
  set('rxaShown',list.length+(list.length===RXA.codes.length?'':' of '+RXA.codes.length)+' codes');
  const n=RXA.selected.size,bar=$('#rxaBulkbar');
  bar.hidden=!n;if(n)$('#rxaSelN').textContent=n+' selected';
  const delBtn=$('#rxaBulkDelete');if(delBtn)delBtn.hidden=workspaceRole!=='admin';
}

async function rxaRefresh(){try{await rxaLoad();rxaRender()}catch(e){state(e.message,false)}}

/* ----- modal helpers ----- */
function rxaConfirm({title,body,confirm='Confirm',danger=false}){
  return new Promise(resolve=>{
    openModal(`<div class="rxa-dlg rxa-dlg-sm"><div class="rxa-dlg-head"><h3>${esc(title)}</h3></div><div class="rxa-dlg-body"><p>${body}</p></div><div class="rxa-dlg-foot"><button class="btn" id="rxaNo">Cancel</button><button class="btn ${danger?'rxa-danger':'primary'}" id="rxaYes">${esc(confirm)}</button></div></div>`);
    let done=false;const fin=v=>{if(done)return;done=true;closeModal();resolve(v)};
    $('#rxaNo').onclick=()=>fin(false);$('#rxaYes').onclick=()=>fin(true);$('#rxaYes').focus();
    const obs=new MutationObserver(()=>{if(!modal.classList.contains('open')){obs.disconnect();fin(false)}});obs.observe(modal,{attributes:true,attributeFilter:['class']});
  });
}

async function rxaDelete(codes){

  const ok=await rxaConfirm({title:one?'Delete this code?':`Delete ${codes.length} codes?`,body:one?`<b>${esc(codes[0])}</b> will be removed from the public page and the archive. This cannot be undone. If it simply ended, use <b>Mark expired</b> instead so it stays in the archive.`:`These ${codes.length} codes will be permanently removed. If they simply ended, use <b>Mark expired</b> instead.`,confirm:'Delete',danger:true});

  RXA.selected.clear();
  await rxaBulk('delete',codes,'{n} code(s) deleted');

async function rxaQuickPublish(){
  const code=$('#rxaQCode').value.trim(),reward=$('#rxaQReward').value.trim(),btn=$('#rxaQGo');

  busy(btn,true);

/* ----- bulk import ----- */
function rxaParseLines(text){
  return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(line=>{
    const m=line.match(/^(\S+)\s*(.*)$/);if(!m)return null;
    const code=m[1].replace(/[,;|:]+$/,'').toUpperCase(),reward=m[2].replace(/^[\s\-–—|:,\t]+/,'').trim();
    return{code,reward};
  }).filter(Boolean);
}
function rxaBulkModal(){
  const t=rxaToday();
  openModal(`<div class="rxa-dlg"><div class="rxa-dlg-head"><div><h3>Bulk add codes</h3><p>One code per line: the code, then the reward. Handy when a livestream drops several at once.</p></div><button class="close" data-close aria-label="Close">×</button></div>
  <div class="rxa-dlg-body">
    <label class="rxa-f"><span>Codes</span><textarea class="input rxa-mono" id="rxaBulkText" rows="6" placeholder="GEMSRAIN2026  1,500 Gems&#10;DRAFTDAY  FC Draft Voucher + 100 Rank Up Points&#10;ICONHUNT  115 OVR Icon Player"></textarea></label>
    <div class="rxa-3">
      <label class="rxa-f"><span>Status</span><select id="rxaBStatus"><option value="active">Active</option><option value="scheduled">Scheduled</option></select></label>
      <label class="rxa-f"><span>Release date</span><input class="input" id="rxaBRelease" type="date" value="${t}"></label>
      <label class="rxa-f"><span>Expiry <small>optional</small></span><input class="input" id="rxaBExpiry" type="date"></label>
    </div>
    <div class="rxa-bprev" id="rxaBPrev"><div class="rxa-empty">Paste codes above to preview them.</div></div>
  </div>
  <div class="rxa-dlg-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="rxaBGo" disabled>Publish codes</button></div></div>`);
  const upd=()=>{
    const items=rxaParseLines($('#rxaBulkText').value),seen=new Set(),existing=new Set(RXA.codes.map(c=>c.code));
    const rows=items.map(i=>{
      let err='';
      if(!/^[A-Z0-9][A-Z0-9_-]{1,39}$/.test(i.code))err='Invalid code';
      else if(!i.reward)err='Missing reward';
      else if(seen.has(i.code))err='Duplicate line';
      seen.add(i.code);
      return{...i,err,exists:existing.has(i.code)};
    });
    const good=rows.filter(r=>!r.err);
    $('#rxaBPrev').innerHTML=rows.length?rows.map(r=>`<div class="rxa-brow${r.err?' bad':''}"><b>${esc(r.code)}</b><span>${esc(r.reward||'—')}</span><em>${r.err?esc(r.err):r.exists?'Will update':'New'}</em></div>`).join(''):'<div class="rxa-empty">Paste codes above to preview them.</div>';
    const go=$('#rxaBGo');go.disabled=!good.length||good.length!==rows.length;go.textContent=good.length?`Publish ${good.length} code${good.length>1?'s':''}`:'Publish codes';
    go._items=good;
  };
  $('#rxaBulkText').addEventListener('input',upd);
  $('#rxaBGo').onclick=async()=>{
    const b=$('#rxaBGo'),status=$('#rxaBStatus').value,rel=$('#rxaBRelease').value,exp=$('#rxaBExpiry').value||null;
    busy(b,true);
    try{
      const items=b._items.map(i=>({...i,status,releaseDate:rel,expiryDate:exp,region:'Global',lastVerified:t,notes:''}));
      const r=await rxaApi('/bulk',{action:'create',items});
      closeModal();state(`${r.created} added${r.updated?`, ${r.updated} updated`:''}`);await rxaRefresh();
    }catch(e){
      const detail=e.message;state(detail,false);
    }finally{busy(b,false)}
  };
  setTimeout(()=>$('#rxaBulkText')?.focus(),30);
}

        $('#logout').onclick=async()=>{try{await api('/logout',{method:'POST'})}finally{location.replace('/admin/')}};$('#logoutTop').onclick=$('#logout').onclick;
        await load(new URLSearchParams(location.search).get('section')||'overview');
        return;
      }
    }
    const creatorResponse=await fetch('/api/creator/me',{credentials:'same-origin',cache:'no-store'});
    if(creatorResponse.ok){
      const creator=await creatorResponse.json();
      if(creator?.creator){
        workspaceRole='creator'; workspaceUser=creator.creator;
        document.querySelectorAll('[data-admin-only]').forEach(x=>x.remove());
        document.querySelectorAll('.nav-external').forEach(x=>x.remove());
        document.querySelectorAll('[data-section]').forEach(x=>{if(!['overview','redeem','articles','inbox','account'].includes(x.dataset.section))x.remove();});
        document.querySelector('.side-card').innerHTML='<span>WORKSPACE MODE</span><strong>Creator workspace</strong><p>Write, save and submit your own articles for review</p>';
        document.querySelector('.navlabel').textContent='Creator';
        $('#crumb').textContent='Overview';$('#title').textContent='Overview';
        document.querySelector('.brand small').textContent='Creator workspace';
        $('#logout').onclick=async()=>{try{await fetch('/api/creator/logout',{method:'POST',credentials:'same-origin'})}finally{location.replace('/admin/')}};$('#logoutTop').onclick=$('#logout').onclick;
        await load('overview');
        return;
      }
    }
    app.innerHTML='<div class="error">Admin session could not be verified. Please sign in again.</div>';
    state('Session verification failed',false);
  } catch(error) {
    app.innerHTML='<div class="error">'+esc(error?.message||'Unable to load admin workspace.')+'</div>';
    state('Workspace error',false);
  }
}
bootstrapWorkspace();
</script></body></html>
