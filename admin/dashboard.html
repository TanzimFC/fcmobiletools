<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>FC Mobile Tools Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f4f7ff;font:15px system-ui,-apple-system,sans-serif}aside{position:fixed;inset:0 auto 0 0;width:240px;padding:24px;background:#11182a;border-right:1px solid #26314a;display:flex;flex-direction:column;gap:10px}aside button{padding:11px;border:1px solid #303d59;border-radius:9px;background:#182238;color:#dce5f5;text-align:left;cursor:pointer}aside button.active{background:#263754}aside strong{margin-bottom:18px;font-size:12px;letter-spacing:.08em}#logout{margin-top:auto}main{margin-left:240px;padding:32px;max-width:1220px}header{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid #26314a;padding-bottom:24px;margin-bottom:24px}small,.muted{color:#8fa1bf}.eyebrow{color:#8fa1bf;letter-spacing:.08em;font-size:12px}h1{margin:7px 0;font-size:30px}.card,.panel{background:#121b2d;border:1px solid #263550;border-radius:14px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}label{display:block;margin:10px 0;font-weight:600}input,select,textarea{width:100%;padding:11px;margin-top:6px;border:1px solid #35445f;border-radius:8px;background:#0d1526;color:#fff;font:inherit}textarea{min-height:100px;resize:vertical}.primary{padding:11px 16px;border:0;border-radius:8px;background:#fff;color:#111;font-weight:700;cursor:pointer}.secondary{padding:10px 14px;border:1px solid #35445f;border-radius:8px;background:#182238;color:#fff;font-weight:700;cursor:pointer}.danger{padding:10px 14px;border:1px solid #633543;border-radius:8px;background:#321822;color:#ffb8c2;font-weight:700;cursor:pointer}.error{color:#ff8585}.ok{color:#76e0a0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button{padding:9px 12px;border:1px solid #35445f;background:#101a2d;color:#dce5f5;border-radius:8px;cursor:pointer}.tabs button.active{background:#2a3b5d}.club{display:grid;grid-template-columns:50px 1fr 1fr 1.5fr;gap:10px;align-items:end;padding:12px 0;border-bottom:1px solid #25334d}.club:last-child{border-bottom:0}.club img{width:42px;height:42px;object-fit:contain}.match{display:grid;grid-template-columns:120px 90px 1fr 1fr;gap:10px;align-items:end;padding:14px 0;border-bottom:1px solid #25334d}.match:last-child{border-bottom:0}.section-title{margin:0 0 8px;font-size:18px}.hint{font-size:13px;color:#8fa1bf;margin-top:5px}.metric{font-size:13px;color:#8fa1bf}.metric b{display:block;font-size:28px;color:#fff;margin-top:5px}.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.media-card{border:1px solid #2c3a54;border-radius:10px;padding:10px}.media img{width:100%;height:140px;object-fit:cover;border-radius:8px;background:#0a0f1b}.savebar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0}.divider{border-top:1px solid #25334d;margin:18px 0}.inline-help{font-size:13px;color:#8fa1bf}.code-row{display:grid;grid-template-columns:1.1fr 1.3fr .9fr .9fr .9fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #25334d}.logo-preview{display:flex;align-items:center;justify-content:center;height:50px}.logo-preview img{width:42px;height:42px;object-fit:contain}.empty{padding:16px;border:1px dashed #35445f;border-radius:8px;color:#8fa1bf}@media(max-width:700px){aside{position:static;width:auto;flex-direction:row;flex-wrap:wrap}#logout{margin-top:0}main{margin-left:0;padding:18px}.grid.two{grid-template-columns:1fr}.club{grid-template-columns:42px 1fr}.club label:nth-child(n+3){grid-column:1/-1}.match,.code-row{grid-template-columns:1fr 1fr}.match label:nth-child(3),.match label:nth-child(4),.code-row button{grid-column:1/-1}}
</style>
</head>
<body>
<aside><strong>FC MOBILE TOOLS · ADMIN</strong><button data-section="overview">Overview</button><button data-section="redeem">Redeem Codes</button><button data-section="football">Football Centre</button><button data-section="media">Media Library</button><button id="logout">Sign out</button></aside>
<main><header><div><div class="eyebrow">PRIVATE CONTROL PANEL</div><h1 id="title">Overview</h1></div><span id="status">Ready</span></header><section id="app"></section></main>
<script>
const $=s=>document.querySelector(s),app=$('#app'),status=$('#status');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let footballData=null,mediaResources=[];
async function api(path,options={}){const r=await fetch('/api/admin'+path,{credentials:'same-origin',...options});const b=await r.json().catch(()=>({}));if(r.status===401){location.replace('/admin/');throw Error('Session expired.')}if(!r.ok)throw Error(b.error||`Request failed (${r.status}).`);return b}
function msg(text,ok=false){status.textContent=text;status.className=ok?'ok':'error'}
function busy(button,on){if(!button)return;button.disabled=on;if(on){button.dataset.old=button.textContent;button.textContent='Saving…'}else button.textContent=button.dataset.old||button.textContent}
function setActive(section){document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===section))}
async function overview(){app.innerHTML='<div class="grid"><div class="card metric">Admin role<b>Administrator</b></div><div class="card metric">Content source<b>GitHub</b></div><div class="card metric">Publishing<b>Build → deploy</b></div></div><div class="card"><h2>Admin dashboard</h2><p class="muted">This panel edits the public content source files. Saving creates a real GitHub commit; the existing Cloudflare deployment workflow then builds and deploys from main.</p><p class="inline-help">No placeholder success is shown here: API failures are surfaced as errors.</p></div>'}
let editingCode=null;
async function redeem(){const {codes}=await api('/redeem');const current=editingCode?codes.find(x=>String(x.code).toUpperCase()===editingCode):null;app.innerHTML=`<div class="panel"><h2>Redeem Codes</h2><div class="grid"><label>Code<input id="code" value="${esc(current?.code||'')}"></label><label>Reward<input id="reward" value="${esc(current?.reward||'')}"></label><label>Status<select id="codeStatus"><option value="active" ${current?.status==='active'?'selected':''}>Active</option><option value="scheduled" ${current?.status==='scheduled'?'selected':''}>Scheduled</option><option value="expired" ${current?.status==='expired'?'selected':''}>Expired</option></select></label><label>Release date<input id="releaseDate" type="date" value="${esc(current?.releaseDate||'')}"></label><label>Expiry date<input id="expiryDate" type="date" value="${esc(current?.expiryDate||'')}"></label><label>Region<input id="region" value="${esc(current?.region||'Global')}"></label></div><div class="toolbar"><button class="primary" id="saveCode">${current?'Update code':'Create code'}</button>${current?'<button class="secondary" id="cancelCode">Cancel edit</button>':''}<span class="muted">${codes.length} codes loaded.</span></div></div><div class="panel"><h3>Existing codes</h3>${codes.length?codes.map(x=>`<div class="code-row"><strong>${esc(x.code)}</strong><span>${esc(x.reward)}</span><span>${esc(x.status)}</span><span>${esc(x.releaseDate)}</span><span>${esc(x.expiryDate||'No expiry')}</span><span><button class="secondary" data-edit="${esc(x.code)}">Edit</button></span></div>`).join(''):'<div class="empty">No redeem codes found.</div>'}</div>`;$('#saveCode').onclick=async()=>{const b=$('#saveCode');busy(b,true);try{const r=await api('/redeem',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:$('#code').value,reward:$('#reward').value,status:$('#codeStatus').value,releaseDate:$('#releaseDate').value,expiryDate:$('#expiryDate').value||null,region:$('#region').value})});editingCode=null;msg(`${r.action==='updated'?'Updated':'Created'} ${$('#code').value.toUpperCase()}. Commit ${r.commitSha}`,true);await redeem()}catch(e){msg(e.message)}finally{busy(b,false)}};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editingCode=b.dataset.edit.toUpperCase();redeem()});if($('#cancelCode'))$('#cancelCode').onclick=()=>{editingCode=null;redeem()}}
function footballTabs(active){return `<div class="tabs">${[['content','Content'],['matches','Matches'],['analysis','Analysis'],['totw','TOTW'],['settings','Settings']].map(([k,n])=>`<button data-ftab="${k}" class="${active===k?'active':''}">${n}</button>`).join('')}</div>`}
async function loadMediaOptions(){try{mediaResources=(await api('/media')).resources||[]}catch{mediaResources=[]}}
function mediaSelect(id,current){return `<select data-media-picker="${esc(id)}"><option value="">Media Library…</option>${mediaResources.map(r=>`<option value="${esc(r.url)}" ${r.url===current?'selected':''}>${esc(r.publicId||r.url)}</option>`).join('')}</select>`}
async function football(active='content'){footballData=(await api('/football')).content;await loadMediaOptions();const content=structuredClone(footballData);let html='';
if(active==='content') html=`${footballTabs(active)}<div class="panel"><h2>Cycle content</h2><div class="grid"><label>Cycle ID<input data-field="cycle.id" value="${esc(content.cycle?.id)}"></label><label>Cycle label<input data-field="cycle.label" value="${esc(content.cycle?.label)}"></label><label>Cycle title<input data-field="cycle.title" value="${esc(content.cycle?.title)}"></label></div><label>Description<textarea data-field="cycle.description">${esc(content.cycle?.description)}</textarea></label></div><div class="panel"><h2>Clubs & logos</h2><p class="hint">Logo URLs are used by the public Football Centre. Uploaded Cloudinary assets can be selected from the Media Library dropdown.</p>${Object.entries(content.clubs).map(([id,c])=>`<div class="club"><div class="logo-preview"><img src="${esc(c.logo)}" alt=""></div><label>Name<input data-club="${id}" data-k="name" value="${esc(c.name)}"></label><label>Short name<input data-club="${id}" data-k="short" value="${esc(c.short)}"></label><label>Logo URL<input data-club="${id}" data-k="logo" value="${esc(c.logo)}">${mediaSelect(id,c.logo)}</label></div>`).join('')}</div>`;
if(active==='matches') html=`${footballTabs(active)}<div class="panel"><h2>Showdown matches</h2><p class="hint">This is the actual public match schedule. Change the week or either side; prediction/result logic remains the same.</p>${content.matches.map((m,i)=>`<div class="match"><strong>Showdown ${String(i+1).padStart(2,'0')}</strong><label>Week<select data-match="${esc(m.id)}" data-k="week">${Array.from({length:4},(_,j)=>j+1).map(w=>`<option value="${w}" ${Number(m.week)===w?'selected':''}>${w}</option>`).join('')}</select></label><label>Home<select data-match="${esc(m.id)}" data-k="home">${Object.entries(content.clubs).map(([id,c])=>`<option value="${id}" ${m.home===id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Away<select data-match="${esc(m.id)}" data-k="away">${Object.entries(content.clubs).map(([id,c])=>`<option value="${id}" ${m.away===id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div>`).join('')}</div>`;
if(active==='analysis') html=`${footballTabs(active)}<div class="panel"><h2>Analysis</h2><div class="grid"><label>Section label<input data-field="analysis.label" value="${esc(content.analysis?.label)}"></label><label>Title<input data-field="analysis.title" value="${esc(content.analysis?.title)}"></label></div><label>Warning<textarea data-field="analysis.warning">${esc(content.analysis?.warning)}</textarea></label><div class="grid"><label>Video embed URL<input data-field="analysis.videoEmbedUrl" value="${esc(content.analysis?.videoEmbedUrl)}"></label><label>Video watch URL<input data-field="analysis.videoWatchUrl" value="${esc(content.analysis?.videoWatchUrl)}"></label><label>Video title<input data-field="analysis.videoTitle" value="${esc(content.analysis?.videoTitle)}"></label></div><label>Video body<textarea data-field="analysis.videoBody">${esc(content.analysis?.videoBody)}</textarea></label><label>Video warning<textarea data-field="analysis.videoWarning">${esc(content.analysis?.videoWarning)}</textarea></label></div>`;
if(active==='totw') html=`${footballTabs(active)}<div class="panel"><h2>Team of the Week</h2><div class="grid"><label>Label<input data-field="totw.label" value="${esc(content.totw?.label)}"></label><label>Title<input data-field="totw.title" value="${esc(content.totw?.title)}"></label><label>Chip<input data-field="totw.chip" value="${esc(content.totw?.chip)}"></label></div><label>Description<textarea data-field="totw.description">${esc(content.totw?.description)}</textarea></label><div class="grid"><label>Status label<input data-field="totw.statusLabel" value="${esc(content.totw?.statusLabel)}"></label><label>Status title<input data-field="totw.statusTitle" value="${esc(content.totw?.statusTitle)}"></label></div><label>Status body<textarea data-field="totw.statusBody">${esc(content.totw?.statusBody)}</textarea></label><div class="grid"><label>Safety label<input data-field="totw.safetyLabel" value="${esc(content.totw?.safetyLabel)}"></label><label>Safety title<input data-field="totw.safetyTitle" value="${esc(content.totw?.safetyTitle)}"></label></div><label>Safety body<textarea data-field="totw.safetyBody">${esc(content.totw?.safetyBody)}</textarea></label></div>`;
if(active==='settings') html=`${footballTabs(active)}<div class="grid two"><div class="panel"><h2>Cycle settings</h2><label>Cycle ID<input data-field="settings.cycleId" value="${esc(content.settings?.cycleId)}"></label><label>Starting balance<input data-field="settings.startingBalance" type="number" min="0" value="${Number(content.settings?.startingBalance||0)}"></label></div><div class="panel"><h2>Scoring</h2><label>Played points<input data-field="settings.scoring.played" type="number" min="0" value="${Number(content.settings?.scoring?.played||0)}"></label><label>World Class bonus<input data-field="settings.scoring.worldClass" type="number" min="0" value="${Number(content.settings?.scoring?.worldClass||0)}"></label><label>Correct prediction bonus<input data-field="settings.scoring.correctPrediction" type="number" min="0" value="${Number(content.settings?.scoring?.correctPrediction||0)}"></label></div></div><div class="card"><p class="muted">These values become the public Football Centre defaults at build time. A visitor's existing browser-local progress is kept for that cycle.</p></div>`;
app.innerHTML=html+`<div class="savebar"><span class="muted">Save writes this public content source to GitHub.</span><button class="primary" id="saveFootball">Save Football Centre</button></div>`;
document.querySelectorAll('[data-ftab]').forEach(b=>b.onclick=()=>football(b.dataset.ftab));document.querySelectorAll('[data-media-picker]').forEach(s=>s.onchange=()=>{const id=s.dataset.mediaPicker;const input=document.querySelector(`[data-club="${id}"][data-k="logo"]`);if(input&&s.value)input.value=s.value});
$('#saveFootball').onclick=async()=>{const b=$('#saveFootball');busy(b,true);try{const get=(path)=>{let v=content;for(const p of path.split('.'))v=v?.[p];return v};const set=(path,value)=>{const parts=path.split('.');let v=content;for(const p of parts.slice(0,-1))v=v[p];v[parts.at(-1)]=value};document.querySelectorAll('[data-field]').forEach(el=>{const p=el.dataset.field;const n=['settings.startingBalance','settings.scoring.played','settings.scoring.worldClass','settings.scoring.correctPrediction'].includes(p);set(p,n?Number(el.value):el.value.trim())});for(const [id] of Object.entries(content.clubs)){for(const k of ['name','short','logo'])content.clubs[id][k]=document.querySelector(`[data-club="${id}"][data-k="${k}"]`).value.trim()}for(const m of content.matches){m.week=Number(document.querySelector(`[data-match="${m.id}"][data-k="week"]`).value);m.home=document.querySelector(`[data-match="${m.id}"][data-k="home"]`).value;m.away=document.querySelector(`[data-match="${m.id}"][data-k="away"]`).value}const r=await api('/football',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content})});msg(`Saved to GitHub. Commit ${r.commitSha}. Build/deploy workflow will run automatically.`,true)}catch(e){msg(e.message)}finally{busy(b,false)}}}
async function media(){app.innerHTML='<div class="panel"><h2>Media Library</h2><p class="hint">Cloudinary is the shared image store. Upload an image here, then select its URL from the Football Centre logo editor.</p><input id="upload" type="file" accept="image/*"><div id="media" class="media"></div></div>';try{const {resources}=await api('/media');mediaResources=resources||[];$('#media').innerHTML=mediaResources.map(x=>`<div class="media-card"><img src="${esc(x.url)}" alt=""><div class="inline-help">${esc(x.publicId||'')}</div><button class="secondary" data-url="${esc(x.url)}">Copy URL</button></div>`).join('')||'<div class="empty">No Cloudinary images found.</div>';document.querySelectorAll('[data-url]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.url);msg('URL copied.',true)}catch{msg('Clipboard access failed. Copy the URL manually from the media entry.')}})}catch(e){$('#media').innerHTML=`<div class="empty error">${esc(e.message)}</div>`}$('#upload').onchange=async e=>{const file=e.target.files[0];if(!file)return;const b=e.target;try{const p=await api('/media/sign');const form=new FormData();form.append('file',file);form.append('api_key',p.apiKey);form.append('timestamp',p.timestamp);form.append('folder',p.folder);form.append('signature',p.signature);const r=await fetch(`https://api.cloudinary.com/v1_1/${p.cloudName}/image/upload`,{method:'POST',body:form});const body=await r.json().catch(()=>({}));if(!r.ok)throw Error(body?.error?.message||`Upload failed (${r.status}).`);msg('Upload complete.',true);await media()}catch(x){msg(x.message)}finally{b.value=''}}}
async function load(section){setActive(section);$('#title').textContent=section==='overview'?'Overview':section==='redeem'?'Redeem Codes':section==='football'?'Football Centre':'Media Library';try{if(section==='football'){await football('content');return}await ({overview,redeem,media}[section])()}catch(e){app.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>load(b.dataset.section));$('#logout').onclick=async()=>{await api('/logout',{method:'POST'});location.replace('/admin/')};load('overview');
</script></body></html>
