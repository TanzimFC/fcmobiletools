<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>FC Mobile Tools Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f4f7ff;font:15px system-ui,-apple-system,sans-serif}aside{position:fixed;inset:0 auto 0 0;width:240px;padding:24px;background:#11182a;border-right:1px solid #26314a;display:flex;flex-direction:column;gap:10px}aside button{padding:11px;border:1px solid #303d59;border-radius:9px;background:#182238;color:#dce5f5;text-align:left;cursor:pointer}aside strong{margin-bottom:18px;font-size:12px;letter-spacing:.08em}#logout{margin-top:auto}main{margin-left:240px;padding:32px;max-width:1200px}header{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid #26314a;padding-bottom:24px;margin-bottom:24px}small{color:#8fa1bf;letter-spacing:.08em}h1{margin:7px 0;font-size:30px}.card,.panel{background:#121b2d;border:1px solid #263550;border-radius:14px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}label{display:block;margin:12px 0}input,select,textarea{width:100%;padding:11px;border:1px solid #35445f;border-radius:8px;background:#0d1526;color:#fff}button.primary{padding:11px 16px;border:0;border-radius:8px;background:#fff;color:#111;font-weight:700;cursor:pointer}.error{color:#ff8585}.ok{color:#76e0a0}.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.media img{width:100%;height:140px;object-fit:cover;border-radius:8px;background:#0a0f1b}@media(max-width:700px){aside{position:static;width:auto;flex-direction:row;flex-wrap:wrap}#logout{margin-top:0}main{margin-left:0;padding:18px}}</style>
</head>
<body>
<aside><strong>FC MOBILE TOOLS · ADMIN</strong><button data-section="overview">Overview</button><button data-section="redeem">Redeem Codes</button><button data-section="football">Football Centre</button><button data-section="media">Media Library</button><button id="logout">Sign out</button></aside>
<main><header><div><small>PRIVATE CONTROL PANEL</small><h1 id="title">Overview</h1></div><span id="status">Ready</span></header><section id="app"></section></main>
<script>
const $=s=>document.querySelector(s),app=$('#app'),status=$('#status');
async function api(path,options={}){const r=await fetch('/api/admin'+path,{credentials:'same-origin',...options});const b=await r.json().catch(()=>({}));if(r.status===401){location.replace('/admin/');throw Error('Session expired.')}if(!r.ok)throw Error(b.error||`Request failed (${r.status}).`);return b}
function msg(text,ok=false){status.textContent=text;status.className=ok?'ok':'error'}
async function overview(){app.innerHTML='<div class="card"><h2>Admin dashboard</h2><p>Use the sections to manage redeem codes, Football Centre content, and Cloudinary media.</p></div>'}
async function redeem(){const {codes}=await api('/redeem');app.innerHTML=`<div class="panel"><h2>Redeem Codes</h2><div class="grid"><label>Code<input id="code"></label><label>Reward<input id="reward"></label><label>Status<select id="codeStatus"><option>active</option><option>scheduled</option><option>expired</option></select></label><label>Release date<input id="releaseDate" type="date"></label><label>Expiry date<input id="expiryDate" type="date"></label><label>Region<input id="region" value="Global"></label></div><button class="primary" id="saveCode">Save code</button><p>${codes.length} codes loaded from GitHub.</p></div><div class="panel"><h3>Existing codes</h3><div>${codes.map(x=>`<div>${x.code} — ${x.reward} — ${x.status}</div>`).join('')}</div></div>`;$('#saveCode').onclick=async()=>{try{const b=await api('/redeem',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:$('#code').value,reward:$('#reward').value,status:$('#codeStatus').value,releaseDate:$('#releaseDate').value,expiryDate:$('#expiryDate').value||null,region:$('#region').value})});msg(`Saved. Commit ${b.commitSha}`,true)}catch(e){msg(e.message)}}}
async function football(){const {content}=await api('/football');const clubs=Object.entries(content.clubs);app.innerHTML=`<div class="panel"><h2>Football Centre</h2>${clubs.map(([id,c])=>`<div class="grid"><label>${id} name<input data-id="${id}" data-k="name" value="${c.name}"></label><label>Short name<input data-id="${id}" data-k="short" value="${c.short}"></label><label>Logo URL<input data-id="${id}" data-k="logo" value="${c.logo}"></label></div>`).join('')}<label>Video embed URL<input id="embed" value="${content.videoEmbedUrl}"></label><label>Video watch URL<input id="watch" value="${content.videoWatchUrl}"></label><button class="primary" id="saveFootball">Save Football Centre</button></div>`;$('#saveFootball').onclick=async()=>{try{for(const [id,c] of clubs){for(const k of ['name','short','logo'])content.clubs[id][k]=document.querySelector(`[data-id="${id}"][data-k="${k}"]`).value.trim()}content.videoEmbedUrl=$('#embed').value.trim();content.videoWatchUrl=$('#watch').value.trim();const b=await api('/football',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content})});msg(`Saved. Commit ${b.commitSha}`,true)}catch(e){msg(e.message)}}}
async function media(){app.innerHTML='<div class="panel"><h2>Media Library</h2><input id="upload" type="file" accept="image/*"><div id="media" class="media"></div></div>';try{const {resources}=await api('/media');$('#media').innerHTML=resources.map(x=>`<div><img src="${x.url}" alt=""><button data-url="${x.url}">Copy URL</button></div>`).join('')||'<p>No Cloudinary images found.</p>';document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.url))}catch(e){$('#media').innerHTML=`<p class="error">${e.message}</p>`}$('#upload').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const p=await api('/media/sign');const form=new FormData();form.append('file',file);form.append('api_key',p.apiKey);form.append('timestamp',p.timestamp);form.append('folder',p.folder);form.append('signature',p.signature);const r=await fetch(`https://api.cloudinary.com/v1_1/${p.cloudName}/image/upload`,{method:'POST',body:form});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b?.error?.message||`Upload failed (${r.status}).`);msg('Upload complete.',true);media()}catch(x){msg(x.message)}}}
async function load(section){$('#title').textContent=section==='overview'?'Overview':section==='redeem'?'Redeem Codes':section==='football'?'Football Centre':'Media Library';try{await ({overview,redeem,football,media}[section])()}catch(e){app.innerHTML=`<div class="card error">${e.message}</div>`}}
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>load(b.dataset.section));$('#logout').onclick=async()=>{await api('/logout',{method:'POST'});location.replace('/admin/')};load('overview');
</script></body></html>
