<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>FC Mobile Tools Admin</title><style>:root{--bg:#050505;--panel:#0d0f12;--line:#252a30;--text:#f4f7fa;--muted:#8b949e;--a:#55c7f2;--good:#55d89b;--bad:#ff6978}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% -10%,#12374455,transparent 36%),var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:#08090bdd;backdrop-filter:blur(15px)}.brand{display:flex;gap:10px;align-items:center;padding:7px 10px 27px}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--a),#237ea2);display:grid;place-items:center;color:#041015;font-weight:900}.brand b{font-size:13px}.brand small{display:block;color:var(--muted);font-size:11px}.navlabel{padding:8px 10px;color:#5e6670;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.nav{display:grid;gap:4px}.nav button{width:100%;padding:11px 12px;border:1px solid transparent;border-radius:10px;background:transparent;color:#9ba2ad;text-align:left}.nav button:hover,.nav button.active{background:#111d23;color:#fff}.nav button.active{border-color:#273943;box-shadow:inset 3px 0 var(--a)}.out{position:absolute;left:14px;right:14px;bottom:20px;width:calc(100% - 28px);padding:10px;border:1px solid var(--line);border-radius:10px;background:#101114;color:#c4c9d0}.main{min-width:0}.top{height:72px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:0 34px;border-bottom:1px solid var(--line);background:#050505ed;backdrop-filter:blur(15px)}.crumb{font-size:11px;color:var(--muted)}.top h1{font-size:20px;margin:2px 0}.state{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}.dot.bad{background:var(--bad)}.body{padding:30px 34px 70px;max-width:1500px}.hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}.hero h2{font-size:30px;letter-spacing:-.04em;margin:0 0 4px}.hero p{margin:0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:linear-gradient(180deg,#101114,#0b0c0f);border:1px solid var(--line);border-radius:16px}.stat{padding:18px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:5px}.stat span{display:block;color:#68707b;font-size:11px}.section{padding:21px;margin-top:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:17px}.head h3{margin:0;font-size:16px}.head p{margin:3px 0 0;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field span{display:block;color:#c9cfd7;font-size:12px;font-weight:650;margin-bottom:7px}.input,select,textarea{width:100%;padding:11px 12px;border:1px solid #2a2d33;border-radius:10px;background:#08090b;color:#fff;outline:0}.input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px #55c7f214}textarea{min-height:105px;resize:vertical}.btn{padding:9px 13px;border:1px solid #30343b;border-radius:9px;background:#15171b;color:#e9edf2;font-weight:650}.btn:hover{background:#1c2025}.btn:disabled{opacity:.55;cursor:wait}.primary{border-color:var(--a);background:linear-gradient(135deg,var(--a),#2585aa);color:#041015}.tabs{display:flex;gap:4px;padding:4px;background:#0b0c0e;border:1px solid var(--line);border-radius:11px;width:max-content;max-width:100%;overflow:auto;margin-bottom:17px}.tabs button{border:0;background:transparent;color:#808792;padding:8px 12px;border-radius:8px}.tabs button.active{background:#17242a;color:#fff}.notice{padding:12px 14px;background:#0b1216;border:1px solid #22343c;border-radius:10px;color:#9da5ae;font-size:12px}.clubgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.club{padding:15px;background:#0b0d10;border:1px solid #272a30;border-radius:13px}.clubhead{display:flex;align-items:center;gap:11px;margin-bottom:12px}.clubimg{width:48px;height:48px;object-fit:contain;border-radius:11px;border:1px solid #292d34;background:#060708;padding:5px}.clubname{font-weight:750}.clubid{font-size:10px;color:#68707b}.matchgrid,.codegrid{display:grid;gap:9px}.match{display:grid;grid-template-columns:62px 95px 1fr 1fr;gap:12px;align-items:end;padding:14px;background:#0b0d10;border:1px solid #272a30;border-radius:13px}.num{color:var(--a);font-weight:850}.week{font-size:10px;color:#69717c}.code{display:grid;grid-template-columns:1.1fr 1.7fr .8fr 1fr 1fr auto;gap:12px;align-items:center;padding:13px 14px;background:#0b0d10;border:1px solid #272a30;border-radius:11px}.code.headrow{border:0;background:transparent;color:#626a75;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:750}.pill.active{background:#123426;color:#5be5a8}.pill.scheduled{background:#2d2614;color:#f3ce70}.pill.expired{background:#2b171c;color:#ff8f9b}.mediagrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.media{overflow:hidden;background:#0b0d10;border:1px solid #272a30;border-radius:13px}.thumb{height:145px;background:#060708}.thumb img{width:100%;height:100%;object-fit:cover}.minfo{padding:10px}.minfo b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.minfo small{display:block;color:#69717c;font-size:10px}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:22px;background:#000c}.modal.open{display:flex}.dialog{width:min(680px,100%);max-height:90vh;overflow:auto;background:#101216;border:1px solid #30343b;border-radius:18px;box-shadow:0 30px 100px #000d}.dialoghead{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dialogbody{padding:22px}.dialogfoot{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.close{width:32px;height:32px;border:0;border-radius:9px;background:#191b20;color:#b9c0c9}.pickergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.pickeritem{overflow:hidden;border:1px solid #292d34;border-radius:11px;background:#0a0c0f}.pickeritem img{width:100%;height:105px;object-fit:cover;display:block}.pickeritem button{width:100%;border:0;border-top:1px solid #292d34;background:#12151a;color:#fff;padding:8px}.save{position:sticky;bottom:16px;z-index:8;margin-top:20px;padding:12px 14px;border:1px solid #30343b;border-radius:12px;background:#111317ed;backdrop-filter:blur(15px);display:flex;justify-content:space-between;align-items:center}.dropzone{margin-top:14px;border:1px dashed #3b4a52;border-radius:16px;background:#080b0d;min-height:155px;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;transition:.15s}.dropzone.drag{border-color:var(--a);background:#0b171c;box-shadow:0 0 0 3px #55c7f214}.dropzone b{display:block;font-size:15px}.dropzone span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.dropzone .btn{margin-top:12px}.upload-status{margin-top:10px;font-size:12px;color:var(--muted)}.empty{padding:30px;text-align:center;border:1px dashed #30343b;border-radius:12px;color:#727985}.error{padding:14px;border:1px solid #572932;background:#211116;color:#ffabb4;border-radius:11px}.search{max-width:340px}.muted{color:var(--muted);font-size:12px}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.mediagrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.layout{display:block}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.out{display:none}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;font-size:11px}.top{padding:0 18px}.body{padding:22px 18px}.grid,.grid3,.clubgrid{grid-template-columns:1fr}.code.headrow{display:none}.code{grid-template-columns:1fr 1fr}.code>*:last-child{grid-column:1/-1}.match{grid-template-columns:52px 1fr 1fr}.match label:nth-child(2){grid-column:2/-1}.hero{align-items:start;flex-direction:column}.save{position:static}.mediagrid{grid-template-columns:repeat(2,1fr)}.pickergrid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="layout"><aside class="side"><div class="brand"><div class="mark">FC</div><div><b>FC Mobile Tools</b><small>Admin workspace</small></div></div><div class="navlabel">Workspace</div><nav class="nav"><button data-section="overview">Overview</button><button data-section="redeem">Redeem Codes</button><button data-section="football">Football Centre</button><button data-section="media">Media Library</button></nav><button class="out" id="logout">Sign out</button></aside><div class="main"><header class="top"><div><div class="crumb">Admin / <span id="crumb">Overview</span></div><h1 id="title">Overview</h1></div><div class="state"><i class="dot" id="dot"></i><span id="status">Ready</span></div></header><main class="body" id="app"></main></div></div><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><script>
const $=s=>document.querySelector(s),app=$('#app'),modal=$('#modal'),dialog=$('#dialog');let football=null,media=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,o={}){const r=await fetch('/api/admin'+path,{credentials:'same-origin',...o});const b=await r.json().catch(()=>({}));if(r.status===401){location.replace('/admin/');throw Error('Session expired.')}if(!r.ok)throw Error(b.error||`Request failed (${r.status}).`);return b}function state(t,ok=true){$('#status').textContent=t;$('#dot').className='dot'+(ok?'':' bad')}function busy(b,on){if(!b)return;b.disabled=on;if(on){b.dataset.t=b.textContent;b.textContent='Saving…'}else b.textContent=b.dataset.t||b.textContent}function nav(s){document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===s));const n={overview:'Overview',redeem:'Redeem Codes',football:'Football Centre',media:'Media Library'}[s];$('#title').textContent=n;$('#crumb').textContent=n}function openModal(h){dialog.innerHTML=h;modal.classList.add('open');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}function closeModal(){modal.classList.remove('open');dialog.innerHTML=''}modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeModal()});
async function overview(){const[r,f,m]=await Promise.all([api('/redeem'),api('/football'),api('/media')]);app.innerHTML=`<div class="hero"><div><h2>Dashboard</h2><p>Your content workspace at a glance.</p></div></div><div class="cards"><div class="card stat"><small>Redeem codes</small><strong>${r.codes.length}</strong><span>${r.codes.filter(x=>x.status==='active').length} active</span></div><div class="card stat"><small>Club library</small><strong>${Object.keys(f.content.clubs||{}).length}</strong><span>Available to Showdowns</span></div><div class="card stat"><small>Showdowns</small><strong>${f.content.matches?.length||0}</strong><span>Current fixture list</span></div><div class="card stat"><small>Media assets</small><strong>${m.resources?.length||0}</strong><span>Cloudinary library</span></div></div><div class="card section"><div class="head"><div><h3>Quick actions</h3><p>Open the editor you need.</p></div></div><div class="grid3"><button class="btn" data-go="redeem">Manage redeem codes</button><button class="btn" data-go="football">Manage Football Centre</button><button class="btn" data-go="media">Manage media</button></div></div>`;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>load(b.dataset.go))}
function codeForm(c){return `<div class="dialoghead"><div><h3>${c?'Edit redeem code':'New redeem code'}</h3><div class="muted">${c?'Update this existing record.':'Create a new public code record.'}</div></div><button class="close" data-close>×</button></div><div class="dialogbody"><div class="grid"><label class="field"><span>Code</span><input class="input" id="code" value="${esc(c?.code||'')}" autocomplete="off"></label><label class="field"><span>Reward</span><input class="input" id="reward" value="${esc(c?.reward||'')}"></label><label class="field"><span>Status</span><select id="cstatus"><option value="active" ${c?.status==='active'?'selected':''}>Active</option><option value="scheduled" ${c?.status==='scheduled'?'selected':''}>Scheduled</option><option value="expired" ${c?.status==='expired'?'selected':''}>Expired</option></select></label><label class="field"><span>Region</span><input class="input" id="region" value="${esc(c?.region||'Global')}"></label><label class="field"><span>Release date</span><input class="input" id="release" type="date" value="${esc(c?.releaseDate||'')}"></label><label class="field"><span>Expiry date</span><input class="input" id="expiry" type="date" value="${esc(c?.expiryDate||'')}"></label><label class="field"><span>Last verified</span><input class="input" id="verified" type="date" value="${esc(c?.lastVerified||'')}"></label><label class="field"><span>Notes</span><input class="input" id="notes" value="${esc(c?.notes||'')}"></label></div></div><div class="dialogfoot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="commit">${c?'Update code':'Create code'}</button></div>`}
async function redeem(){const{codes}=await api('/redeem');app.innerHTML=`<div class="hero"><div><h2>Redeem Codes</h2><p>Search, review and edit codes without leaving the list.</p></div><button class="btn primary" id="new">+ New code</button></div><div class="card section"><div class="head"><div><h3>Code database</h3><p>${codes.length} records</p></div><input class="input search" id="codeSearch" placeholder="Search code or reward…"></div><div class="codegrid"><div class="code headrow"><span>Code</span><span>Reward</span><span>Status</span><span>Release</span><span>Expiry</span><span></span></div>${codes.map(x=>`<div class="code" data-row data-search="${esc((x.code+' '+x.reward).toLowerCase())}"><strong>${esc(x.code)}</strong><span>${esc(x.reward)}</span><span><i class="pill ${esc(x.status)}">${esc(x.status)}</i></span><span>${esc(x.releaseDate||'—')}</span><span>${esc(x.expiryDate||'No expiry')}</span><button class="btn" data-edit="${esc(x.code)}">Edit</button></div>`).join('')||'<div class="empty">No redeem codes found.</div>'}</div></div>`;$('#new').onclick=()=>{openModal(codeForm(null));$('#commit').onclick=saveCode};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{openModal(codeForm(codes.find(x=>String(x.code).toUpperCase()===b.dataset.edit.toUpperCase())));$('#commit').onclick=saveCode});$('#codeSearch').oninput=e=>document.querySelectorAll('[data-row]').forEach(r=>r.style.display=(r.dataset.search||'').includes(e.target.value.toLowerCase())?'':'none')}
async function saveCode(){const b=$('#commit');busy(b,true);try{const r=await api('/redeem',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:$('#code').value,reward:$('#reward').value,status:$('#cstatus').value,releaseDate:$('#release').value,expiryDate:$('#expiry').value||null,region:$('#region').value,lastVerified:$('#verified').value,notes:$('#notes').value})});closeModal();state(r.action==='updated'?'Code updated.':'Code created.');await redeem()}catch(e){state(e.message,false)}finally{busy(b,false)}}
function fTabs(a){return `<div class="tabs">${[['content','Content'],['matches','Matches'],['analysis','Analysis'],['totw','TOTW'],['settings','Settings']].map(x=>`<button class="${a===x[0]?'active':''}" data-ft="${x[0]}">${x[1]}</button>`).join('')}</div>`}function get(o,p){return p.split('.').reduce((v,k)=>v?.[k],o)??''}function set(o,p,v){const a=p.split('.');let x=o;for(const k of a.slice(0,-1))x=x[k]??{};x[a.at(-1)]=v}function fields(list){return `<div class="grid">${list.map(([p,l,n])=>`<label class="field"><span>${l}</span><input class="input" ${n?'type="number" min="0"':''} data-field="${p}" value="${esc(get(football,p))}"></label>`).join('')}</div>`}
function club(id,c){return `<article class="club"><div class="clubhead"><img class="clubimg" src="${esc(c.logo)}" alt=""><div><div class="clubname">${esc(c.name||'Unnamed club')}</div><div class="clubid">ID · ${esc(id)}</div></div></div><div class="grid"><label class="field"><span>Name</span><input class="input" data-club="${esc(id)}" data-k="name" value="${esc(c.name)}"></label><label class="field"><span>Short name</span><input class="input" data-club="${esc(id)}" data-k="short" value="${esc(c.short)}"></label></div><label class="field" style="margin-top:12px"><span>Logo URL</span><input class="input" data-club="${esc(id)}" data-k="logo" value="${esc(c.logo)}"></label><button class="btn" data-pick="${esc(id)}" style="margin-top:8px">Choose from Media Library</button></article>`}function match(m,i){const opts=k=>Object.entries(football.clubs).map(([id,c])=>`<option value="${esc(id)}" ${m[k]===id?'selected':''}>${esc(c.name)}</option>`).join('');return `<article class="match"><div><div class="num">${String(i+1).padStart(2,'0')}</div><div class="week">${esc(m.id)}</div></div><label class="field"><span>Week</span><input class="input" type="number" min="1" data-match="${esc(m.id)}" data-k="week" value="${Number(m.week)||1}"></label><label class="field"><span>Home club</span><select data-match="${esc(m.id)}" data-k="home">${opts('home')}</select></label><label class="field"><span>Away club</span><select data-match="${esc(m.id)}" data-k="away">${opts('away')}</select></label></article>`}
async function footballTab(a='content'){football=(await api('/football')).content;let h=fTabs(a);if(a==='content')h+=`<div class="hero"><div><h2>Content & Club Library</h2><p>The club library is the source used by the Showdown selectors and public fixture cards.</p></div><button class="btn primary" id="addClub">+ Add club</button></div><div class="card section"><div class="head"><div><h3>Cycle</h3><p>Cycle metadata shown by the public Football Centre.</p></div></div>${fields([['cycle.id','Cycle ID'],['cycle.label','Cycle label'],['cycle.title','Title'],['cycle.matchesPerWeek','Matches per week',true]])}<label class="field" style="margin-top:14px"><span>Description</span><textarea data-field="cycle.description">${esc(get(football,'cycle.description'))}</textarea></label></div><div class="clubgrid">${Object.entries(football.clubs||{}).map(([id,c])=>club(id,c)).join('')}</div>`;if(a==='matches')h+=`<div class="hero"><div><h2>Showdowns</h2><p>Every fixture references a club from the same library.</p></div></div><div class="notice"><b>Connected:</b> Home and Away are stored as club IDs. Edit a club once and every matching public fixture uses its updated name and logo. Any club added to the library can be selected.</div><div class="matchgrid" style="margin-top:14px">${(football.matches||[]).map(match).join('')}</div>`;if(a==='analysis')h+=`<div class="card section"><div class="head"><div><h3>Analysis</h3><p>Public Football Centre analysis content.</p></div></div>${fields([['analysis.label','Label'],['analysis.title','Title'],['analysis.videoEmbedUrl','Video embed URL'],['analysis.videoWatchUrl','Video watch URL'],['analysis.videoTitle','Video title']])}<label class="field"><span>Warning</span><textarea data-field="analysis.warning">${esc(get(football,'analysis.warning'))}</textarea></label><label class="field"><span>Video body</span><textarea data-field="analysis.videoBody">${esc(get(football,'analysis.videoBody'))}</textarea></label><label class="field"><span>Video warning</span><textarea data-field="analysis.videoWarning">${esc(get(football,'analysis.videoWarning'))}</textarea></label></div>`;if(a==='totw')h+=`<div class="card section"><div class="head"><div><h3>Team of the Week</h3><p>Manage the existing public section.</p></div></div>${fields([['totw.label','Label'],['totw.title','Title'],['totw.chip','Chip'],['totw.statusLabel','Status label'],['totw.statusTitle','Status title'],['totw.safetyLabel','Safety label'],['totw.safetyTitle','Safety title']])}<label class="field"><span>Description</span><textarea data-field="totw.description">${esc(get(football,'totw.description'))}</textarea></label><label class="field"><span>Status body</span><textarea data-field="totw.statusBody">${esc(get(football,'totw.statusBody'))}</textarea></label><label class="field"><span>Safety body</span><textarea data-field="totw.safetyBody">${esc(get(football,'totw.safetyBody'))}</textarea></label></div>`;if(a==='settings')h+=`<div class="grid"><div class="card section"><div class="head"><div><h3>Cycle settings</h3><p>Keep the cycle ID aligned.</p></div></div>${fields([['settings.cycleId','Cycle ID']])}<label class="field"><span>Starting balance</span><input class="input" type="number" min="0" data-field="settings.startingBalance" value="${Number(get(football,'settings.startingBalance')||0)}"></label></div><div class="card section"><div class="head"><div><h3>Scoring</h3><p>Values used by the public runtime.</p></div></div>${fields([['settings.scoring.played','Played points',true],['settings.scoring.worldClass','World Class bonus',true],['settings.scoring.correctPrediction','Correct prediction bonus',true]])}</div></div>`;app.innerHTML=h+savebar();document.querySelectorAll('[data-ft]').forEach(b=>b.onclick=()=>footballTab(b.dataset.ft));document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pickMedia(b.dataset.pick));document.querySelectorAll('[data-club][data-k="logo"]').forEach(i=>i.oninput=()=>i.closest('.club')?.querySelector('.clubimg')?.setAttribute('src',i.value));$('#addClub')?.addEventListener('click',()=>{const id=prompt('Club ID (letters, numbers, hyphens):','club-'+(Object.keys(football.clubs).length+1));if(!id)return;if(!/^[a-z0-9-]+$/i.test(id)||football.clubs[id])return state('Invalid or duplicate club ID.',false);football.clubs[id]={name:'New Club',short:'New Club',logo:''};footballTab('content')});$('#save').onclick=saveFootball}
function savebar(){return `<div class="save"><span class="muted">Club library → matches → public Football Centre</span><button class="btn primary" id="save">Save changes</button></div>`}async function saveFootball(){const b=$('#save');busy(b,true);try{document.querySelectorAll('[data-field]').forEach(e=>set(football,e.dataset.field,e.type==='number'?Number(e.value):e.value.trim()));for(const id of Object.keys(football.clubs)){for(const k of ['name','short','logo']){const e=document.querySelector(`[data-club="${id}"][data-k="${k}"]`);if(e)football.clubs[id][k]=e.value.trim()}}for(const m of football.matches){for(const k of ['home','away','week']){const e=document.querySelector(`[data-match="${m.id}"][data-k="${k}"]`);if(e)m[k]=k==='week'?Number(e.value):e.value}}football.settings.cycleId=football.cycle.id;await api('/football',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content:football})});state('Football Centre saved.')}catch(e){state(e.message,false)}finally{busy(b,false)}}
async function pickMedia(id){try{media=(await api('/media')).resources||[]}catch(e){return state(e.message,false)}openModal(`<div class="dialoghead"><div><h3>Choose club logo</h3><div class="muted">Select from the shared media library.</div></div><button class="close" data-close>×</button></div><div class="dialogbody"><input class="input" id="pickSearch" placeholder="Search assets…"><div class="pickergrid">${media.map(x=>`<div class="pickeritem" data-item data-name="${esc((x.publicId||'').toLowerCase())}"><img src="${esc(x.url)}" alt=""><button data-url="${esc(x.url)}">Use image</button></div>`).join('')||'<div class="empty">No media assets found.</div>'}</div></div>`);document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>{const e=document.querySelector(`[data-club="${id}"][data-k="logo"]`);if(e){e.value=b.dataset.url;e.dispatchEvent(new Event('input'))}closeModal()});$('#pickSearch').oninput=e=>document.querySelectorAll('[data-item]').forEach(x=>x.style.display=(x.dataset.name||'').includes(e.target.value.toLowerCase())?'':'none')}
async function uploadFiles(files,status){const list=Array.from(files||[]).filter(f=>f.type.startsWith('image/'));if(!list.length){status.textContent='Please choose image files.';return}for(let i=0;i<list.length;i++){const f=list[i];status.textContent=`Uploading ${i+1} of ${list.length}: ${f.name}`;try{const p=await api('/media/sign');const form=new FormData();form.append('file',f);form.append('api_key',p.apiKey);form.append('timestamp',p.timestamp);form.append('folder',p.folder);form.append('signature',p.signature);const r=await fetch(`https://api.cloudinary.com/v1_1/${p.cloudName}/image/upload`,{method:'POST',body:form});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b?.error?.message||`Upload failed (${r.status}).`)}catch(e){status.textContent=`Upload failed: ${e.message}`;return}}status.textContent=`Uploaded ${list.length} image${list.length===1?'':'s'} successfully.`;state('Media uploaded.');setTimeout(()=>mediaPage(),500)}
async function mediaPage(){let resources=[];try{resources=(await api('/media')).resources||[]}catch(e){app.innerHTML=`<div class="error">${esc(e.message)}</div>`;return}app.innerHTML=`<div class="hero"><div><h2>Media Library</h2><p>Browse, search, upload and reuse your Cloudinary images.</p></div></div><div class="card section"><div class="head"><div><h3>Upload media</h3><p>Drag images here or choose files. Multiple images are supported.</p></div></div><div class="dropzone" id="dropzone"><div><b>Drop images here</b><span>or select image files from your device</span><button class="btn primary" type="button" id="chooseFiles">Choose images</button><input id="upload" type="file" accept="image/*" multiple hidden><div class="upload-status" id="uploadStatus">Ready for upload.</div></div></div></div><div class="card section"><div class="head"><div><h3>Assets</h3><p>${resources.length} assets</p></div><input class="input search" id="mediaSearch" placeholder="Search assets…"></div><div class="mediagrid">${resources.map(x=>`<article class="media" data-media data-name="${esc((x.publicId||'').toLowerCase())}"><div class="thumb"><img src="${esc(x.url)}" alt=""></div><div class="minfo"><b title="${esc(x.publicId||'')}">${esc(x.publicId||'Image')}</b><small>${esc(x.format||'image')} · ${x.width||'—'}×${x.height||'—'}</small><div class="toolbar" style="margin-top:8px"><button class="btn" data-copy="${esc(x.url)}">Copy URL</button></div></div></article>`).join('')||'<div class="empty">No media assets found.</div>'}</div></div>`;const drop=$('#dropzone'),input=$('#upload'),status=$('#uploadStatus');$('#chooseFiles').onclick=()=>input.click();input.onchange=e=>uploadFiles(e.target.files,status);['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>uploadFiles(e.dataTransfer.files,status));drop.addEventListener('click',e=>{if(e.target===drop)input.click()});$('#mediaSearch').oninput=e=>document.querySelectorAll('[data-media]').forEach(x=>x.style.display=(x.dataset.name||'').includes(e.target.value.toLowerCase())?'':'none');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);state('URL copied.')}catch{state('Clipboard access failed.',false)}})}
async function load(s){nav(s);try{if(s==='overview')await overview();else if(s==='redeem')await redeem();else if(s==='football')await footballTab('content');else await mediaPage()}catch(e){app.innerHTML=`<div class="error">${esc(e.message)}</div>`;state(e.message,false)}}document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>load(b.dataset.section));$('#logout').onclick=async()=>{try{await api('/logout',{method:'POST'})}finally{location.replace('/admin/')}};load('overview');</script></body></html>
