r-spacing:.08em}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font:700 7px var(--mono)}.pill.active{background:#c9f56a12;color:var(--lime)}.pill.scheduled{background:#ffc66c12;color:var(--amber)}.pill.expired{background:#ff7e6d12;color:#ff9e92}.mediagrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px}.media{overflow:hidden;background:#0b1012;border:1px solid #293336;border-radius:14px;box-shadow:0 13px 30px #0004;transition:.18s}.media:hover{transform:translateY(-2px);border-color:#414b4b}.thumb{height:150px;background:#070b0d}.thumb img{width:100%;height:100%;object-fit:cover}.minfo{padding:10px}.minfo b{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.minfo small{display:block;color:#66716c;font:700 7px var(--mono);margin-top:3px}.toolbar{display:flex;gap:5px;flex-wrap:wrap}.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:22px;background:#000d}.modal.open{display:flex}.dialog{width:min(700px,100%);max-height:90vh;overflow:auto;background:#101618;border:1px solid #35403f;border-radius:20px;box-shadow:0 35px 110px #000e}.dialoghead{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dialoghead h3{font:700 18px var(--display);margin:0}.dialogbody{padding:22px}.dialogfoot{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.close{width:32px;height:32px;border:1px solid #303a3c;border-radius:9px;background:#181f21;color:#b6c0bb;font-size:16px}.pickergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.pickeritem{overflow:hidden;border:1px solid #293438;border-radius:11px;background:#0a0f11}.pickeritem img{width:100%;height:105px;object-fit:cover;display:block}.pickeritem button{width:100%;border:0;border-top:1px solid #293438;background:#121819;color:#fff;padding:8px;font:700 8px var(--mono)}.save{position:sticky;bottom:16px;z-index:8;margin-top:20px;padding:12px 14px;border:1px solid #36413e;border-radius:13px;background:#111719ea;backdrop-filter:blur(15px);display:flex;justify-content:space-between;align-items:center;box-shadow:0 20px 45px #0007}.dropzone{margin-top:14px;border:1px dashed #4a5754;border-radius:19px;background:radial-gradient(circle at 50% 0,#c9f56a0b,transparent 56%),radial-gradient(circle at 10% 90%,#aa91ff08,transparent 45%),#080e10;min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;transition:.16s}.dropzone.drag{border-color:var(--lime);background:#10170f;box-shadow:0 0 0 3px #c9f56a10,0 20px 60px #0006}.dropzone b{display:block;font:700 17px var(--display);letter-spacing:-.025em}.dropzone span{display:block;color:#7c8781;font-size:9px;margin-top:5px}.dropzone .btn{margin-top:13px}.upload-status{margin-top:10px;font:700 7px var(--mono);color:#6f7a75}.empty{padding:30px;text-align:center;border:1px dashed #394342;border-radius:12px;color:#727d78;font-size:9px}.error{padding:14px;border:1px solid #613a36;background:#211412;color:#ffb8ae;border-radius:11px}.search{max-width:340px}.muted{color:var(--muted);font-size:9px}.quick-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.quick{padding:15px;border:1px solid #293336;border-radius:15px;background:#0b1012;display:flex;justify-content:space-between;align-items:center;gap:12px}.quick b{display:block;font:700 10px var(--display)}.quick span{display:block;color:#6f7a75;font-size:8px;margin-top:3px}.quick-violet{border-color:#3c3650}.quick-lime{border-color:#3d5130}.quick-coral{border-color:#503b38}

.nav-external{display:block;padding:12px 12px 12px 42px;border:1px solid transparent;border-radius:12px;color:#7d8883;font-weight:700;font-size:10px;text-decoration:none;position:relative}.nav-external:before{content:"05";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#606b66;font:700 9px var(--mono)}.nav-external:hover{background:#ffffff05;color:#edf1ed;border-color:#ffffff0b}</style></head><body><div class="layout"><aside class="side"><div class="brand"><div class="mark">FC</div><div><b>FC Mobile Tools</b><small>Content command centre</small></div></div><div class="side-card"><span>WORKSPACE MODE</span><strong>Live content control</strong><p>Changes here are written into the site data flow</p></div><div class="navlabel">Workspace</div><nav class="nav"><button data-section="overview">Overview</button><button data-section="redeem">Redeem Codes</button><button data-section="football">Football Centre</button><button data-section="media">Media Library</button><a class="nav-external" href="/admin/calculators.html">Calculator Data</a></nav><button class="out" id="logout">Sign out</button></aside><div class="main"><header class="top"><div><div class="crumb">Admin / <span id="crumb">Overview</span></div><h1 id="title">Overview</h1></div><div class="state"><i class="dot" id="dot"></i><span id="status">Ready</span></div></header><main class="body" id="app"></main></div></div><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><script>
const $=s=>document.querySelector(s),app=$('#app'),modal=$('#modal'),dialog=$('#dialog');let football=null,media=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,o={}){const r=await fetch('/api/admin'+path,{credentials:'same-origin',...o});const b=await r.json().catch(()=>({}));if(r.status===401){location.replace('/admin/');throw Error('Session expired')}if(!r.ok)throw Error(b.error||`Request failed (${r.status})`);return b}function state(t,ok=true){$('#status').textContent=t;$('#dot').className='dot'+(ok?'':' bad')}function busy(b,on){if(!b)return;b.disabled=on;if(on){b.dataset.t=b.textContent;b.textContent='Saving…'}else b.textContent=b.dataset.t||b.textContent}function nav(s){document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===s));const n={overview:'Overview',redeem:'Redeem Codes',football:'Football Centre',media:'Media Library'}[s];$('#title').textContent=n;$('#crumb').textContent=n}function openModal(h){dialog.innerHTML=h;modal.classList.add('open');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}function closeModal(){modal.classList.remove('open');dialog.innerHTML=''}modal.onclick=e=>{if(e.target===modal)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeModal()});
async function overview(){const[r,f,m]=await Promise.all([api('/redeem'),api('/football'),api('/media')]);app.innerHTML=`<div class="hero"><div><div class="eyebrow"><i></i> COMMAND DECK</div><h2>Dashboard</h2><p>Your live content workspace at a glance</p></div><div class="hero-tools"><div class="hero-badge"><i></i> Connected workspace</div></div></div><div class="cards"><div class="card stat"><small>Redeem codes</small><strong>${r.codes.length}</strong><span>${r.codes.filter(x=>x.status==='active').length} active right now</span></div><div class="card stat"><small>Club library</small><strong>${Object.keys(f.content.clubs||{}).length}</strong><span>Available to Showdowns</span></div><div class="card stat"><small>Showdowns</small><strong>${f.content.matches?.length||0}</strong><span>Current fixture list</span></div><div class="card stat"><small>Media assets</small><strong>${m.resources?.length||0}</strong><span>Cloudinary library</span></div></div><div class="card section"><div class="head"><div><h3>Command deck</h3><p>Jump directly into the workspace you use most</p></div></div><div class="quick-strip"><div class="quick quick-violet"><div><b>Redeem codes</b><span>Create, edit and search codes</span></div><button class="btn" data-go="redeem">Open</button></div><div class="quick quick-lime"><div><b>Football Centre</b><span>Clubs, matchups and content</span></div><button class="btn" data-go="football">Open</button></div><div class="quick quick-coral"><div><b>Media Library</b><span>Upload and reuse image assets</span></div><button class="btn" data-go="media">Open</button></div></div></div>`;document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>load(b.dataset.go))}
function codeForm(c){return `<div class="dialoghead"><div><h3>${c?'Edit redeem code':'New redeem code'}</h3><div class="muted">${c?'Update this existing record':'Create a new public code record'}</div></div><button class="close" data-close>×</button></div><div class="dialogbody"><div class="grid"><label class="field"><span>Code</span><input class="input" id="code" value="${esc(c?.code||'')}" autocomplete="off"></label><label class="field"><span>Reward</span><input class="input" id="reward" value="${esc(c?.reward||'')}"></label><label class="field"><span>Status</span><select id="cstatus"><option value="active" ${c?.status==='active'?'selected':''}>Active</option><option value="scheduled" ${c?.status==='scheduled'?'selected':''}>Scheduled</option><option value="expired" ${c?.status==='expired'?'selected':''}>Expired</option></select></label><label class="field"><span>Region</span><input class="input" id="region" value="${esc(c?.region||'Global')}"></label><label class="field"><span>Release date</span><input class="input" id="release" type="date" value="${esc(c?.releaseDate||'')}"></label><label class="field"><span>Expiry date</span><input class="input" id="expiry" type="date" value="${esc(c?.expiryDate||'')}"></label><label class="field"><span>Last verified</span><input class="input" id="verified" type="date" value="${esc(c?.lastVerified||'')}"></label><label class="field"><span>Notes</span><input class="input" id="notes" value="${esc(c?.notes||'')}"></label></div></div><div class="dialogfoot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="commit">${c?'Update code':'Create code'}</button></div>`}
async function redeem(){const{codes}=await api('/redeem');app.innerHTML=`<div class="hero"><div><div class="eyebrow"><i></i> CONTENT OPS</div><h2>Redeem Codes</h2><p>Search, review and edit codes without leaving the list</p></div><button class="btn primary" id="new">+ New code</button></div><div class="card section"><div class="head"><div><h3>Code database</h3><p>${codes.length} records</p></div><input class="input search" id="codeSearch" placeholder="Search code or reward"></div><div class="codegrid"><div class="code headrow"><span>Code</span><span>Reward</span><span>Status</span><span>Release</span><span>Expiry</span><span></span></div>${codes.map(x=>`<div class="code" data-row data-search="${esc((x.code+' '+x.reward).toLowerCase())}"><strong>${esc(x.code)}</strong><span>${esc(x.reward)}</span><span><i class="pill ${esc(x.status)}">${esc(x.status)}</i></span><span>${esc(x.releaseDate||'—')}</span><span>${esc(x.expiryDate||'No expiry')}</span><button class="btn" data-edit="${esc(x.code)}">Edit</button></div>`).join('')||'<div class="empty">No redeem codes found</div>'}</div></div>`;$('#new').onclick=()=>{openModal(codeForm(null));$('#commit').onclick=saveCode};document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{openModal(codeForm(codes.find(x=>String(x.code).toUpperCase()===b.dataset.edit.toUpperCase())));$('#commit').onclick=saveCode});$('#codeSearch').oninput=e=>document.querySelectorAll('[data-row]').forEach(r=>r.style.display=(r.dataset.search||'').includes(e.target.value.toLowerCase())?'':'none')}
async function saveCode(){const b=$('#commit');busy(b,true);try{const r=await api('/redeem',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:$('#code').value,reward:$('#reward').value,status:$('#cstatus').value,releaseDate:$('#release').value,expiryDate:$('#expiry').value||null,region:$('#region').value,lastVerified:$('#verified').value,notes:$('#notes').value})});closeModal();state(r.action==='updated'?'Code updated':'Code created');await redeem()}catch(e){state(e.message,false)}finally{busy(b,false)}}
function fTabs(a){return `<div class="tabs">${[['content','Content'],['matches','Matches'],['analysis','Analysis'],['totw','TOTW'],['settings','Settings']].map(x=>`<button class="${a===x[0]?'active':''}" data-ft="${x[0]}">${x[1]}</button>`).join('')}</div>`}function get(o,p){return p.split('.').reduce((v,k)=>v?.[k],o)??''}function set(o,p,v){const a=p.split('.');let x=o;for(const k of a.slice(0,-1))x=x[k]??{};x[a.at(-1)]=v}function fields(list){return `<div class="grid">${list.map(([p,l,n])=>`<label class="field"><span>${l}</span><input class="input" ${n?'type="number" min="0"':''} data-field="${p}" value="${esc(get(football,p))}"></label>`).join('')}</div>`}
function club(id,c){return `<article class="club"><div class="clubhead"><img class="clubimg" src="${esc(c.logo)}" alt=""><div><div class="clubname">${esc(c.name||'Unnamed club')}</div><div class="clubid">ID · ${esc(id)}</div></div></div><div class="grid"><label class="field"><span>Name</span><input class="input" data-club="${esc(id)}" data-k="name" value="${esc(c.name)}"></label><label class="field"><span>Short name</span><input class="input" data-club="${esc(id)}" data-k="short" value="${esc(c.short)}"></label></div><label class="field" style="margin-top:12px"><span>Logo URL</span><input class="input" data-club="${esc(id)}" data-k="logo" value="${esc(c.logo)}"></label><button class="btn" data-pick="${esc(id)}" style="margin-top:8px">Choose from Media Library</button></article>`}function match(m,i){const opts=k=>Object.entries(football.clubs).map(([id,c])=>`<option value="${esc(id)}" ${m[k]===id?'selected':''}>${esc(c.name)}</option>`).join('');return `<article class="match"><div><div class="num">${String(i+1).padStart(2,'0')}</div><div class="week">${esc(m.id)}</div></div><label class="field"><span>Week</span><input class="input" type="number" min="1" data-match="${esc(m.id)}" data-k="week" value="${Number(m.week)||1}"></label><label class="field"><span>Home club</span><select data-match="${esc(m.id)}" data-k="home">${opts('home')}</select></label><label class="field"><span>Away club</span><select data-match="${esc(m.id)}" data-k="away">${opts('away')}</select></label></article>`}
async function footballTab(a='content'){football=(await api('/football')).content;let h=fTabs(a);if(a==='content')h+=`<div class="hero"><div><div class="eyebrow"><i></i> FOOTBALL CONTENT</div><h2>Content & Club Library</h2><p>The club library is the source used by the Showdown selectors and public fixture cards</p></div><button class="btn primary" id="addClub">+ Add club</button></div><div class="card section"><div class="head"><div><h3>Cycle</h3><p>Cycle metadata shown by the public Football Centre</p></div></div>${fields([['cycle.id','Cycle ID'],['cycle.label','Cycle label'],['cycle.title','Title'],['cycle.matchesPerWeek','Matches per week',true]])}<label class="field" style="margin-top:14px"><span>Description</span><textarea data-field="cycle.description">${esc(get(football,'cycle.description'))}</textarea></label></div><div class="clubgrid">${Object.entries(football.clubs||{}).map(([id,c])=>club(id,c)).join('')}</div>`;if(a==='matches')h+=`<div class="hero"><div><div class="eyebrow"><i></i> FIXTURE OPS</div><h2>Showdowns</h2><p>Every fixture references a club from the same library</p></div></div><div class="notice"><b>Connected:</b> Home and Away are stored as club IDs. Edit a club once and every matching public fixture uses its updated name and logo. Any club added to the library can be selected.</div><div class="matchgrid" style="margin-top:14px">${(football.matches||[]).map(match).join('')}</div>`;if(a==='analysis')h+=`<div class="card section"><div class="head"><div><h3>Analysis</h3><p>Public Football Centre analysis content</p></div></div>${fields([['analysis.label','Label'],['analysis.title','Title'],['analysis.videoEmbedUrl','Video embed URL'],['analysis.videoWatchUrl','Video watch URL'],['analysis.videoTitle','Video title']])}<label class="field"><span>Warning</span><textarea data-field="analysis.warning">${esc(get(football,'analysis.warning'))}</textarea></label><label class="field"><span>Video body</span><textarea data-field="analysis.videoBody">${esc(get(football,'analysis.videoBody'))}</textarea></label><label class="field"><span>Video warning</span><textarea data-field="analysis.videoWarning">${esc(get(football,'analysis.videoWarning'))}</textarea></label></div>`;if(a==='totw')h+=`<div class="card section"><div class="head"><div><h3>Team of the Week</h3><p>Manage the existing public section</p></div></div>${fields([['totw.label','Label'],['totw.title','Title'],['totw.chip','Chip'],['totw.statusLabel','Status label'],['totw.statusTitle','Status title'],['totw.safetyLabel','Safety label'],['totw.safetyTitle','Safety title']])}<label class="field"><span>Description</span><textarea data-field="totw.description">${esc(get(football,'totw.description'))}</textarea></label><label class="field"><span>Status body</span><textarea data-field="totw.statusBody">${esc(get(football,'totw.statusBody'))}</textarea></label><label class="field"><span>Safety body</span><textarea data-field="totw.safetyBody">${esc(get(football,'totw.safetyBody'))}</textarea></label></div>`;if(a==='settings')h+=`<div class="grid"><div class="card section"><div class="head"><div><h3>Cycle settings</h3><p>Keep the cycle ID aligned</p></div></div>${fields([['settings.cycleId','Cycle ID']])}<label class="field"><span>Starting balance</span><input class="input" type="number" min="0" data-field="settings.startingBalance" value="${Number(get(football,'settings.startingBalance')||0)}"></label></div><div class="card section"><div class="head"><div><h3>Scoring</h3><p>Values used by the public runtime</p></div></div>${fields([['settings.scoring.played','Played points',true],['settings.scoring.worldClass','World Class bonus',true],['settings.scoring.correctPrediction','Correct prediction bonus',true]])}</div></div>`;app.innerHTML=h+savebar();document.querySelectorAll('[data-ft]').forEach(b=>b.onclick=()=>footballTab(b.dataset.ft));document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pickMedia(b.dataset.pick));document.querySelectorAll('[data-club][data-k="logo"]').forEach(i=>i.oninput=()=>i.closest('.club')?.querySelector('.clubimg')?.setAttribute('src',i.value));$('#addClub')?.addEventListener('click',()=>{const id=prompt('Club ID (letters, numbers, hyphens):','club-'+(Object.keys(football.clubs).length+1));if(!id)return;if(!/^[a-z0-9-]+$/i.test(id)||football.clubs[id])return state('Invalid or duplicate club ID',false);football.clubs[id]={name:'New Club',short:'New Club',logo:''};footballTab('content')});$('#save').onclick=saveFootball}
function savebar(){return `<div class="save"><span class="muted">Club library → matches → public Football Centre</span><button class="btn primary" id="save">Save changes</button></div>`}async function saveFootball(){const b=$('#save');busy(b,true);try{document.querySelectorAll('[data-field]').forEach(e=>set(football,e.dataset.field,e.type==='number'?Number(e.value):e.value.trim()));for(const id of Object.keys(football.clubs)){for(const k of ['name','short','logo']){const e=document.querySelector(`[data-club="${id}"][data-k="${k}"]`);if(e)football.clubs[id][k]=e.value.trim()}}for(const m of football.matches){for(const k of ['home','away','week']){const e=document.querySelector(`[data-match="${m.id}"][data-k="${k}"]`);if(e)m[k]=k==='week'?Number(e.value):e.value}}football.settings.cycleId=football.cycle.id;await api('/football',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content:football})});state('Football Centre saved')}catch(e){state(e.message,false)}finally{busy(b,false)}}
async function pickMedia(id){try{media=(await api('/media')).resources||[]}catch(e){return state(e.message,false)}openModal(`<div class="dialoghead"><div><h3>Choose club logo</h3><div class="muted">Select from the shared media library</div></div><button class="close" data-close>×</button></div><div class="dialogbody"><input class="input" id="pickSearch" placeholder="Search assets"><div class="pickergrid">${media.map(x=>`<div class="pickeritem" data-item data-name="${esc((x.publicId||'').toLowerCase())}"><img src="${esc(x.url)}" alt=""><button data-url="${esc(x.url)}">Use image</button></div>`).join('')||'<div class="empty">No media assets found</div>'}</div></div>`);document.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>{const e=document.querySelector(`[data-club="${id}"][data-k="logo"]`);if(e){e.value=b.dataset.url;e.dispatchEvent(new Event('input'))}closeModal()});$('#pickSearch').oninput=e=>document.querySelectorAll('[data-item]').forEach(x=>x.style.display=(x.dataset.name||'').includes(e.target.value.toLowerCase())?'':'none')}
async function uploadFiles(files,status){const list=Array.from(files||[]).filter(f=>f.type.startsWith('image/'));if(!list.length){status.textContent='Choose image files to upload';state('No image files selected',false);return}for(let i=0;i<list.length;i++){const f=list[i];status.textContent=`Uploading ${i+1} of ${list.length}: ${f.name}`;try{const p=await api('/media/sign');const form=new FormData();form.append('file',f);form.append('api_key',p.apiKey);form.append('timestamp',p.timestamp);if(p.folder)form.append('folder',p.folder);form.append('signature',p.signature);const r=await fetch(`https://api.cloudinary.com/v1_1/${p.cloudName}/image/upload`,{method:'POST',body:form});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b?.error?.message||`Upload failed (${r.status})`)}catch(e){status.textContent=`Upload failed: ${e.message}`;state('Upload failed',false);return}}status.textContent=`Uploaded ${list.length} image${list.length===1?'':'s'} successfully`;state('Media uploaded');setTimeout(()=>mediaPage(),500)}
async function mediaPage(){let resources=[];try{resources=(await api('/media')).resources||[]}catch(e){app.innerHTML=`<div class="error">${esc(e.message)}</div>`;return}app.innerHTML=`<div class="hero"><div><div class="eyebrow"><i></i> ASSET OPS</div><h2>Media Library</h2><p>Browse, search, upload and reuse your Cloudinary images</p></div></div><div class="card section"><div class="head"><div><h3>Upload media</h3><p>Drop images here or choose files from your device</p></div><div class="inline-note">MULTIPLE FILES SUPPORTED</div></div><div class="dropzone" id="dropzone"><div><b>Drop images into the vault</b><span>PNG, JPG, WEBP and other image formats supported by your Cloudinary setup</span><button class="btn primary" type="button" id="chooseFiles">Choose images</button><input id="upload" type="file" accept="image/*" multiple hidden><div class="upload-status" id="uploadStatus">Ready for upload</div></div></div></div><div class="card section"><div class="head"><div><h3>Assets</h3><p>${resources.length} assets available</p></div><input class="input search" id="mediaSearch" placeholder="Search assets"></div><div class="mediagrid">${resources.map(x=>`<article class="media" data-media data-name="${esc((x.publicId||'').toLowerCase())}"><div class="thumb"><img src="${esc(x.url)}" alt=""></div><div class="minfo"><b title="${esc(x.publicId||'')}">${esc(x.publicId||'Image')}</b><small>${esc(x.format||'image')} · ${x.width||'—'}×${x.height||'—'}</small><div class="toolbar" style="margin-top:8px"><button class="btn" data-copy="${esc(x.url)}">Copy URL</button></div></div></article>`).join('')||'<div class="empty">No media assets found</div>'}</div></div>`;const drop=$('#dropzone'),input=$('#upload'),status=$('#uploadStatus');$('#chooseFiles').onclick=()=>input.click();input.onchange=e=>uploadFiles(e.target.files,status);['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();drop.classList.add('drag')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>uploadFiles(e.dataTransfer.files,status));drop.addEventListener('click',e=>{if(e.target===drop)input.click()});$('#mediaSearch').oninput=e=>document.querySelectorAll('[data-media]').forEach(x=>x.style.display=(x.dataset.name||'').includes(e.target.value.toLowerCase())?'':'none');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);state('URL copied')}catch{state('Clipboard access failed',false)}})}
async function load(s){nav(s);try{if(s==='overview')await overview();else if(s==='redeem')await redeem();else if(s==='football')await footballTab('content');else await mediaPage()}catch(e){app.innerHTML=`<div class="error">${esc(e.message)}</div>`;state(e.message,false)}}document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>load(b.dataset.section));$('#logout').onclick=async()=>{try{await api('/logout',{method:'POST'})}finally{location.replace('/admin/')}};load('overview');
</script></body></html>
