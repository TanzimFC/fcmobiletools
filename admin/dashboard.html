<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>FCMOBILETOOLS Admin</title><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Manrope:wght@500;700;800&family=Sora:wght@600;700;800&display=swap');
:root{--bg:#05080c;--panel:#0b1219;--panel2:#0e1821;--line:#20313e;--text:#eef7fb;--muted:#7f94a4;--cyan:#55d7ff;--blue:#5b76ff;--red:#ff3f4d;--green:#61e7a0;--sans:Manrope,system-ui,sans-serif;--display:Sora,system-ui,sans-serif;--mono:"IBM Plex Mono",monospace}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 600px at 0 0,#55d7ff12,transparent 60%),radial-gradient(800px 500px at 100% 20%,#5b76ff10,transparent 60%),var(--bg);color:var(--text);font:13px/1.5 var(--sans)}button,input,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:#071017ee;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:10px;padding:5px 8px 25px}.mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#6ee5ff,#526fff);color:#041018;font:900 10px var(--mono)}.brand b{font:800 13px var(--display)}.brand small{display:block;color:#607887;font-size:8px;margin-top:2px}.label{padding:8px;color:#597081;font:700 7px var(--mono);letter-spacing:.15em}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;color:#8195a3;text-align:left;padding:11px 12px;border-radius:10px;font-weight:800;font-size:10px}.nav button:hover,.nav button.active{color:#eef8fb;background:#55d7ff0c;border-color:#244658}.nav button.active{box-shadow:inset 3px 0 var(--cyan);color:var(--cyan)}.side-bottom{position:absolute;bottom:18px;left:14px;right:14px}.status{padding:12px;border:1px solid #20343f;border-radius:12px;background:#09141b;color:#748a98;font-size:9px}.status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:7px}.logout{width:100%;margin-top:8px;padding:10px;border:1px solid #243743;border-radius:10px;background:#0b151c;color:#91a6b3;font:800 8px var(--mono)}.main{min-width:0}.top{position:sticky;top:0;z-index:10;height:82px;padding:0 32px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);background:#060b10e8;backdrop-filter:blur(18px)}.crumb{color:#5f7585;font:700 7px var(--mono);letter-spacing:.1em}.top h1{margin:3px 0 0;font:800 21px var(--display)}.save-top{display:flex;gap:8px}.btn{padding:10px 13px;border:1px solid #294252;border-radius:10px;background:#0b151c;color:#b6d4e0;font:800 8px var(--mono)}.btn.primary{background:linear-gradient(135deg,#6be1ff,#398fe5);color:#031018;border-color:#69dcff}.content{padding:30px;max-width:1300px}.intro{margin-bottom:18px}.eyebrow{color:var(--cyan);font:800 8px var(--mono);letter-spacing:.15em}.intro h2{font:800 36px var(--display);letter-spacing:-.06em;margin:8px 0}.intro p{color:var(--muted);font-size:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{padding:20px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#0c151d,#081017);box-shadow:0 20px 60px #0005}.card.full{grid-column:1/-1}.head{display:flex;justify-content:space-between;align-items:start;margin-bottom:17px}.head h3{margin:0;font:800 15px var(--display)}.head p{margin:4px 0 0;color:#6e8391;font-size:9px}.switch{display:flex;align-items:center;gap:8px;color:#78909f;font:700 8px var(--mono)}.switch input{accent-color:var(--cyan)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:block}.field.full{grid-column:1/-1}.field span{display:block;color:#b7c9d2;font-size:8px;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;padding:10px 11px;border:1px solid #263b48;border-radius:9px;background:#071017;color:#eff8fb;outline:none}.field textarea{min-height:82px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#55d7ff;box-shadow:0 0 0 3px #55d7ff0d}.preview{margin-top:13px;border:1px solid #203540;border-radius:12px;overflow:hidden;background:#071017}.preview img{display:block;width:100%;max-height:220px;object-fit:cover}.preview small{display:block;padding:8px;color:#66808f;font:700 7px var(--mono)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick a{padding:15px;border:1px solid #213542;border-radius:12px;background:#09131a;color:#dcecf2;text-decoration:none}.quick b{display:block;font:800 10px var(--display)}.quick span{display:block;color:#718795;font-size:8px;margin-top:4px}.message{margin-top:14px;min-height:18px;color:#7f96a5;font:700 8px var(--mono)}.message.ok{color:var(--green)}.message.bad{color:#ff8990}.hint{padding:11px 12px;border:1px solid #203440;border-radius:10px;background:#08131a;color:#6e8594;font-size:9px;margin-top:12px}@media(max-width:820px){.app{display:block}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.side-bottom{display:none}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center}.top{padding:0 18px}.content{padding:20px 15px}.grid{grid-template-columns:1fr}}@media(max-width:540px){.nav{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.quick{grid-template-columns:1fr}.top h1{font-size:17px}.save-top .btn:first-child{display:none}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="mark">FC</div><div><b>FCMOBILETOOLS</b><small>Admin command center</small></div></div><div class="label">WORKSPACE</div><nav class="nav"><button class="active" data-view="resets">Live Center</button><button data-view="redeem">Redeem Codes</button><button data-view="football">Football Centre</button><button data-view="links">Tools &amp; Links</button></nav><div class="side-bottom"><div class="status"><i></i><span id="status">Ready</span></div><button class="logout" id="logout">Sign out</button></div></aside><main class="main"><header class="top"><div><div class="crumb">ADMIN / <span id="crumb">LIVE CENTER</span></div><h1 id="title">Live Center Controls</h1></div><div class="save-top"><button class="btn" id="refresh">Refresh</button><button class="btn primary" id="save">Save changes</button></div></header><div class="content" id="content"></div></main></div><script>
const $=s=>document.querySelector(s),content=$('#content');let football=null;
const api=async(path,options={})=>{const r=await fetch('/api/admin'+path,{credentials:'same-origin',...options});const b=await r.json().catch(()=>({error:'Invalid server response'}));if(r.status===401){location.replace('/admin/');throw Error('Session expired')}if(!r.ok)throw Error(b.error||'Request failed');return b};
const msg=(t,ok=false)=>{const e=$('#message');if(e){e.textContent=t;e.className='message '+(ok?'ok':'bad')}$('#status').textContent=t};
const setView=v=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));const map={resets:['LIVE CENTER','Live Center Controls'],redeem:['REDEEM','Redeem Codes'],football:['FOOTBALL','Football Centre'],links:['TOOLS','Tools & Links']};$('#crumb').textContent=map[v][0];$('#title').textContent=map[v][1];({resets:renderResets,redeem:renderRedeem,football:renderFootball,links:renderLinks}[v])()};
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
const localInputValue=utc=>{if(!utc)return'';const d=new Date(utc);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())};
const toUtc=v=>v?new Date(v).toISOString():'';
async function load(){football=(await api('/football')).content;renderResets();msg('Connected',true)}
function renderResets(){const e=football.eventCountdown||{},r=football.divisionRivalsReset||{};content.innerHTML=`<div class="intro"><div class="eyebrow">ONE PLACE / THREE LIVE CLOCKS</div><h2>Control the timing</h2><p>Edit UTC anchors here. Visitors automatically see the same timestamps converted to their own local time.</p></div><div class="grid"><section class="card"><div class="head"><div><h3>Anniversary Event</h3><p>Countdown, live state, banner and optional end time</p></div><label class="switch"><input id="eventEnabled" type="checkbox" ${e.enabled?'checked':''}> Enabled</label></div><div class="fields"><label class="field"><span>Title</span><input id="eventTitle" value="${esc(e.title)}"></label><label class="field"><span>Accent</span><input id="eventAccent" value="${esc(e.accent)}"></label><label class="field full"><span>Subtitle</span><input id="eventSubtitle" value="${esc(e.subtitle)}"></label><label class="field"><span>Start in your local editor time</span><input id="eventStart" type="datetime-local" value="${localInputValue(e.startUtc)}"></label><label class="field"><span>Optional end time</span><input id="eventEnd" type="datetime-local" value="${localInputValue(e.endUtc)}"></label><label class="field full"><span>Banner URL</span><input id="eventBanner" value="${esc(e.banner)}"></label></div><div class="preview"><img id="bannerPreview" src="${esc(e.banner)}" alt=""><small id="utcPreview">UTC start: —</small></div></section><section class="card"><div class="head"><div><h3>Division Rivals</h3><p>28-day season cycle with an editable UTC anchor</p></div><label class="switch"><input id="rivalsEnabled" type="checkbox" ${r.enabled?'checked':''}> Enabled</label></div><div class="fields"><label class="field full"><span>Title</span><input id="rivalsTitle" value="${esc(r.title)}"></label><label class="field"><span>Anchor in your local editor time</span><input id="rivalsAnchor" type="datetime-local" value="${localInputValue(r.anchorUtc)}"></label><label class="field"><span>Cycle length in days</span><input id="cycleDays" type="number" min="1" max="365" value="${Number(r.cycleDays)||28}"></label><label class="field full"><span>Label</span><input id="rivalsLabel" value="${esc(r.label)}"></label><label class="field full"><span>Admin note</span><textarea id="rivalsNote">${esc(r.note)}</textarea></label></div><div class="hint">The saved anchor is UTC. The public center never depends on the admin computer timezone.</div></section><section class="card full"><div class="head"><div><h3>Save status</h3><p>One save updates both live schedules together</p></div></div><div id="message" class="message">Ready</div></section></div>`;$('#eventBanner').addEventListener('input',e=>$('#bannerPreview').src=e.target.value);$('#eventStart').addEventListener('change',updatePreview);updatePreview()}
function updatePreview(){const v=$('#eventStart').value;$('#utcPreview').textContent=v?'UTC start: '+new Date(v).toISOString():'UTC start: —'}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function saveResets(){try{const e={...football.eventCountdown,enabled:$('#eventEnabled').checked,title:$('#eventTitle').value.trim(),accent:$('#eventAccent').value.trim(),subtitle:$('#eventSubtitle').value.trim(),banner:$('#eventBanner').value.trim(),startUtc:toUtc($('#eventStart').value),endUtc:toUtc($('#eventEnd').value)};const r={...football.divisionRivalsReset,enabled:$('#rivalsEnabled').checked,title:$('#rivalsTitle').value.trim(),anchorUtc:toUtc($('#rivalsAnchor').value),cycleDays:Number($('#cycleDays').value),label:$('#rivalsLabel').value.trim(),note:$('#rivalsNote').value.trim()};if(!e.startUtc||!r.anchorUtc||!Number.isInteger(r.cycleDays)||r.cycleDays<1)throw Error('Start time, Division Rivals anchor and cycle length are required');const next={...football,eventCountdown:e,divisionRivalsReset:r};await api('/football',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content:next})});football=next;msg('Saved to main and queued for site deployment',true)}catch(x){msg(x.message)}}
function renderRedeem(){content.innerHTML=`<div class="intro"><div class="eyebrow">CONTENT / REDEEM</div><h2>Update a code</h2><p>Add or replace one redeem code without touching source files.</p></div><section class="card"><div class="fields"><label class="field"><span>Code</span><input id="code"></label><label class="field"><span>Reward</span><input id="reward"></label><label class="field"><span>Status</span><input id="codeStatus" value="active"></label><label class="field"><span>Release date</span><input id="release" type="date"></label><label class="field"><span>Expiry date optional</span><input id="expiry" type="date"></label><label class="field"><span>Region</span><input id="region" value="Global"></label></div><div id="message" class="message"></div></section>`;}
function renderFootball(){content.innerHTML=`<div class="intro"><div class="eyebrow">CONTENT / FOOTBALL CENTRE</div><h2>Football Centre</h2><p>The existing Football Centre editor stays available through the API. Use the raw JSON editor only when you need advanced changes.</p></div><section class="card"><label class="field"><span>Football Centre JSON</span><textarea id="footballJson" style="min-height:430px;font:11px var(--mono)"></textarea></label><div id="message" class="message"></div></section>`;$('#footballJson').value=JSON.stringify(football,null,2)}
function renderLinks(){content.innerHTML=`<div class="intro"><div class="eyebrow">WORKSPACE / QUICK ACCESS</div><h2>Everything else</h2><p>Open the specialized tools without rebuilding the main admin workspace.</p></div><div class="quick"><a href="/admin/calculators.html"><b>Calculator Data</b><span>Training and Rank Up data tools</span></a><a href="/redeem-codes"><b>Public Redeem Codes</b><span>Preview the live public page</span></a><a href="/reset-center"><b>Public Live Center</b><span>Preview all three clocks</span></a></div>`;}
$('#save').addEventListener('click',()=>saveResets());$('#refresh').addEventListener('click',()=>load());$('#logout').addEventListener('click',async()=>{await api('/logout',{method:'POST'});location.replace('/admin/')});load();
</script></body></html>
