<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tournament Operations · FCMOBILETOOLS</title>
<style>
:root{--bg:#071018;--surface:#0f1a26;--line:#263b4a;--text:#f5f8fb;--muted:#8fa1b1;--cyan:#4cc9ff;--good:#47d16c;--danger:#ff786f;--font:Inter,system-ui,sans-serif;--display:'Space Grotesk',Inter,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1000px 650px at 0 -10%,#4cc9ff15,transparent 60%),var(--bg);color:var(--text);font-family:var(--font)}
button,input,textarea,select{font:inherit}.shell{max-width:1550px;margin:auto;padding:24px 26px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}.brand{display:flex;gap:13px;align-items:center}.brand img{width:50px;height:50px;object-fit:contain}.brand b{display:block;font:700 18px var(--display)}.brand span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 13px;cursor:pointer}.btn:hover{border-color:#3c6378}.btn.primary{border-color:#6bdfff;background:linear-gradient(135deg,#69ddff,#2aa8e8);color:#04131c;font-weight:800}.btn:disabled{opacity:.45;cursor:not-allowed}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:28px 0 20px}.eyebrow{font:800 9px var(--font);letter-spacing:.16em;color:var(--cyan);text-transform:uppercase}.hero h1{font:700 clamp(35px,5vw,56px)/.95 var(--display);letter-spacing:-.055em;margin:7px 0}.hero p{color:var(--muted);margin:0;max-width:700px}.workspace{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}.panel{border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#0f1a26,#0a141e);box-shadow:0 22px 70px #0004}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 18px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font:700 16px var(--display)}.panel-body{padding:17px}.tours{display:grid;gap:7px}.tour{width:100%;text-align:left;border:1px solid var(--line);background:#0a141e;color:var(--text);border-radius:10px;padding:12px;cursor:pointer}.tour.active{border-color:#3884a5;box-shadow:inset 3px 0 var(--cyan)}.tour b{font-size:11px}.tour small{display:block;color:var(--muted);font-size:9px;margin-top:5px}.empty{padding:18px 2px;color:var(--muted);font-size:11px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:10px;font-weight:800;color:#b7c5cf;text-transform:uppercase;letter-spacing:.07em}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#09131d;color:var(--text);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #4cc9ff10}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.format-meta{padding:12px;border:1px solid #244454;border-radius:11px;background:#091923;margin:4px 0 16px}.format-meta strong{display:block;font:700 13px var(--display)}.format-meta span{display:block;color:var(--muted);font-size:10px;line-height:1.5;margin-top:4px}.limit{display:inline-block;margin-top:8px;color:#4cc9ff;font:700 9px var(--font)}.importer{display:grid;grid-template-columns:1fr 160px;gap:10px}.importer textarea{min-height:105px}.roster-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 11px}.search{max-width:250px}.roster{border:1px solid var(--line);border-radius:11px;overflow:hidden}.row{display:grid;grid-template-columns:60px 1fr 170px 70px;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid #1b2b37}.row:first-child{border-top:0}.row.head{background:#0b151f;color:#718497;font:800 9px var(--font);text-transform:uppercase}.row input{width:100%;border:1px solid transparent;border-radius:7px;background:#071018;color:var(--text);padding:7px 8px}.row input:focus{border-color:#31596d;outline:0}.slot{color:#718497;font-size:10px}.seed{color:#a7dff1;font-size:10px}.pager{display:flex;justify-content:space-between;align-items:center;padding-top:10px}.pager span{color:var(--muted);font-size:10px}.stage-tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.stage-tab{white-space:nowrap;border:1px solid var(--line);background:#0a141e;color:#9db0bf;border-radius:999px;padding:8px 11px;cursor:pointer;font-size:10px}.stage-tab.active{border-color:#3b7f9d;background:#0d222c;color:#eafaff}.standings{width:100%;border-collapse:collapse;font-size:10px}.standings th,.standings td{padding:9px 7px;border-bottom:1px solid #1b2b37;text-align:left}.standings th{color:#718497;font-size:8px;text-transform:uppercase}.match-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:10px}.match{padding:11px;border:1px solid var(--line);border-radius:11px;background:#0a141e}.match-top{display:flex;justify-content:space-between;color:#718497;font-size:8px;text-transform:uppercase}.playerline{display:grid;grid-template-columns:1fr 54px;gap:7px;align-items:center;padding-top:8px}.playerline+.playerline{border-top:1px solid #1b2b37;margin-top:7px}.playerline strong{font-size:11px}.score{width:54px;border:1px solid #2b4655;border-radius:7px;background:#071018;color:var(--text);padding:7px;text-align:center}.notice{padding:11px;border:1px solid #294c5d;border-radius:10px;background:#0b1b24;color:#a7dff1;font-size:10px;line-height:1.5;margin-bottom:13px}.toast{position:fixed;right:20px;bottom:20px;max-width:min(440px,calc(100vw - 40px));padding:12px 14px;border:1px solid #315064;border-radius:11px;background:#0b151f;box-shadow:0 20px 55px #0009;z-index:100;font-size:11px}.toast.bad{border-color:#6a3f3e;color:#ffaaa3}
@media(max-width:1000px){.workspace{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.importer{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media(max-width:650px){.shell{padding:18px 13px 60px}.top{align-items:start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.row{grid-template-columns:38px 1fr 80px}.row .seed{display:none}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><img src="/assets/images/logo.png" alt="FCMOBILETOOLS"><div><b>Tournament Operations</b><span>Official FCMOBILETOOLS competition control centre</span></div></div><div class="actions"><button class="btn" id="back">Admin Dashboard</button><button class="btn" id="logout">Sign out</button></div></header>
<section class="hero"><div><div class="eyebrow">ORGANIZER WORKSPACE</div><h1>Run the competition.</h1><p>Build the format, load hundreds of participants, generate the competition structure, manage results and publish the official tournament page.</p></div><button class="btn primary" id="new">Create Tournament</button></section>
<div class="workspace"><aside class="panel"><div class="panel-head"><h2>Tournaments</h2><button class="btn" id="refresh">Refresh</button></div><div class="panel-body"><div class="tours" id="tours"></div></div></aside><main id="app"></main></div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),app=$('#app'),toast=$('#toast');
let tournaments=[],selected=null,formats=[],page=1,rosterPageSize=25,stageIndex=0;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,opt={}){const r=await fetch('/api/tournament'+path,{credentials:'same-origin',...opt});const b=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)location.href='/admin/tournament/';throw Error(b.error||'Request failed')}return b}
function notify(message,bad=false){toast.textContent=message;toast.className='toast'+(bad?' bad':'');toast.hidden=false;clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.hidden=true,3600)}
function selectedFormat(){return formats.find(x=>x.key===selected?.formatKey)||formats[0]}
function defaultConfig(f){return JSON.parse(JSON.stringify(f?.defaults||{}))}
function adaptConfigToCount(){
  if(!selected)return;
  const f=selectedFormat();
  if(!f)return;
  const groupModes=['group_knockout','world_cup_style','groups_home_away_knockout'];
  if(!groupModes.includes(f.key))return;
  const c=selected.formatConfig||defaultConfig(f);
  let groups=Math.max(2,Math.min(500,Number(c.groups||2)));
  const count=Number(selected.participantCount||2);
  const minGroups=Math.ceil(count/Math.max(2,Number(c.teamsPerGroup||4)));
  if(groups<minGroups)groups=Math.min(500,minGroups);
  if(groups>count)groups=count;
  c.groups=groups;
  c.teamsPerGroup=Math.max(2,Math.ceil(count/groups));
  c.advancePerGroup=Math.min(Number(c.advancePerGroup||2),Math.max(1,Math.floor(count/groups)));
  selected.formatConfig=c;
}

function configFields(f,c){if(!f)return '';const k=f.key;const num=(key,label,val,min,max)=>'<div class="field"><label>'+label+'</label><input data-config="'+key+'" type="number" value="'+Number(val??0)+'" min="'+min+'" max="'+max+'"></div>';let html='';
if(['group_knockout','asean_cup'].includes(k)){html=num('groups','Groups',c.groups||2,2,500)+num('teamsPerGroup','Teams per group',c.teamsPerGroup||4,2,5000)+num('advancePerGroup','Advance per group',c.advancePerGroup||2,1,32)+'<div class="field"><label>Group match mode</label><select data-config="groupHomeAway"><option value="false" '+(!c.groupHomeAway?'selected':'')+'>Single match</option><option value="true" '+(c.groupHomeAway?'selected':'')+'>Home & away</option></select></div>'}
if(k==='champions_league'){html=num('leagueRounds','League rounds',c.leagueRounds||8,1,20)+num('leagueMatchesPerTeam','Matches per team',c.leagueMatchesPerTeam||8,2,20)+num('topDirect','Direct to Round of 16',c.topDirect||8,1,64)+num('playoffFrom','Play-off starting rank',c.playoffFrom||9,1,500)+num('playoffTo','Play-off ending rank',c.playoffTo||24,2,500)}
if(['swiss_system','swiss_to_knockout'].includes(k))html=num('rounds','Swiss rounds',c.rounds||6,1,20)+(k==='swiss_to_knockout'?num('qualifiers','Knockout qualifiers',c.qualifiers||16,2,256):'')+'<div class="field"><label>Avoid repeat opponents</label><select data-config="avoidRepeatOpponents"><option value="true" '+(c.avoidRepeatOpponents!==false?'selected':'')+'>Yes</option><option value="false" '+(c.avoidRepeatOpponents===false?'selected':'')+'>No</option></select></div>';
if(k==='round_robin'||k==='home_away_round_robin')html='<div class="notice">Round robin grows very quickly. 500 participants means 124,750 single matches or 249,500 home-and-away matches. Use a league-phase, groups, Swiss or knockout format for very large events.</div>';
if(['single_elimination','single_elimination_two_leg','best_of_series'].includes(k))html+='<div class="field"><label>Match mode</label><select data-config="matchMode">'+(f.matchModes||[]).map(x=>'<option value="'+x+'" '+(c.matchMode===x?'selected':'')+'>'+x.replaceAll('_',' ').toUpperCase()+'</option>').join('')+'</select></div>';
return html}
function collectConfig(){const c=defaultConfig(selectedFormat());document.querySelectorAll('[data-config]').forEach(el=>{let v=el.value;if(v==='true'||v==='false')v=v==='true';else if(el.type==='number')v=Number(v);c[el.dataset.config]=v});return c}
function renderedRoster(){const all=selected.players||[],map=new Map(all.map(p=>[p.slot,p])),n=Number(selected.participantCount||0),totalPages=Math.max(1,Math.ceil(n/rosterPageSize));page=Math.min(page,totalPages);const start=(page-1)*rosterPageSize,rows=[];for(let i=start;i<Math.min(start+rosterPageSize,n);i++){const p=map.get(i+1)||{slot:i+1,displayName:'',playerTag:'',seed:i+1};rows.push('<div class="row"><div class="slot">'+String(i+1).padStart(3,'0')+'</div><div><input data-slot="'+p.slot+'" data-name value="'+esc(p.displayName)+'" placeholder="Participant '+p.slot+'"></div><div><input data-slot="'+p.slot+'" data-tag value="'+esc(p.playerTag)+'" placeholder="Tag"></div><div class="seed">#'+Number(p.seed||p.slot)+'</div></div>')}return {rows:rows.join(''),totalPages}}
function matchCard(m){const can=m.player1&&m.player2&&m.status!=='completed';return '<article class="match"><div class="match-top"><span>Match '+m.matchNumber+(m.legNumber>1?' · Leg '+m.legNumber:'')+'</span><span>'+esc(m.status)+'</span></div><div class="playerline"><strong>'+esc(m.player1?.displayName||'TBD')+'</strong>'+(can?'<input class="score" id="s1-'+m.id+'" type="number" min="0" placeholder="0">':'<span class="score">'+(m.player1Score??'—')+'</span>')+'</div><div class="playerline"><strong>'+esc(m.player2?.displayName||'TBD')+'</strong>'+(can?'<input class="score" id="s2-'+m.id+'" type="number" min="0" placeholder="0">':'<span class="score">'+(m.player2Score??'—')+'</span>')+'</div>'+(can?'<button class="btn" data-result="'+m.id+'" style="width:100%;margin-top:9px">Record result</button>':'')+'</article>'}
function competition(){if(!selected?.stages?.length)return '<section class="panel" style="margin-top:16px"><div class="panel-body"><div class="meta">COMPETITION STRUCTURE</div><h3 style="font:700 20px var(--display);margin:6px 0">Not generated yet</h3><p style="color:var(--muted);font-size:11px;margin:0">Load all participants, then generate the selected format.</p></div></section>';const stages=selected.stages,s=stages[Math.min(stageIndex,stages.length-1)];return '<section class="panel" style="margin-top:16px"><div class="panel-head"><h2>Competition Structure</h2><span style="color:var(--muted);font-size:10px">'+stages.length+' stage(s)</span></div><div class="panel-body"><div class="stage-tabs">'+stages.map((x,i)=>'<button class="stage-tab '+(i===stageIndex?'active':'')+'" data-stage="'+i+'">'+esc(x.name)+'</button>').join('')+'</div>'+((s.standings||[]).length?'<table class="standings"><thead><tr><th>#</th><th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead><tbody>'+s.standings.slice(0,100).map(x=>'<tr><td>'+((x.rank||0))+'</td><td><strong>'+esc(x.player?.displayName||'TBD')+'</strong></td><td>'+x.played+'</td><td>'+x.wins+'</td><td>'+x.draws+'</td><td>'+x.losses+'</td><td>'+x.goalDifference+'</td><td><strong>'+x.points+'</strong></td></tr>').join('')+'</tbody></table>':'')+'<div style="margin-top:15px" class="match-grid">'+(s.matches||[]).map(matchCard).join('')+'</div></div></section>'}
function render(){if(!selected){app.innerHTML='<section class="panel"><div class="panel-body"><div class="notice">Create a tournament to start. Drafts stay private in Supabase until you publish.</div></div></section>';return}const f=selectedFormat(),cfg=selected.formatConfig||defaultConfig(f),r=renderedRoster(),pages=r.totalPages;
app.innerHTML='<section class="panel"><div class="panel-head"><div><h2>'+esc(selected.name||'Untitled tournament')+'</h2><span style="color:var(--muted);font-size:10px">'+esc(f?.name||selected.formatKey)+' · '+selected.players.length+' loaded / '+selected.participantCount+' slots</span></div><div class="toolbar"><button class="btn" id="save">Save draft</button><button class="btn primary" id="publish" '+(!selected.id?'disabled':'')+'>Publish</button></div></div><div class="panel-body"><div class="notice"><strong>Save</strong> writes the organizer state to Supabase. <strong>Generate</strong> creates the competition structure and locks roster/format changes. <strong>Publish</strong> writes the public snapshot to GitHub for the normal site build.</div><div class="two"><div><div class="field"><label>Tournament name</label><input id="name" value="'+esc(selected.name||'')+'" placeholder="FC Mobile Championship"></div><div class="field"><label>Format</label><select id="format">'+formats.map(x=>'<option value="'+x.key+'" '+(x.key===selected.formatKey?'selected':'')+'>'+esc(x.category+' · '+x.name)+'</option>').join('')+'</select></div></div><div><div class="field"><label>Participant count</label><input id="participantCount" type="number" min="2" max="5000" value="'+Number(selected.participantCount||8)+'"></div><div class="field"><label>Start time</label><input id="startsAt" type="datetime-local" value="'+(selected.startsAt||'')+'"></div></div></div><div class="format-meta"><strong>'+esc(f?.name||'Format')+'</strong><span>'+esc(f?.summary||'')+'</span><span class="limit">'+(f?.participantMin||2)+'–'+(f?.participantMax||5000)+' participants</span></div><div class="field"><label>Description</label><textarea id="description" rows="3">'+esc(selected.description||'')+'</textarea></div><div class="two"><div class="field"><label>Visibility</label><select id="public"><option value="false" '+(!selected.isPublic?'selected':'')+'>Private</option><option value="true" '+(selected.isPublic?'selected':'')+'>Public</option></select></div><div><label style="display:block;color:#b7c5cf;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">Format settings</label>'+configFields(f,cfg)+'</div></div><div class="field"><label>Import participants</label><div class="importer"><textarea id="importText" placeholder="One player per line: Name,Tag"></textarea><button class="btn" id="import">Import roster</button></div></div><div class="roster-tools"><strong style="font:700 13px var(--display)">Participant roster</strong><span style="color:var(--muted);font-size:10px">Use slots 1–'+selected.participantCount+' · pages of 25</span></div><div class="roster"><div class="row head"><div>Slot</div><div>Player</div><div>Tag</div><div>Seed</div></div>'+r.rows+'</div><div class="pager"><span>Page '+page+' of '+pages+' · '+selected.players.length+' loaded</span><div class="toolbar"><button class="btn" id="prev" '+(page<=1?'disabled':'')+'>Previous</button><button class="btn" id="next" '+(page>=pages?'disabled':'')+'>Next</button></div></div><div class="toolbar" style="margin-top:18px"><button class="btn primary" id="generate" '+(selected.players.length!==Number(selected.participantCount)||selected.stages?.length?'disabled':'')+'>Generate competition structure</button></div></div></section>'+competition();
bind()}
function bind(){const fsel=$('#format');fsel?.addEventListener('change',()=>{selected.formatKey=fsel.value;selected.formatConfig=defaultConfig(selectedFormat());adaptConfigToCount();render()});$('#participantCount')?.addEventListener('change',()=>{const n=Number($('#participantCount').value);if(!Number.isInteger(n)||n<2||n>5000)return notify('Participant count must be 2–5000.',true);selected.participantCount=n;adaptConfigToCount();page=1;render()});$('#prev')?.addEventListener('click',()=>{page--;render()});$('#next')?.addEventListener('click',()=>{page++;render()});$('#import')?.addEventListener('click',()=>{const lines=$('#importText').value.trim().split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const existing=[...(selected.players||[])],used=new Set(existing.map(p=>p.slot));for(const line of lines){const [name,...rest]=line.split(',');const slot=Array.from({length:selected.participantCount},(_,i)=>i+1).find(x=>!used.has(x));if(!slot||!name.trim())break;existing.push({slot,seed:slot,displayName:name.trim(),playerTag:rest.join(',').trim()});used.add(slot)}selected.players=existing.sort((a,b)=>a.slot-b.slot);page=1;render();notify('Roster imported.')});document.querySelectorAll('[data-slot]').forEach(inp=>inp.addEventListener('change',()=>{const slot=Number(inp.dataset.slot);let p=selected.players.find(x=>x.slot===slot);if(!p){p={slot,seed:slot,displayName:'',playerTag:''};selected.players.push(p)}if(inp.dataset.name)p.displayName=inp.value.trim();else p.playerTag=inp.value.trim();selected.players.sort((a,b)=>a.slot-b.slot)}));document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{stageIndex=Number(b.dataset.stage);render()});document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>recordResult(Number(b.dataset.result)));$('#save')?.addEventListener('click',save);$('#generate')?.addEventListener('click',generate);$('#publish')?.addEventListener('click',publish)}
async function save(){try{selected.name=$('#name').value.trim();selected.description=$('#description').value.trim();selected.participantCount=Number($('#participantCount').value);selected.startsAt=$('#startsAt').value||null;selected.isPublic=$('#public').value==='true';selected.formatConfig=collectConfig();adaptConfigToCount();const b=await api('/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:selected.id,name:selected.name,description:selected.description,participantCount:selected.participantCount,formatKey:selected.formatKey,formatConfig:selected.formatConfig,isPublic:selected.isPublic,startsAt:selected.startsAt,players:selected.players})});selected=b.tournament;await load(false);notify('Draft saved to Supabase.')}catch(e){notify(e.message,true)}}
async function generate(){try{const b=await api('/structure/'+selected.id,{method:'POST'});selected=b.tournament;await load(false);notify('Competition structure generated.')}catch(e){notify(e.message,true)}}
async function recordResult(id){const m=(selected.stages||[]).flatMap(s=>s.matches||[]).find(x=>Number(x.id)===id);if(!m)return;const a=Number($('#s1-'+id)?.value),b=Number($('#s2-'+id)?.value);if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0)return notify('Enter valid whole-number scores.',true);let deciding=null;if(m.tieId&&a===b){deciding=confirm('Aggregate score may need a deciding winner. Did player 1 win after extra time/penalties?')?m.player1?.id:m.player2?.id}try{const r=await api('/result/'+id,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({player1Score:a,player2Score:b,decidingWinnerPlayerId:deciding})});selected=r.tournament;await load(false);notify(r.final?'Tournament completed.':'Result recorded and progression updated.')}catch(e){notify(e.message,true)}}
async function publish(){try{const b=await api('/publish/'+selected.id,{method:'POST'});selected=b.tournament;await load(false);notify('Published to GitHub.')}catch(e){notify(e.message,true)}}
async function load(show=true){const b=await api('/list');tournaments=b.tournaments||[];if(selected)selected=tournaments.find(x=>Number(x.id)===Number(selected.id))||selected;if(!selected&&tournaments[0])selected=tournaments[0];renderTours();render()}
function renderTours(){const el=$('#tours');el.innerHTML=tournaments.length?tournaments.map(t=>'<button class="tour '+(selected?.id===t.id?'active':'')+'" data-id="'+t.id+'"><b>'+esc(t.name)+'</b><small>'+esc(t.formatKey||'single_elimination')+' · '+(t.players?.length||0)+' / '+t.participantCount+' · '+esc(t.status)+'</small></button>').join(''):'<div class="empty">No tournaments yet. Create your first competition.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=tournaments.find(t=>String(t.id)===b.dataset.id)||null;page=1;stageIndex=0;renderTours();render()})}
$('#new').onclick=()=>{const f=formats.find(x=>x.key==='single_elimination')||formats[0];selected={name:'',description:'',participantCount:8,formatKey:f.key,formatConfig:defaultConfig(f),players:[],stages:[],isPublic:false};page=1;stageIndex=0;render()};
$('#refresh').onclick=()=>load();$('#back').onclick=()=>location.href='/admin/';$('#logout').onclick=async()=>{await api('/logout',{method:'POST'}).catch(()=>{});location.href='/admin/';};
