<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#071018">
<title>Tournament operations | FCMOBILETOOLS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#071018;--panel:#0c1824;--panel2:#0a141e;--field:#08121b;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --text:#f5f8fb;--soft:#cfdae4;--muted:#8fa1b1;--faint:#5f7385;
  --cyan:#4cc9ff;--good:#47d16c;--gold:#e9c46a;--danger:#ff786f;
  --font:Inter,system-ui,sans-serif;--display:'Space Grotesk',Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;background:radial-gradient(900px 520px at 4% -10%,rgba(76,201,255,.1),transparent 62%),var(--bg);color:var(--text);font:14px/1.5 var(--font)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.shell{max-width:1480px;margin:0 auto;padding:18px clamp(14px,3vw,28px) 130px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:18px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{width:46px;height:46px;object-fit:contain;flex:none}
.brand b{display:block;font:700 19px/1.15 var(--display);letter-spacing:-.02em}
.brand span{display:block;margin-top:2px;color:var(--muted);font-size:12.5px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:9px 15px;border:1px solid var(--line2);border-radius:11px;background:rgba(255,255,255,.03);color:var(--text);font-weight:600;font-size:13.5px;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.22)}
.btn.primary{border-color:#6bdfff;background:linear-gradient(135deg,#69ddff,#2aa8e8);color:#04131c;font-weight:700}
.btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#7fe3ff,#38b3f0)}
.btn.small{min-height:34px;padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.42;cursor:not-allowed}

/* layout */
.workspace{display:grid;grid-template-columns:292px minmax(0,1fr);gap:20px;align-items:start}
.panel{border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,var(--panel),var(--panel2));box-shadow:0 24px 60px -34px #000}
.panel+.panel,.steps+.panel,.panel+.steps,.panel+details.fold,details.fold+details.fold{margin-top:16px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.panel-head h2{margin:0;font:700 18px/1.2 var(--display);letter-spacing:-.02em}
.panel-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.panel-body{padding:22px}

/* sidebar */
.side{position:sticky;top:14px}
.side .panel-head{padding:16px 16px 14px}
.side .panel-body{padding:10px}
.tours{display:grid;gap:4px}
.tour{display:grid;grid-template-columns:10px minmax(0,1fr);gap:11px;align-items:start;width:100%;padding:12px;border:1px solid transparent;border-radius:13px;background:transparent;text-align:left;cursor:pointer}
.tour:hover{background:rgba(255,255,255,.04)}
.tour.active{border-color:rgba(76,201,255,.35);background:rgba(76,201,255,.08)}
.tour .dot{width:9px;height:9px;margin-top:6px;border-radius:50%;background:var(--faint)}
.tour .dot.public{background:var(--cyan)}
.tour .dot.live{background:var(--good)}
.tour .dot.done{background:var(--gold)}
.tour b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tour small{display:block;margin-top:3px;color:var(--muted);font-size:12.5px}
.tour .mini{height:3px;margin-top:9px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.tour .mini i{display:block;height:100%;background:var(--cyan)}
.newbtn{width:100%;margin:2px 0 10px}
.empty{padding:18px 8px;color:var(--muted);font-size:13px}

/* folded sections once the structure is locked */
details.fold>summary{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 22px;cursor:pointer;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h2{margin:0;font:700 18px/1.2 var(--display);letter-spacing:-.02em}
details.fold>summary p{margin:3px 0 0;color:var(--muted);font-size:13px}
details.fold>summary::after{content:'';flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details.fold[open]>summary{border-bottom:1px solid var(--line)}
details.fold[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}

/* sticky tournament bar */
.bar{position:sticky;top:10px;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 18px 14px 22px;background:rgba(10,20,30,.9);backdrop-filter:blur(14px)}
.bar-id{min-width:0}
.bar-id h1{margin:0;font:700 clamp(20px,2.4vw,26px)/1.15 var(--display);letter-spacing:-.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-id p{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:5px 0 0;color:var(--muted);font-size:13px}
.bar-actions{display:flex;gap:8px;flex:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;border-radius:999px;border:1px solid var(--line2);font-size:14.5px;font-weight:600;color:var(--muted)}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.public{color:var(--cyan);border-color:rgba(76,201,255,.35)}
.chip.live{color:var(--good);border-color:rgba(71,209,108,.35)}
.chip.done{color:var(--gold);border-color:rgba(233,196,106,.35)}

/* steps (a real sequence) */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:16px 0 0;padding:0;list-style:none;border:1px solid var(--line);border-radius:18px;background:var(--panel2);overflow:hidden}
.steps li{display:flex;gap:11px;align-items:center;padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.steps li:first-child{border-left:0}
.steps .n{display:grid;place-items:center;flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);color:var(--faint);font:700 14.5px var(--display)}
.steps b{display:block;font-size:13.5px;font-weight:600;color:var(--muted)}
.steps small{display:block;color:var(--faint);font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps li.done .n{background:var(--good);border-color:var(--good);color:#04130a}
.steps li.done b{color:var(--soft)}
.steps li.current{background:rgba(76,201,255,.07)}
.steps li.current .n{border-color:var(--cyan);color:var(--cyan)}
.steps li.current b{color:var(--text)}
.steps li.current small{color:var(--cyan)}

/* forms */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.field{display:grid;gap:7px;margin-bottom:16px;align-content:start}
.field label,.lab{font-size:13px;font-weight:600;color:var(--soft)}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line2);border-radius:11px;background:var(--field);outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(76,201,255,.14)}
.field input:disabled,.field select:disabled,.field textarea:disabled{opacity:.55;cursor:not-allowed}
.hint{margin:-8px 0 16px;color:var(--faint);font-size:12.5px}
.format-meta{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid rgba(76,201,255,.22);border-radius:14px;background:rgba(76,201,255,.05);margin-bottom:18px}
.format-meta strong{display:block;font:700 15px var(--display)}
.format-meta span{display:block;margin-top:3px;color:var(--muted);font-size:13px}
.format-meta em{flex:none;margin-left:auto;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--soft);font-style:normal;font-size:14.5px;font-weight:600;white-space:nowrap}
.subhead{margin:6px 0 12px;font:700 14px var(--display);color:var(--soft)}
.notice{padding:12px 14px;border-left:3px solid var(--cyan);border-radius:4px 12px 12px 4px;background:rgba(76,201,255,.06);color:var(--soft);font-size:13px;margin-bottom:16px}
.notice.lock{border-color:var(--gold);background:rgba(233,196,106,.06)}

/* roster */
.importer{display:grid;grid-template-columns:1fr 180px;gap:12px;align-items:stretch}
.importer textarea{min-height:96px;resize:vertical}
.importer .btn{height:100%}
.roster-meter{display:flex;align-items:center;gap:12px;margin:20px 0 12px}
.roster-meter b{font:700 14px var(--display)}
.roster-meter .bar2{flex:1;max-width:240px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.roster-meter .bar2 i{display:block;height:100%;background:var(--cyan)}
.roster-meter span{color:var(--muted);font-size:13px}
.roster{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:54px minmax(0,1fr) 170px 64px;gap:10px;align-items:center;padding:6px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.head{padding:10px 12px;background:rgba(255,255,255,.025);color:var(--muted);font-size:12.5px;font-weight:600}
.row input{width:100%;padding:8px 9px;border:1px solid transparent;border-radius:8px;background:transparent;outline:none}
.row input:hover:not(:disabled){background:var(--field)}
.row input:focus{border-color:var(--cyan);background:var(--field)}
.row input:disabled{opacity:.7}
.slot{color:var(--faint);font:600 12.5px var(--display);font-variant-numeric:tabular-nums}
.seed{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:14px}
.pager span{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}

/* structure + results */
.gen{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.gen p{margin:0;max-width:60ch;color:var(--muted)}
.gen b{color:var(--text)}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:18px}
.stats div{display:grid;gap:3px}
.stats b{font:700 24px/1 var(--display);font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:12.5px}
.stage-tabs{display:flex;gap:6px;overflow:auto;margin-bottom:16px;padding-bottom:2px}
.stage-tab{flex:none;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer}
.stage-tab.active{background:rgba(76,201,255,.12);border-color:rgba(76,201,255,.4);color:#eafaff}
.filter{display:inline-flex;align-items:center;gap:9px;margin:0 0 16px;color:var(--soft);font-size:13px;cursor:pointer}
.filter input{width:16px;height:16px;accent-color:#4cc9ff}
.tbl-wrap{overflow-x:auto;margin-bottom:6px}
.standings{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.standings th{padding:9px 8px;color:var(--muted);font-size:12.5px;font-weight:600;text-align:center}
.standings td{padding:9px 8px;border-top:1px solid var(--line);text-align:center;font-size:13.5px}
.standings .l{text-align:left}
.standings td.l{font-weight:600}
.standings .pts{font:700 14.5px var(--display)}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:14px;margin-bottom:22px}
.tables section{padding:12px 14px 6px;border:1px solid var(--line);border-radius:14px;background:var(--field)}
.tables h4{margin:0 0 4px;font:700 14px var(--display)}
details.sec{border:1px solid var(--line);border-radius:14px;background:var(--field);margin-top:10px}
details.sec>summary{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;list-style:none;font:700 14px var(--display)}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary small{margin-left:auto;color:var(--muted);font:500 12.5px var(--font)}
details.sec>summary::after{content:'';width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details.sec[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.match-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:0 14px 14px}
.match{padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--panel);transition:border-color .15s,box-shadow .15s}
.match.done{border-color:rgba(71,209,108,.22)}
.match.dirty{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(76,201,255,.12)}
.match-top{display:flex;justify-content:space-between;color:var(--muted);font-size:14.5px;margin-bottom:6px}
.match-top em{font-style:normal;color:var(--faint)}
.match.done .match-top em{color:var(--good)}
.match.dirty .match-top em{color:var(--cyan)}
.playerline{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:10px;align-items:center;padding:5px 0}
.playerline+.playerline{border-top:1px solid var(--line)}
.playerline strong{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.playerline.tbd strong{color:var(--faint);font-weight:500;font-style:italic}
.score{width:62px;height:38px;padding:0 6px;border:1px solid var(--line2);border-radius:9px;background:var(--field);text-align:center;font:700 16px var(--display);font-variant-numeric:tabular-nums;outline:none;-moz-appearance:textfield}
.score::-webkit-inner-spin-button,.score::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.score:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(76,201,255,.14)}
span.score{display:grid;place-items:center;color:var(--faint);border-style:dashed}
.savebar{position:sticky;bottom:14px;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:18px;padding:12px 14px 12px 18px;border:1px solid var(--line2);border-radius:16px;background:rgba(10,20,30,.92);backdrop-filter:blur(14px);box-shadow:0 20px 50px -20px #000}
.savebar.dirty{border-color:rgba(76,201,255,.5)}
.savebar p{margin:0;font-size:13.5px;color:var(--muted)}
.savebar.dirty p{color:var(--text);font-weight:600}

.welcome{display:grid;justify-items:start;gap:14px;padding:clamp(28px,5vw,56px)}
.welcome h2{margin:0;font:700 clamp(26px,3.4vw,38px)/1.1 var(--display);letter-spacing:-.04em}
.welcome p{margin:0;max-width:56ch;color:var(--muted);font-size:15px}

.toast{position:fixed;right:20px;bottom:20px;z-index:100;max-width:min(440px,calc(100vw - 40px));padding:13px 16px;border:1px solid var(--line2);border-left:3px solid var(--good);border-radius:12px;background:#0b1620;box-shadow:0 20px 55px #000a;font-size:13.5px}
.toast.bad{border-left-color:var(--danger);color:#ffc2bc}
.toast[hidden]{display:none}

@media(max-width:1060px){
  .workspace{grid-template-columns:1fr}
  .side{position:static}
  .tours{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px}
  .tour{flex:none;width:250px;border-color:var(--line)}
  .steps{grid-template-columns:repeat(5,minmax(150px,1fr));overflow-x:auto}
}
@media(max-width:760px){
  .grid2,.importer{grid-template-columns:1fr}
  .bar{position:static;flex-direction:column;align-items:stretch}
  .bar-actions .btn{flex:1}
  .row{grid-template-columns:40px minmax(0,1fr) 90px}
  .row .seed{display:none}
  .top{flex-direction:column;align-items:flex-start}
  .panel-head,.panel-body{padding-left:16px;padding-right:16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>

/* ---------- derived state ---------- */

  const real=allMatches(t).filter(m=>!(m.status==='completed'&&!(m.player1&&m.player2)));

/* ---------- config ---------- */
function adaptConfigToCount(){

  if(!groupModes.includes(f.key))return;

/* ---------- roster ---------- */

/* ---------- competition ---------- */
function standingsTable(rows,caption){

  rows.map((x,i)=>'<tr><td>'+(x.rank||i+1)+'</td><td class="l">'+esc(x.player?.displayName||'TBD')+'</td><td>'+x.played+'</td><td>'+x.wins+'</td><td>'+x.draws+'</td><td>'+x.losses+'</td><td>'+x.goalDifference+'</td><td class="pts">'+x.points+'</td></tr>').join('')+'</tbody></table></div>';

  let tables='';
  if(rows.length&&s.type==='group'&&(s.groups||[]).length){
    tables='<div class="tables">'+s.groups.map(g=>'<section><h4>'+esc(g.name)+'</h4>'+standingsTable(sortRows(rows.filter(r=>r.groupId===g.id)),g.name)+'</section>').join('')+'</div>';
  }else if(rows.length&&s.type!=='knockout'){
    tables='<div class="tables" style="grid-template-columns:1fr"><section>'+standingsTable(rows.slice(0,100),s.name)+'</section></div>';
  }
  return '<section class="panel" id="results"><div class="panel-head"><div><h2>Results</h2><p>Enter scores, save them together, then publish once.</p></div></div><div class="panel-body">'+
  '<div class="stats"><div><b>'+st.done+'</b><span>Played</span></div><div><b>'+(st.total-st.done)+'</b><span>Still to play</span></div><div><b>'+st.pct+'%</b><span>Complete</span></div></div>'+
  (stages.length>1?'<div class="stage-tabs" role="tablist">'+stages.map((x,i)=>'<button class="stage-tab '+(i===stageIndex?'active':'')+'" data-stage="'+i+'" role="tab">'+esc(x.name)+'</button>').join('')+'</div>':'')+
  tables+
  '<label class="filter"><input type="checkbox" id="pendingOnly" '+(pendingOnly?'checked':'')+'> Hide matches that already have a result</label>'+
  '<div id="matchArea" class="'+(pendingOnly?'pending-only':'')+'">'+secs.map((x,i)=>'<details class="sec" '+(i===firstOpen?'open':'')+'><summary>'+esc(x.title)+'<small>'+x.done+' of '+x.real+' played</small></summary><div class="match-grid">'+x.list.map(matchCard).join('')+'</div></details>').join('')+'</div>'+
  '<div class="savebar" id="savebar"><p id="dirtyText">No unsaved result changes.</p><div class="toolbar"><button class="btn" id="saveResults" disabled>Save result changes</button><button class="btn primary" id="publishResults">Publish changes</button></div></div>'+
  '</div></section>';
}

/* ---------- steps ---------- */
function stepsHtml(){
  const f=selectedFormat(),count=Number(selected.participantCount||0),loaded=(selected.players||[]).filter(p=>p.displayName).length;
  const generated=Boolean(selected.stages?.length),st=matchStats(selected),live=tourState(selected);
  const defs=[
    {k:'Setup',d:selected.id?'Saved':'Not saved yet',done:Boolean(selected.id)},
    {k:'Roster',d:loaded+' of '+count+' players',done:count>0&&loaded===count},
    {k:'Structure',d:generated?'Generated':'Not generated',done:generated},
    {k:'Results',d:generated?st.done+' of '+st.total+' played':'After structure',done:generated&&st.total>0&&st.done===st.total},
    {k:'Public',d:live.cls?live.label:'Private',done:Boolean(live.cls)}
  ];
  const cur=defs.findIndex(x=>!x.done);
  return '<ol class="steps" aria-label="Progress">'+defs.map((x,i)=>'<li class="'+(x.done?'done':i===cur?'current':'')+'"><span class="n">'+(x.done?'&#10003;':i+1)+'</span><div><b>'+x.k+'</b><small>'+esc(x.d)+'</small></div></li>').join('')+'</ol>';
}

/* ---------- render ---------- */
function render(){
  if(!selected){
    app.innerHTML='<section class="panel welcome"><h2>'+(tournaments.length?'Pick a tournament':'Create your first tournament')+'</h2><p>'+(tournaments.length?'Choose one from the list to manage its roster, results and public page, or start a new one.':'Set the format, load your players, generate the bracket, then publish a page players can follow.')+'</p><button class="btn primary" id="newInline">New tournament</button></section>';
    $('#newInline').onclick=createNew;return;
  }
  const f=selectedFormat(),generated=Boolean(selected.stages?.length),cfg=selected.formatConfig||defaultConfig(f),r=renderedRoster(),pages=r.totalPages;
  const count=Number(selected.participantCount||0),loaded=(selected.players||[]).filter(p=>p.displayName).length,missing=Math.max(0,count-selected.players.length);
  const state=tourState(selected),cfgHtml=configFields(f,cfg);
  const barHtml='<section class="panel bar"><div class="bar-id"><h1>'+esc(selected.name||'Untitled tournament')+'</h1><p><span class="chip '+state.cls+'"><i></i>'+state.label+'</span><span>'+esc(f?.name||selected.formatKey)+', '+count+' players</span></p></div><div class="bar-actions"><button class="btn" id="save">Save details</button><button class="btn primary" id="publish" '+(!selected.id?'disabled':'')+'>Publish</button></div></section>';
  const detailsBody=
  (generated?'<div class="notice lock"><strong>Structure locked.</strong> The format, player count, format settings and roster cannot change after the bracket is generated.</div>':'')+
  '<div class="grid2"><div class="field"><label for="name">Tournament name</label><input id="name" value="'+esc(selected.name||'')+'" placeholder="FC Mobile Championship"></div><div class="field"><label for="startsAt">Kick-off</label><input id="startsAt" type="datetime-local" value="'+(selected.startsAt||'')+'"></div>'+
  '<div class="field"><label for="format">Format</label><select id="format">'+formats.map(x=>'<option value="'+x.key+'" '+(x.key===selected.formatKey?'selected':'')+'>'+esc(x.category+': '+x.name)+'</option>').join('')+'</select></div><div class="field"><label for="participantCount">Participants</label><input id="participantCount" type="number" min="2" max="5000" value="'+Number(selected.participantCount||8)+'"></div></div>'+
  '<div class="format-meta"><div><strong>'+esc(f?.name||'Format')+'</strong><span>'+esc(f?.summary||'')+'</span></div><em>'+(f?.participantMin||2)+' to '+(f?.participantMax||5000)+' players</em></div>'+
  (cfgHtml?'<p class="subhead">Format settings</p><div class="grid2">'+cfgHtml+'</div>':'')+
  '<div class="grid2"><div class="field"><label for="description">Description</label><textarea id="description" rows="3" placeholder="Shown on the public tournament page">'+esc(selected.description||'')+'</textarea></div><div class="field"><label for="public">Visibility</label><select id="public"><option value="false" '+(!selected.isPublic?'selected':'')+'>Private: only visible here</option><option value="true" '+(selected.isPublic?'selected':'')+'>Public: appears on the site after publishing</option></select></div></div>';
  const rosterBody=
  '<div class="field"><label for="importText">Import participants</label><div class="importer"><textarea id="importText" placeholder="One player per line: Name, Tag"></textarea><button class="btn" id="import">Import into empty slots</button></div></div>'+
  '<div class="roster-meter"><b>Participants</b><div class="bar2"><i style="width:'+(count?Math.min(100,Math.round(loaded/count*100)):0)+'%"></i></div><span>'+loaded+' of '+count+' named</span></div>'+
  '<div class="roster"><div class="row head"><div>Slot</div><div>Player</div><div>Tag</div><div>Seed</div></div>'+r.rows+'</div>'+
  '<div class="pager"><span>Page '+page+' of '+pages+'</span><div class="toolbar"><button class="btn small" id="prev" '+(page<=1?'disabled':'')+'>Previous</button><button class="btn small" id="next" '+(page>=pages?'disabled':'')+'>Next</button></div></div>';
  const structureBody='<div class="gen"><p>'+(missing||loaded<count?'Name all <b>'+count+'</b> participants to unlock this step. <b>'+(count-loaded)+'</b> still empty.':'All <b>'+count+'</b> participants are in. Save your details, then generate. This locks the format, player count and roster.')+'</p><button class="btn primary" id="generate" '+(selected.players.length!==count||!selected.id?'disabled':'')+'>Generate structure</button></div>'+(!selected.id?'<p class="hint" style="margin:14px 0 0">Save details first so the tournament exists before generating.</p>':'');
  const panel=(id,title,sub,body)=>'<section class="panel" id="'+id+'"><div class="panel-head"><div><h2>'+title+'</h2><p>'+sub+'</p></div></div><div class="panel-body">'+body+'</div></section>';
  const fold=(id,title,sub,body)=>'<details class="panel fold" id="'+id+'"><summary><div><h2>'+title+'</h2><p>'+sub+'</p></div></summary><div class="panel-body">'+body+'</div></details>';
  const detailsSub='Name, format and visibility.',rosterSub='Paste names or type them in by slot. Slot order is the seeding order.';
  app.innerHTML=barHtml+stepsHtml()+(generated
    ? competition()+fold('details','Details',detailsSub+' Locked.',detailsBody)+fold('roster','Roster',rosterSub,rosterBody)
    : panel('details','Details',detailsSub,detailsBody)+panel('roster','Roster',rosterSub,rosterBody)+panel('structure','Competition structure','Generating creates every fixture from the roster.',structureBody));
  if(generated){$$('#format,#participantCount,[data-config],#import,#importText,[data-slot]').forEach(el=>el.disabled=true)}
  bind();refreshDirty();
}

/* ---------- dirty tracking for results ---------- */
function dirtyMatches(){
  const map=new Map();
  $$('[data-result-match]').forEach(i=>{const id=i.dataset.resultMatch;if(!map.has(id))map.set(id,{changed:false});if(i.value.trim()!==String(i.dataset.orig??'').trim())map.get(id).changed=true});
  return [...map.entries()].filter(([,v])=>v.changed).map(([id])=>Number(id));
}
function refreshDirty(){
  const ids=new Set(dirtyMatches()),n=ids.size;
  $$('[data-match-card]').forEach(c=>c.classList.toggle('dirty',ids.has(Number(c.dataset.matchCard))));
  const bar=$('#savebar');if(!bar)return;
  bar.classList.toggle('dirty',n>0);
  $('#dirtyText').textContent=n?n+' unsaved result'+(n===1?'':'s')+'. Save before publishing.':'No unsaved result changes.';
  const b=$('#saveResults');b.disabled=n===0;b.textContent=n?'Save '+n+' result'+(n===1?'':'s'):'Save result changes';
}
window.addEventListener('beforeunload',e=>{if(dirtyMatches().length){e.preventDefault();e.returnValue=''}});

/* ---------- events ---------- */
function bind(){
  const fsel=$('#format');
  fsel?.addEventListener('change',()=>{selected.formatKey=fsel.value;selected.formatConfig=defaultConfig(selectedFormat());adaptConfigToCount();render()});
  $('#participantCount')?.addEventListener('change',()=>{const n=Number($('#participantCount').value);if(!Number.isInteger(n)||n<2||n>5000)return notify('Participant count must be 2 to 5000.',true);selected.participantCount=n;adaptConfigToCount();page=1;render()});
  $('#prev')?.addEventListener('click',()=>{page--;render()});
  $('#next')?.addEventListener('click',()=>{page++;render()});
  $('#import')?.addEventListener('click',()=>{
    const lines=$('#importText').value.trim().split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    const existing=[...(selected.players||[])],used=new Set(existing.map(p=>p.slot));
    for(const line of lines){const [name,...rest]=line.split(',');const slot=Array.from({length:selected.participantCount},(_,i)=>i+1).find(x=>!used.has(x));if(!slot||!name.trim())break;existing.push({slot,seed:slot,displayName:name.trim(),playerTag:rest.join(',').trim()});used.add(slot)}
    selected.players=existing.sort((a,b)=>a.slot-b.slot);page=1;render();notify('Roster imported.');
  });
  $$('[data-slot]').forEach(inp=>inp.addEventListener('change',()=>{
    const slot=Number(inp.dataset.slot);let p=selected.players.find(x=>x.slot===slot);
    if(!p){p={slot,seed:slot,displayName:'',playerTag:''};selected.players.push(p)}
    if(inp.dataset.name!==undefined)p.displayName=inp.value.trim();else p.playerTag=inp.value.trim();
    selected.players.sort((a,b)=>a.slot-b.slot);
  }));
  $$('[data-stage]').forEach(b=>b.onclick=()=>{if(dirtyMatches().length&&!confirm('Switching stage will discard unsaved result changes. Continue?'))return;stageIndex=Number(b.dataset.stage);render()});
  $$('.result-score').forEach(i=>i.addEventListener('input',refreshDirty));
  $('#pendingOnly')?.addEventListener('change',e=>{pendingOnly=e.target.checked;$('#matchArea').classList.toggle('pending-only',pendingOnly);$$('.match.done').forEach(c=>c.style.display=pendingOnly?'none':'')});
  if(pendingOnly)$$('.match.done').forEach(c=>c.style.display='none');
  $('#save')?.addEventListener('click',save);
  $('#generate')?.addEventListener('click',generate);
  $('#publish')?.addEventListener('click',publish);
  $('#saveResults')?.addEventListener('click',saveResults);
  $('#publishResults')?.addEventListener('click',publish);
}

async function save(){
  try{
    selected.name=$('#name').value.trim();selected.description=$('#description').value.trim();selected.participantCount=Number($('#participantCount').value);selected.startsAt=$('#startsAt').value||null;selected.isPublic=$('#public').value==='true';selected.formatConfig=collectConfig();adaptConfigToCount();
    const b=await api('/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:selected.id,name:selected.name,description:selected.description,participantCount:selected.participantCount,formatKey:selected.formatKey,formatConfig:selected.formatConfig,isPublic:selected.isPublic,startsAt:selected.startsAt,players:selected.players})});
    selected=b.tournament;await load(false);notify('Details saved.');
  }catch(e){notify(e.message,true)}
}
async function generate(){
  if(!confirm('Generate the competition structure now? The format, participant count, format settings and roster will be locked.'))return;
  try{const b=await api('/structure/'+selected.id,{method:'POST'});selected=b.tournament;stageIndex=0;await load(false);notify('Competition structure generated.')}catch(e){notify(e.message,true)}
}
async function saveResults(){
  // Only matches whose scores actually changed are sent. Unplayed matches stay untouched.
  const changed=new Set(dirtyMatches()),all=(selected.stages||[]).flatMap(x=>x.matches||[]),updates=[];
  for(const id of changed){
    const m=all.find(x=>Number(x.id)===id);if(!m)continue;
    const read=side=>{const el=document.querySelector('[data-result-match="'+id+'"][data-side="'+side+'"]');const v=el.value.trim();return v===''?null:Number(v)};
    const p1=read(1),p2=read(2);
    if(!Number.isInteger(p1)||!Number.isInteger(p2)||p1<0||p2<0)return notify('Match '+m.matchNumber+' needs two whole-number scores, or clear both boxes.',true);
    updates.push({matchId:id,player1Score:p1,player2Score:p2,expectedPlayer1Id:m.player1?.id||null,expectedPlayer2Id:m.player2?.id||null});
  }
  if(!updates.length)return notify('No result changes to save.',true);
  try{const r=await api('/results/'+selected.id,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({updates})});selected=r.tournament;await load(false);notify(updates.length+' result'+(updates.length===1?'':'s')+' saved. Publish when you are ready.')}catch(e){notify(e.message,true)}
}
let publishInFlight=false;
async function publish(){
  if(publishInFlight)return;
  if(dirtyMatches().length)return notify('Save your result changes first. Unsaved scores are not published.',true);
  publishInFlight=true;
  $$('#publish,#publishResults').forEach(b=>{b.disabled=true;b.dataset.label=b.textContent;b.textContent='Publishing…'});
  try{const b=await api('/publish/'+selected.id,{method:'POST'});selected=b.tournament;await load(false);notify(b.unchanged?'Nothing new to publish.':'Published. The public page updates after the next site build.')}
  catch(e){notify(e.message,true)}
  finally{publishInFlight=false;$$('#publish,#publishResults').forEach(b=>{b.disabled=false;b.textContent=b.dataset.label||'Publish'})}
}

async function load(show=true){
  const b=await api('/list');tournaments=b.tournaments||[];
  if(selected?.id)selected=tournaments.find(x=>Number(x.id)===Number(selected.id))||selected;
  if(!selected&&tournaments[0])selected=tournaments[0];
  renderTours();render();
}
function renderTours(){
  const el=$('#tours');
  el.innerHTML=tournaments.length?tournaments.map(t=>{const s=tourState(t),st=matchStats(t);return '<button class="tour '+(selected?.id===t.id?'active':'')+'" data-id="'+t.id+'"><span class="dot '+s.cls+'"></span><span><b>'+esc(t.name||'Untitled tournament')+'</b><small>'+s.label+', '+(t.players?.length||0)+' of '+t.participantCount+' players</small>'+(st.total?'<div class="mini"><i style="width:'+st.pct+'%"></i></div>':'')+'</span></button>'}).join(''):'<div class="empty">No tournaments yet. Create your first one.</div>';
  $$('[data-id]').forEach(b=>b.onclick=()=>{
    if(dirtyMatches().length&&!confirm('You have unsaved result changes. Discard them?'))return;
    selected=tournaments.find(t=>String(t.id)===b.dataset.id)||null;page=1;stageIndex=0;renderTours();render();
  });
}
function createNew(){
  if(dirtyMatches().length&&!confirm('You have unsaved result changes. Discard them?'))return;
  const f=formats.find(x=>x.key==='single_elimination')||formats[0];
  selected={name:'',description:'',participantCount:8,formatKey:f.key,formatConfig:defaultConfig(f),players:[],stages:[],isPublic:false};
  page=1;stageIndex=0;renderTours();render();$('#name')?.focus();
}
$('#new').onclick=createNew;
$('#refresh').onclick=()=>load();
$('#back').onclick=()=>location.href='/admin/';
$('#logout').onclick=async()=>{await api('/logout',{method:'POST'}).catch(()=>{});location.href='/admin/'};
(async()=>{try{const [f,l]=await Promise.all([api('/formats'),api('/list')]);formats=f.formats||[];tournaments=l.tournaments||[];selected=tournaments[0]||null;renderTours();render()}catch(e){notify(e.message,true)}})();
</script>
</body>
</html>
