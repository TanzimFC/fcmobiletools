<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tournament Dashboard · FCMOBILETOOLS</title><style>
:root{--bg:#071018;--surface:#0f1a26;--surface2:#162536;--line:#263b4a;--text:#f5f8fb;--muted:#8fa1b1;--cyan:#4cc9ff;--good:#47d16c;--danger:#ff786f;--font:Inter,system-ui,sans-serif;--display:'Space Grotesk',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 600px at 0 -10%,#4cc9ff12,transparent 60%),var(--bg);color:var(--text);font-family:var(--font)}button,input,textarea,select{font:inherit}.shell{max-width:1500px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:48px;height:48px;object-fit:contain}.brand b{display:block;font:700 18px var(--display)}.brand span{color:var(--muted);font-size:11px}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:11px 14px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#69ddff,#2aa8e8);border-color:#69ddff;color:#04131c;font-weight:800}.btn.danger{border-color:#633b3a;color:#ffaaa3}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}.hero h1{font:700 42px/.98 var(--display);letter-spacing:-.05em;margin:5px 0}.hero p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:330px 1fr;gap:16px}.panel{border:1px solid var(--line);background:linear-gradient(145deg,var(--surface),#0a141e);border-radius:17px;padding:18px}.panel h2{font:700 17px var(--display);margin:0 0 14px}.list{display:grid;gap:8px}.tour-row{width:100%;text-align:left;padding:13px;border:1px solid var(--line);background:#0b151f;border-radius:11px;color:var(--text);cursor:pointer}.tour-row.active{border-color:#3e8caf;box-shadow:inset 3px 0 var(--cyan)}.tour-row small,.meta{color:var(--muted);font-size:10px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{color:#b9c7d2;font-size:11px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;background:#09131d;color:var(--text);outline:0}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #4cc9ff12}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.player-row{display:grid;grid-template-columns:48px 1fr 100px;gap:8px;align-items:end}.slot{color:#718497;font:700 10px var(--font);padding:10px 0}.bracket{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}.round{display:grid;gap:10px}.round h3{font:700 10px var(--font);letter-spacing:.1em;color:#718497;text-transform:uppercase}.match{padding:11px;border:1px solid var(--line);border-radius:11px;background:#0b151f}.match b{display:flex;justify-content:space-between;padding:6px 7px}.match b+ b{border-top:1px solid var(--line)}.score{width:52px;border:1px solid var(--line);border-radius:6px;background:#071018;color:var(--text);padding:4px}.notice{padding:11px;border:1px solid #294c5d;border-radius:10px;background:#0b1b24;color:#a7dff1;font-size:11px;margin-bottom:12px}.toast{position:fixed;right:22px;bottom:22px;padding:12px 15px;border:1px solid var(--line);border-radius:11px;background:#0b151f;box-shadow:0 20px 50px #0008;z-index:20}.toast.bad{border-color:#633b3a;color:#ffaaa3}@media(max-width:900px){.grid{grid-template-columns:1fr}.players{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><img src="/assets/images/logo.png" alt="FCMOBILETOOLS"><div><b>Tournament Operations</b><span>Official competition control centre</span></div></div><div class="actions"><button class="btn" id="back">Admin Dashboard</button><button class="btn" id="logout">Sign out</button></div></header><section class="hero"><div><div class="meta">ORGANIZER WORKSPACE</div><h1>Run the tournament.</h1><p>Create, seed, publish, score and advance players without touching the public site.</p></div><button class="btn primary" id="new">Create Tournament</button></section><div id="app"></div></div><div class="toast" id="toast" hidden></div><script>
const $=s=>document.querySelector(s),app=$('#app'),toast=$('#toast');let tournaments=[],selected=null;
async function api(path,opt={}){const r=await fetch('/api/tournament'+path,{credentials:'same-origin',...opt});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'Request failed');return b}
function notify(message,bad=false){toast.textContent=message;toast.className='toast'+(bad?' bad':'');toast.hidden=false;setTimeout(()=>toast.hidden=true,3200)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function editor(t={format:8,players:[]}){const players=Array.from({length:Number(t.format)},(_,i)=>t.players?.find(p=>p.slot===i+1)||{slot:i+1,displayName:'',playerTag:''});app.innerHTML='<div class="panel"><div class="notice">Save stores the organizer state in Supabase. Publish creates the public static snapshot in GitHub. Publishing never changes bracket results.</div><div class="two"><div class="field"><label>Tournament name</label><input id="name" value="'+esc(t.name||'')+'" placeholder="FC Mobile Weekend Cup"></div><div class="field"><label>Format</label><select id="format"><option value="8" '+(t.format==8?'selected':'')+'>8 players</option><option value="16" '+(t.format==16?'selected':'')+'>16 players</option><option value="32" '+(t.format==32?'selected':'')+'>32 players</option></select></div></div><div class="field"><label>Description</label><textarea id="description" rows="3">'+esc(t.description||'')+'</textarea></div><div class="two"><div class="field"><label>Start time</label><input id="startsAt" type="datetime-local" value="'+(t.startsAt||'')+'"></div><div class="field"><label>Public status</label><select id="public"><option value="false" '+(!t.isPublic?'selected':'')+'>Private</option><option value="true" '+(t.isPublic?'selected':'')+'>Public</option></select></div></div><h2>Players & seeds</h2><div class="players" id="players">'+players.map((p,i)=>'<div class="player-row"><div class="slot">S'+(i+1)+'</div><div class="field"><label>Player</label><input data-player="'+(i+1)+'" data-name value="'+esc(p.displayName||'')+'" placeholder="Player '+(i+1)+'"></div><div class="field"><label>Tag</label><input data-player="'+(i+1)+'" data-tag value="'+esc(p.playerTag||'')+'" placeholder="@tag"></div></div>').join('')+'</div><div class="actions" style="margin-top:18px"><button class="btn primary" id="save">Save</button><button class="btn" id="publish" '+(!t.id?'disabled':'')+'>Publish</button><button class="btn" id="bracket" '+(!t.id?'disabled':'')+'>Generate bracket</button></div><div id="bracketView"></div></div>';$('#save').onclick=save;$('#publish').onclick=publish;$('#bracket').onclick=generate;$('#format').onchange=()=>{if(!confirm('Changing format will replace the unsaved player form. Continue?'))return;editor({...t,format:Number($('#format').value),players:[]})}}
async function save(){try{const format=Number($('#format').value),players=Array.from({length:format},(_,i)=>({slot:i+1,displayName:document.querySelector('[data-player="'+(i+1)+'"][data-name"]').value.trim(),playerTag:document.querySelector('[data-player="'+(i+1)+'"][data-tag"]').value.trim()}));if(players.some(p=>!p.displayName))throw Error('Every player slot needs a display name.');const body={id:selected?.id,name:$('#name').value.trim(),description:$('#description').value.trim(),format,isPublic:$('#public').value==='true',startsAt:$('#startsAt').value||null,players};const b=await api('/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});selected=b.tournament;await load();notify('Tournament saved to Supabase.')}catch(e){notify(e.message,true)}}
async function publish(){if(!selected?.id)return;try{await api('/publish/'+selected.id,{method:'POST'});notify('Published to GitHub. Build/deploy will pick up the new public snapshot.');await load()}catch(e){notify(e.message,true)}}
async function generate(){try{const b=await api('/bracket/'+selected.id,{method:'POST'});selected=b.tournament;renderBracket(b.tournament);notify('Bracket generated.')}catch(e){notify(e.message,true)}}
async function result(match){const p1=prompt('Score for '+(match.player1?.displayName||'Player 1'));if(p1===null)return;const p2=prompt('Score for '+(match.player2?.displayName||'Player 2'));if(p2===null)return;try{const b=await api('/result/'+match.id,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({player1Score:Number(p1),player2Score:Number(p2)})});selected=b.tournament;renderBracket(b.tournament);notify(b.final?'Tournament completed.':'Result saved. Winner advanced automatically.')}catch(e){notify(e.message,true)}}
function renderBracket(t){const rounds=t.rounds||[];$('#bracketView').innerHTML=rounds.map(r=>'<div class="bracket"><div class="round"><h3>'+esc(r.name)+'</h3>'+r.matches.map(m=>'<div class="match"><b><span>'+esc(m.player1?.displayName||'TBD')+'</span><span>'+(m.player1Score??'—')+'</span></b><b><span>'+esc(m.player2?.displayName||'TBD')+'</span><span>'+(m.player2Score??'—')+'</span></b>'+(m.status!=='completed'&&m.player1&&m.player2?'<button class="btn" data-result="'+m.id+'" style="margin-top:7px;width:100%">Enter result</button>':'')+'</div>').join('')+'</div></div>')).join('');document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>result(rounds.flatMap(x=>x.matches).find(m=>String(m.id)===b.dataset.result)))}
function list(){app.innerHTML='<div class="grid"><div class="panel"><h2>Tournaments</h2><div class="list">'+tournaments.map(t=>'<button class="tour-row '+(selected?.id===t.id?'active':'')+'" data-id="'+t.id+'"><strong>'+esc(t.name)+'</strong><br><small>'+t.format+' players · '+esc(t.status)+'</small></button>').join('')+'</div></div><div class="panel"><h2>Select a tournament</h2><p class="meta">Create a tournament or select one from the left.</p></div></div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=tournaments.find(t=>String(t.id)===b.dataset.id);editor(selected)})}
async function load(){const b=await api('/list');tournaments=b.tournaments||[];if(selected){selected=tournaments.find(t=>t.id===selected.id)||selected;editor(selected)}else list()}
$('#new').onclick=()=>{selected=null;editor({format:8,players:[]})};$('#back').onclick=()=>location.href='/admin/';$('#logout').onclick=async()=>{await api('/logout',{method:'POST'}).catch(()=>{});location.href='/admin/'};load().catch(e=>notify(e.message,true));
</script></body></html>
