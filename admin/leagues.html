<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Leagues Admin — FC Mobile Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/leagues/leagues.css">
<style>
.stat-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.acard{padding:20px;margin-bottom:14px;display:grid;gap:14px;animation:rise .4s var(--ease) both}
.acard .r1{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;font-size:13px}
.kv small{display:block;color:var(--mute);font-weight:600;font-size:11.5px}
.kv b{word-break:break-all}
.acts{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:720px){.stat-strip{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body class="fl">
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top"><div class="top-in"><a class="logo" href="/"><span class="mark">FC</span><span>Leagues Admin</span></a>
<nav class="tabs" style="margin-left:12px"><a href="/leagues/" class="">View site</a></nav><div class="top-r" id="who"></div></div></header>
<main class="app" id="app"></main>
<div id="toasts"></div>
<script src="/leagues/config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const C = window.FL_CONFIG || {};
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');
const sb = createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, { auth: { persistSession: true, detectSessionInUrl: true } });
const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const ago = (t) => { const s = Math.max(0, (Date.now() - new Date(t)) / 1000); if (s < 3600) return Math.max(1, Math.floor(s / 60)) + 'm ago'; if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago'; };
function toast(m, t = 'ok') { const e = document.createElement('div'); e.className = 'toast ' + t; e.textContent = m; $('#toasts').append(e); setTimeout(() => e.remove(), 3500); }
const mono = (n, u) => u ? `<img class="av lg" src="${esc(u)}" alt="">` : `<span class="av lg mono" style="--h:${hue(n)}">${esc(String(n || '?').slice(0, 2).toUpperCase())}</span>`;
let tab = 'pending', q = '';
const TABS = { pending: 'Pending', approved: 'Live', rejected: 'Rejected', suspended: 'Suspended' };

sb.auth.onAuthStateChange((ev, s) => { if (ev === 'INITIAL_SESSION' || ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') setTimeout(init, 0); });
let booting = false;
async function init() {
  if (booting) return; booting = true;
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return login();
    const { data: isAdmin, error } = await sb.rpc('fl_is_admin');
    if (error) throw error;
    $('#who').innerHTML = `<span class="hint">${esc(session.user.email || '')}</span><button class="btn ghost sm" id="so">Sign out</button>`;
    $('#so').onclick = () => sb.auth.signOut();
    if (!isAdmin) return app.innerHTML = `<div class="empty"><h3>Not authorized</h3>This account isn't an admin. Add it to <code>fl_admins</code> in Supabase.</div>`;
    await shell();
  } catch (e) { app.innerHTML = `<div class="empty"><h3>Error</h3>${esc(e.message)}</div>`; }
  finally { booting = false; }
}
function login() {
  $('#who').innerHTML = '';
  app.innerHTML = `<div class="sheet" style="margin:60px auto;position:relative"><h2>Admin sign in</h2>
  <form id="em" class="stack"><input type="email" name="email" placeholder="admin email" required><button class="btn primary">Email me a code</button></form>
  <form id="cd" class="stack" hidden><input type="text" name="code" placeholder="Code" inputmode="numeric" required><button class="btn primary">Verify</button></form></div>`;
  let email = '';
  $('#em').onsubmit = async (e) => { e.preventDefault(); email = e.target.email.value.trim(); const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: false, emailRedirectTo: location.href } }); if (error) return toast(error.message, 'err'); e.target.hidden = true; $('#cd').hidden = false; toast('Code sent'); };
  $('#cd').onsubmit = async (e) => { e.preventDefault(); const { error } = await sb.auth.verifyOtp({ email, token: e.target.code.value.trim(), type: 'email' }); if (error) toast(error.message, 'err'); };
}
const count = async (t, f) => { let r = sb.from(t).select('*', { count: 'exact', head: true }); if (f) r = f(r); const { count: c } = await r; return c || 0; };
async function shell() {
  app.innerHTML = `<section class="wrap"><div class="head"><div><h1>Leagues <em>control</em></h1><p class="mute">Approve owners, keep the directory clean.</p></div></div>
  <div class="stat-strip" id="st"></div>
  <div class="filters glass" style="position:static;grid-template-columns:1fr auto"><label class="search"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input type="text" id="q" placeholder="Search league name, tag or Discord"></label><button class="btn ghost" id="rf">Refresh</button></div>
  <div class="toggles" id="tabs"></div><div id="list"></div></section>`;
  let t; $('#q').oninput = (e) => { clearTimeout(t); t = setTimeout(() => { q = e.target.value.trim().toLowerCase(); list(); }, 200); };
  $('#rf').onclick = () => { stats(); list(); };
  await Promise.all([stats(), list()]);
}
async function stats() {
  const day = new Date(Date.now() - 864e5).toISOString();
  const [pl, pe, live, mem, ko] = await Promise.all([
    count('fl_profiles'), count('fl_leagues', (r) => r.eq('status', 'pending')), count('fl_leagues', (r) => r.eq('status', 'approved')),
    count('fl_members'), count('fl_kickoffs', (r) => r.gte('at', day))]);
  $('#st').innerHTML = [['Players', pl], ['Pending', pe], ['Live leagues', live], ['Site members', mem], ['Kickoffs 24h', ko]]
    .map(([k, v]) => `<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('');
  const tabs = $('#tabs'); tabs.innerHTML = Object.entries(TABS).map(([k, v]) => `<button class="tgl" data-t="${k}" aria-pressed="${tab === k}">${v}${k === 'pending' && pe ? ` · ${pe}` : ''}</button>`).join('');
  $$('.tgl', tabs).forEach((b) => b.onclick = () => { tab = b.dataset.t; $$('.tgl', tabs).forEach((x) => x.setAttribute('aria-pressed', x === b)); list(); });
}
async function list() {
  const box = $('#list'); box.innerHTML = '<p class="mute">Loading…</p>';
  const { data, error } = await sb.from('fl_leagues').select('*').eq('status', tab).order('created_at', { ascending: tab === 'pending' }).limit(200);
  if (error) { box.innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  const ids = [...new Set(data.map((l) => l.owner_id))]; const owners = {};
  if (ids.length) { const r = await sb.from('fl_profiles').select('user_id,ign,uid,discord,ovr,avatar_url').in('user_id', ids); (r.data || []).forEach((p) => (owners[p.user_id] = p)); }
  const rows = data.filter((l) => !q || [l.name, l.tag, l.discord_url, owners[l.owner_id]?.ign, owners[l.owner_id]?.discord].some((v) => String(v || '').toLowerCase().includes(q)));
  if (!rows.length) { box.innerHTML = `<div class="empty"><h3>Nothing here</h3>No ${TABS[tab].toLowerCase()} leagues${q ? ' match your search' : ''}.</div>`; return; }
  box.innerHTML = rows.map((l) => { const o = owners[l.owner_id] || {};
    return `<article class="glass acard"><div class="r1">${mono(l.name, l.logo_url)}<div class="grow"><b style="font-size:17px">${esc(l.name)}</b> ${l.tag ? `<span class="tag">${esc(l.tag)}</span>` : ''}<div class="hint">${esc(l.region)} · ${esc(l.language)} · submitted ${ago(l.created_at)} · ${l.kickoff_count} kickoffs</div></div><span class="pill ${l.status === 'approved' ? 'ok' : l.status === 'pending' ? 'warn' : 'bad'}">${l.status}</span></div>
    <div class="kv"><div><small>Owner</small><b>${esc(o.ign || '—')} · ${o.ovr || '?'} OVR</b></div><div><small>Owner UID</small><b>${esc(o.uid || '—')}</b></div><div><small>Owner Discord</small><b>${esc(o.discord || '—')}</b></div>
    <div><small>League Discord</small><b><a href="${esc(l.discord_url)}" target="_blank" rel="noopener noreferrer" style="color:var(--acc2)">${esc(l.discord_url)}</a></b></div>
    <div><small>Capacity / Min OVR</small><b>${l.members_in_game}/${l.capacity} · ${l.min_ovr || 'any'}</b></div><div><small>Tournaments</small><b>${l.tourneys_per_week}/wk · ${l.tourney_min_size}v${l.tourney_min_size}–${l.tourney_max_size}v${l.tourney_max_size}</b></div></div>
    ${l.description ? `<p style="font-size:14px;color:#c9d2e0">${esc(l.description)}</p>` : ''}${l.reject_reason ? `<p class="hint">Reason: ${esc(l.reject_reason)}</p>` : ''}
    ${l.banner_url ? `<img src="${esc(l.banner_url)}" alt="" style="width:100%;max-height:140px;object-fit:cover;border-radius:12px">` : ''}
    <div class="acts">${l.status !== 'approved' ? `<button class="btn primary sm" data-a="approved" data-id="${l.id}">Approve</button>` : ''}${l.status === 'pending' || l.status === 'approved' ? `<button class="btn sm" data-a="rejected" data-id="${l.id}">Reject</button>` : ''}${l.status === 'approved' ? `<button class="btn sm" data-a="suspended" data-id="${l.id}">Suspend</button>` : ''}<button class="btn danger sm" data-a="delete" data-id="${l.id}">Delete</button></div></article>`; }).join('');
  $$('[data-a]', box).forEach((b) => b.onclick = () => act(b));
}
async function act(b) {
  const a = b.dataset.a, id = b.dataset.id; let reason = null;
  if (a === 'rejected' || a === 'suspended') { reason = prompt(`Reason shown to the owner (${a}):`, ''); if (reason === null) return; }
  if (a === 'delete' && !confirm('Delete this league permanently?')) return;
  b.disabled = true;
  const { error } = a === 'delete' ? await sb.from('fl_leagues').delete().eq('id', id) : await sb.rpc('fl_admin_review', { p_league: id, p_status: a, p_reason: reason });
  if (error) { toast(error.message, 'err'); b.disabled = false; return; }
  toast(a === 'approved' ? 'League approved — it is live' : 'Done'); await Promise.all([stats(), list()]);
}
</script>
</body>
</html>
