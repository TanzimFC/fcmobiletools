<!--premium-admin:start--><style id="premium-admin-ui">

<body class="fl">
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top"><div class="top-in"><a class="logo" href="/"><span class="mark">FC</span><span>Leagues Admin</span></a>
<nav class="tabs" style="margin-left:12px"><a href="/leagues/" class="">View site</a></nav><div class="top-r" id="who"></div></div></header>
<main class="app" id="app"></main>
<div id="toasts"></div>
<script type="module">
const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
const app = $('#app');
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[char]));
const TABS = {
  unreviewed: 'Needs review',
  pending: 'Pending',
  approved: 'Live',
  rejected: 'Rejected',
  paused: 'Suspended',
  removed: 'Removed',
  reports: 'Reports',
  appeals: 'Suspension appeals'
};
let tab = 'unreviewed';
let query = '';
let loading = false;

async function api(path, options = {}) {
  const headers = new Headers(options.headers || {});
  if (options.body && !(options.body instanceof FormData) && !headers.has('content-type')) {
    headers.set('content-type', 'application/json');
  }
  const response = await fetch(path, {
    ...options,
    headers,
    credentials: 'same-origin',
    cache: 'no-store'
  });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    const error = new Error(body.error || 'The request could not be completed.');
    error.status = response.status;
    throw error;
  }
  return body;
}

function toast(message, type = 'ok') {
  const node = document.createElement('div');
  node.className = 'toast ' + type;
  node.textContent = message;
  $('#toasts').append(node);
  setTimeout(() => node.remove(), 3500);
}

function ago(value) {
  const timestamp = Date.parse(value || '');
  if (!Number.isFinite(timestamp)) return 'date unavailable';
  const seconds = Math.max(0, (Date.now() - timestamp) / 1000);
  if (seconds < 3600) return Math.max(1, Math.floor(seconds / 60)) + 'm ago';
  if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ago';
  if (seconds < 86400 * 30) return Math.floor(seconds / 86400) + 'd ago';
  return new Date(timestamp).toLocaleDateString();
}

function mono(name, imageUrl) {
  if (imageUrl) {
    return '<img class="av lg" src="' + esc(imageUrl) + '" alt="" loading="lazy" referrerpolicy="no-referrer">';
  }
  let hue = 0;
  for (const char of String(name || '?')) hue = (hue * 31 + char.charCodeAt(0)) % 360;
  const initials = String(name || '?').trim().split(/\s+/).slice(0, 2).map((part) => part[0] || '').join('').toUpperCase() || '?';
  return '<span class="av lg mono" style="--h:' + hue + '">' + esc(initials) + '</span>';
}

function showLoginRequired(message = 'Sign in through the main admin workspace to manage league listings.') {
  $('#who').innerHTML = '';
  app.innerHTML = '<div class="empty"><h3>Admin session required</h3>' + esc(message) +
    '</div><div style="margin-top:14px;text-align:center"><a class="btn primary" href="/admin/">Return to admin login</a></div>';
}

function showError(message) {
  app.innerHTML = '<div class="empty"><h3>Could not load league controls</h3>' + esc(message) +
    '</div><div style="margin-top:14px;text-align:center"><button class="btn ghost" id="retry">Try again</button></div>';
  $('#retry')?.addEventListener('click', init);
}

function statCard(label, value) {
  return '<div class="stat"><small>' + esc(label) + '</small><b>' + esc(Number(value || 0).toLocaleString()) + '</b></div>';
}

async function stats() {
  const data = await api('/api/admin/leagues/stats');
  const values = data.stats || {};
  $('#st').innerHTML = [
    statCard('Total listings', values.total),
    statCard('Needs review', values.unreviewed ?? values.pending),
    statCard('Live leagues', values.approved),
    statCard('Open reports', values.openReports),
    statCard('Players looking', values.playersLooking)
  ].join('');
  const tabs = $('#tabs');
  tabs.innerHTML = Object.entries(TABS).map(([key, label]) =>
    '<button class="tgl" data-t="' + esc(key) + '" aria-pressed="' + String(tab === key) + '">' +
    esc(label) + ((key === 'unreviewed' ? Number(values.unreviewed) : key === 'reports' ? Number(values.openReports) : key === 'appeals' ? Number(values.openAppeals) : 0) ? ' · ' + esc(key === 'unreviewed' ? values.unreviewed : key === 'reports' ? values.openReports : values.openAppeals) : '') + '</button>'
  ).join('');
  $$('[data-t]', tabs).forEach((button) => {
    button.addEventListener('click', () => {
      tab = button.dataset.t;
      $$('[data-t]', tabs).forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      list();
    });
  });
}

function reportCard(report) {
  const labels = {
    fake_or_misleading: 'Fake or misleading listing',
    inactive: 'Inactive league',
    inappropriate: 'Inappropriate content',
    spam: 'Spam',
    other: 'Other'
  };
  return '<article class="glass acard"><div class="r1">' + mono(report.listingName, report.logoUrl) +
    '<div class="grow"><b style="font-size:17px">' + esc(report.listingName || 'Unknown league') + '</b>' +
    '<div class="hint">Reported by ' + esc(report.reporter || 'Member') + ' · ' + esc(ago(report.createdAt)) + '</div></div>' +
    '<span class="pill warn">' + esc(report.status || 'open') + '</span></div>' +
    '<div class="kv"><div><small>Reason</small><b>' + esc(labels[report.reason] || report.reason || 'Other') + '</b></div>' +
    '<div><small>Current listing status</small><b>' + esc(TABS[report.listingStatus] || report.listingStatus || 'Unknown') + '</b></div></div>' +
    (report.details ? '<p style="white-space:pre-wrap;color:#c9d2e0">' + esc(report.details) + '</p>' : '') +
    '<div class="acts">' +
      '<a class="btn sm" href="/leagues/' + encodeURIComponent(report.slug || '') + '/" target="_blank" rel="noopener noreferrer">View league</a>' +
      (report.status === 'open' ? '<button class="btn primary sm" data-report-action="resolved" data-id="' + esc(report.id) + '">Resolve</button><button class="btn danger sm" data-report-action="dismissed" data-id="' + esc(report.id) + '">Dismiss report</button>' : '') +
    '</div></article>';
}

function appealCard(appeal) {
  return '<article class="glass acard"><div class="r1">' + mono(appeal.listingName, appeal.logoUrl) +
    '<div class="grow"><b style="font-size:17px">' + esc(appeal.listingName || 'Unknown league') + '</b>' +
    '<div class="hint">Owner: ' + esc(appeal.owner || 'Unknown owner') + ' · ' + esc(appeal.regionServer || 'Region not set') +
    ' · submitted ' + esc(ago(appeal.createdAt)) + '</div></div><span class="pill ' + (appeal.status === 'open' ? 'warn' : appeal.status === 'approved' ? 'ok' : 'bad') + '">' + esc(appeal.status) + '</span></div>' +
    '<div class="kv"><div><small>Current listing status</small><b>' + esc(TABS[appeal.listingStatus] || appeal.listingStatus || 'Unknown') + '</b></div>' +
    '<div><small>Appeal ID</small><b>' + esc(appeal.id) + '</b></div></div>' +
    '<p style="white-space:pre-wrap;color:#d8e6f0">' + esc(appeal.reason || '') + '</p>' +
    (appeal.reviewNote ? '<p class="hint">Review note: ' + esc(appeal.reviewNote) + '</p>' : '') +
    '<div class="acts">' +
      '<a class="btn sm" href="/leagues/' + encodeURIComponent(appeal.slug || '') + '/" target="_blank" rel="noopener noreferrer">View league</a>' +
      (appeal.status === 'open' ? '<button class="btn primary sm" data-appeal-action="approved" data-id="' + esc(appeal.id) + '">Restore league</button><button class="btn danger sm" data-appeal-action="denied" data-id="' + esc(appeal.id) + '">Keep suspended</button>' : '') +
    '</div></article>';
}

function safeDiscord(value) {
  const url = String(value || '');
  return /^https:\/\/(www\.)?(discord\.gg|discord\.com\/invite)\/[A-Za-z0-9-]{2,40}\/?$/i.test(url) ? url : '';
}

function listingCard(listing) {
  const owner = listing.owner || {};
  const player = listing.ownerGameProfile || {};
  const link = safeDiscord(listing.discordInviteUrl);
  const statusClass = listing.status === 'approved' ? 'ok' : listing.status === 'pending' ? 'warn' : 'bad';
  const language = Array.isArray(listing.preferredLanguages) && listing.preferredLanguages.length
    ? listing.preferredLanguages.join(', ') : 'Not specified';
  const sizes = Array.isArray(listing.tournamentSizes) && listing.tournamentSizes.length
    ? listing.tournamentSizes.join(', ') : 'Not specified';
  const reportText = Number(listing.openReports || 0) + ' open report' + (Number(listing.openReports || 0) === 1 ? '' : 's');
  let actions = '';
  if ((listing.status !== 'approved' || !listing.reviewedAt) && listing.status !== 'removed') {
    actions += '<button class="btn primary sm" data-a="approved" data-id="' + esc(listing.id) + '">' + (listing.status === 'approved' ? 'Mark reviewed' : 'Approve') + '</button>';
  }
  if (listing.status === 'pending' || listing.status === 'approved') {
    actions += '<button class="btn sm" data-a="rejected" data-id="' + esc(listing.id) + '">Reject</button>';
  }
  if (listing.status === 'approved') {
    actions += '<button class="btn sm" data-a="paused" data-id="' + esc(listing.id) + '">Suspend</button>';
  }
  if (listing.status !== 'removed') {
    actions += '<button class="btn danger sm" data-a="removed" data-id="' + esc(listing.id) + '">Remove</button>';
  }
  if (listing.status !== 'removed') {
    actions += '<button class="btn sm" data-f="verified" data-id="' + esc(listing.id) + '" data-value="' + String(!listing.verified) + '">' + (listing.verified ? 'Unverify' : 'Verify club') + '</button>';
    actions += '<button class="btn sm" data-f="featured" data-id="' + esc(listing.id) + '" data-value="' + String(!listing.featured) + '">' + (listing.featured ? 'Unfeature' : 'Feature 7 days') + '</button>';
    actions += '<button class="btn sm" data-note="' + esc(listing.id) + '" data-current-note="' + esc(listing.adminNote || '') + '">Internal note</button>';
  }
  return '<article class="glass acard">' +
    '<div class="r1">' + mono(listing.name, listing.logoUrl) +
      '<div class="grow"><b style="font-size:17px">' + esc(listing.name || 'Untitled league') + '</b>' +
      (listing.tagline ? '<div class="hint">' + esc(listing.tagline) + '</div>' : '') +
      '<div class="hint">' + esc(listing.regionServer || 'Region not set') + ' · ' + esc(language) +
      ' · submitted ' + esc(ago(listing.createdAt)) + '</div></div>' +
      '<span class="pill ' + statusClass + '">' + esc(TABS[listing.status] || listing.status || 'Unknown') + '</span></div>' +
    '<div class="kv">' +
      '<div><small>Account owner</small><b>' + esc(owner.displayName || owner.username || '—') + '</b></div>' +
      '<div><small>In-game name / OVR</small><b>' + esc(player.inGameUsername || '—') + ' · ' + esc(player.ovr ? player.ovr + ' OVR' : 'OVR not set') + '</b></div>' +
      '<div><small>Owner UID</small><b>' + esc(player.fcMobileUid || '—') + '</b></div>' +
      '<div><small>Owner Discord</small><b>' + esc(player.discordHandle || '—') + '</b></div>' +
      '<div><small>League Discord</small><b>' + (link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer" style="color:var(--acc2)">' + esc(link) + '</a>' : '—') + '</b></div>' +
      '<div><small>Open spots / Minimum OVR</small><b>' + esc(listing.openSpots ?? 0) + ' spots · ' + esc(listing.minOvr ? listing.minOvr + '+ OVR' : 'any OVR') + '</b></div>' +
      '<div><small>Tournaments</small><b>' + esc(listing.tournamentFrequency || 'Schedule varies') + ' · ' + esc(sizes) + '</b></div>' +
      '<div><small>Listing flags</small><b>' + (listing.verified ? 'Verified club' : 'Not verified') + ' · ' + (listing.reviewedAt ? 'Reviewed' : 'Not reviewed') + (listing.isSample ? ' · SAMPLE' : '') + (listing.division ? ' · ' + esc(listing.division) : '') + '</b></div>' +
      '<div><small>Moderation</small><b>' + esc(reportText) + '</b></div>' +
    '</div>' +
    (listing.description ? '<p style="font-size:14px;color:#c9d2e0">' + esc(listing.description) + '</p>' : '') +
    (listing.moderationNote ? '<p class="hint">Latest moderation note: ' + esc(listing.moderationNote) + '</p>' : '') +
    '<div class="acts">' + actions + '</div></article>';
}

async function list() {
  const box = $('#list');
  if (!box) return;
  box.innerHTML = '<p class="mute">Loading…</p>';
  try {
    const needle = query.trim().toLowerCase();
    if (tab === 'reports' || tab === 'appeals') {
      const data = tab === 'reports'
        ? await api('/api/admin/leagues/reports?status=open')
        : await api('/api/admin/leagues/appeals?status=open');
      const all = tab === 'reports' ? (data.reports || []) : (data.appeals || []);
      const rows = all.filter((row) => [
        row.listingName, row.reporter, row.owner, row.reason, row.details, row.reviewNote, row.regionServer, row.status
      ].some(value => String(value || '').toLowerCase().includes(needle)));
      if (!rows.length) {
        box.innerHTML = '<div class="empty"><h3>Nothing here</h3>No ' + esc(tab === 'reports' ? 'reports' : 'suspension appeals') + (needle ? ' match your search' : '') + '.</div>';
        return;
      }
      box.innerHTML = rows.map(tab === 'reports' ? reportCard : appealCard).join('');
      $$('[data-report-action]', box).forEach(button => button.addEventListener('click', () => reportAct(button)));
      $$('[data-appeal-action]', box).forEach(button => button.addEventListener('click', () => appealAct(button)));
      return;
    }
    const data = await api('/api/admin/leagues?status=' + encodeURIComponent(tab));
    const all = Array.isArray(data.listings) ? data.listings : [];
    const rows = all.filter((listing) => {
      if (!needle) return true;
      const player = listing.ownerGameProfile || {};
      const owner = listing.owner || {};
      return [
        listing.name, listing.tagline, listing.description, listing.slug, listing.regionServer,
        (listing.preferredLanguages || []).join(' '), owner.displayName, owner.username,
        player.inGameUsername, player.fcMobileUid, player.discordHandle
      ].some((value) => String(value || '').toLowerCase().includes(needle));
    });
    if (!rows.length) {
      box.innerHTML = '<div class="empty"><h3>Nothing here</h3>No ' + esc((TABS[tab] || tab).toLowerCase()) +
        ' leagues' + (needle ? ' match your search' : '') + '.</div>';
      return;
    }
    box.innerHTML = rows.map(listingCard).join('');
    $('[data-a]', box).forEach((button) => button.addEventListener('click', () => act(button)));
    $('[data-f]', box).forEach((button) => button.addEventListener('click', () => flagAct(button)));
    $('[data-note]', box).forEach((button) => button.addEventListener('click', () => internalNoteAct(button)));
  } catch (error) {
    box.innerHTML = '<div class="empty"><h3>Could not load listings</h3>' + esc(error.message) + '</div>';
  }
}

async function flagAct(button) {
  const id = button.dataset.id, flag = button.dataset.f, value = button.dataset.value === 'true';
  button.disabled = true;
  try {
    await api('/api/admin/leagues/' + encodeURIComponent(id) + '/flags', {
      method: 'POST', body: JSON.stringify({ [flag]: value })
    });
    toast(flag === 'verified' ? (value ? 'League verified.' : 'Verification removed.') : (value ? 'League featured.' : 'Feature removed.'));
    await Promise.all([stats(), list()]);
  } catch (error) {
    toast(error.message || 'Moderation flag could not be changed.', 'err');
    button.disabled = false;
  }
}

async function internalNoteAct(button) {
  const id = button.dataset.note;
  const note = prompt('Internal moderation note (visible to admins only):', button.dataset.currentNote || '');
  if (note === null) return;
  button.disabled = true;
  try {
    await api('/api/admin/leagues/' + encodeURIComponent(id) + '/flags', {
      method: 'POST', body: JSON.stringify({ adminNote: note })
    });
    toast('Internal note saved.');
    await Promise.all([stats(), list()]);
  } catch (error) {
    toast(error.message || 'Internal note could not be saved.', 'err');
    button.disabled = false;
  }
}

async function reportAct(button) {
  const id = button.dataset.id, status = button.dataset.reportAction;
  const note = prompt(status === 'resolved' ? 'Resolution note (optional):' : 'Why is this report being dismissed?');
  if (note === null) return;
  if (status === 'dismissed' && !note.trim()) { toast('Add a short reason to dismiss a report.', 'err'); return; }
  button.disabled = true;
  try {
    await api('/api/admin/leagues/reports/' + encodeURIComponent(id) + '/resolve', {
      method: 'POST', body: JSON.stringify({ status, note })
    });
    toast(status === 'resolved' ? 'Report resolved.' : 'Report dismissed.');
    await Promise.all([stats(), list()]);
  } catch (error) {
    toast(error.message || 'Report could not be updated.', 'err');
    button.disabled = false;
  }
}

async function appealAct(button) {
  const id = button.dataset.id, status = button.dataset.appealAction;
  const note = prompt(status === 'approved' ? 'Optional note for the owner:' : 'Reason the suspension will remain:');
  if (note === null) return;
  if (status === 'denied' && !note.trim()) { toast('Add a reason before keeping the suspension.', 'err'); return; }
  button.disabled = true;
  try {
    await api('/api/admin/leagues/appeals/' + encodeURIComponent(id) + '/resolve', {
      method: 'POST', body: JSON.stringify({ status, note })
    });
    toast(status === 'approved' ? 'League restored from appeal.' : 'Appeal declined.');
    await Promise.all([stats(), list()]);
  } catch (error) {
    toast(error.message || 'Appeal could not be resolved.', 'err');
    button.disabled = false;
  }
}

async function act(button) {
  const action = button.dataset.a;
  const id = button.dataset.id;
  let note = '';
  if (action !== 'approved') {
    note = prompt('Add a moderation note for the owner:', '');
    if (note === null) return;
    if (!note.trim()) {
      toast('Enter a short reason before saving this review.', 'err');
      return;
    }
  }
  if (action === 'removed' && !confirm('Remove this listing from the public directory?')) return;
  button.disabled = true;
  try {
    await api('/api/admin/leagues/' + encodeURIComponent(id) + '/review', {
      method: 'POST',
      body: JSON.stringify({ status: action, note })
    });
    toast(action === 'approved' ? 'League approved — it is live' : action === 'removed' ? 'Listing removed' : 'Review saved');
    await Promise.all([stats(), list()]);
  } catch (error) {
    toast(error.message || 'The review could not be saved.', 'err');
    button.disabled = false;
  }
}

async function shell() {
  app.innerHTML = '<section class="wrap">' +
    '<div class="head"><div><h1>Leagues <em>control</em></h1><p class="mute">Approve owners, keep the directory clean.</p></div></div>' +
    '<div class="stat-strip" id="st"></div>' +
    '<div class="filters glass" style="position:static;grid-template-columns:1fr auto">' +
      '<label class="search"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>' +
      '<input type="text" id="q" placeholder="Search league, owner, UID or Discord"></label>' +
      '<button class="btn ghost" id="rf" type="button">Refresh</button></div>' +
    '<div class="toggles" id="tabs"></div><div id="list"></div></section>';
  let timer;
  $('#q').addEventListener('input', (event) => {
    clearTimeout(timer);
    query = event.target.value;
    timer = setTimeout(list, 180);
  });
  $('#rf').addEventListener('click', refresh);
  await Promise.all([stats(), list()]);
}

async function refresh() {
  await Promise.all([stats(), list()]);
}

async function init() {
  if (loading) return;
  loading = true;
  try {
    const identity = await api('/api/admin/me');
    $('#who').innerHTML = '<span class="hint">' + esc(identity.displayName || identity.username || 'Admin') +
      '</span><button class="btn ghost sm" id="so" type="button">Sign out</button>';
    $('#so').addEventListener('click', async () => {
      try { await fetch('/api/admin/logout', { method: 'POST', credentials: 'same-origin' }); } finally { location.replace('/admin/'); }
    });
    await shell();
  } catch (error) {
    if (error.status === 401) showLoginRequired();
    else showError(error.message || 'Please try again.');
  } finally {
    loading = false;
  }
}

init();
</script>
</body>
</html>
