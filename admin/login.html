<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>FC Mobile Tools Admin</title><style>body{margin:0;background:#0b1020;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}form{width:min(380px,90vw);padding:28px;background:#151c30;border:1px solid #2a3550;border-radius:16px}input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:8px;border-radius:9px;border:1px solid #394764;background:#0d1426;color:#fff}button{margin-top:18px;background:#fff;color:#111;font-weight:700;cursor:pointer}.error{color:#ff8585;min-height:20px;margin-top:10px}</style></head><body><form id="login"><h1>Admin sign in</h1><label>Username<input name="username" autocomplete="username" required></label><br><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button id="submit">Sign in</button><div class="error" id="error"></div></form><script>login.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';submit.disabled=true;try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(Object.fromEntries(new FormData(login)))});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'Sign-in failed.');location.replace('/admin/')}catch(x){error.textContent=x.message;submit.disabled=false}})</script></body></html>
