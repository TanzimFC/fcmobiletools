<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>FCMobiletools · Articles</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#071018;--p1:#0d1a25;--p2:#122333;--line:#ffffff14;--line2:#29414e;--tx:#eef5f8;--mu:#8ea3b0;--ac:#4cc9ff;--ac2:#9fe6ff;--ok:#47d16c;--bad:#ff827c;--warn:#ffbd59;--sans:'Inter',system-ui,sans-serif;--disp:'Space Grotesk',system-ui,sans-serif;--read:'Newsreader',Georgia,serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;border:1px solid var(--line2);border-radius:10px;background:var(--p1);font-weight:600;font-size:13px;transition:.15s}.btn:hover{border-color:var(--ac)}.btn:disabled{opacity:.5;cursor:wait}.btn.pri{background:var(--ac);border-color:var(--ac);color:#04121a}.btn.pri:hover{background:var(--ac2)}.btn.dng{color:var(--bad)}
.inp,select.inp,textarea.inp{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:9px;background:#08131b;outline:0}.inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px #4cc9ff1a}textarea.inp{resize:vertical;min-height:70px}
/* shell (list views) */
.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:14px;background:#081119}.brand-logo img{height:38px;max-width:150px;object-fit:contain}.nav{display:grid;gap:3px;overflow:auto}.nav a{display:flex;justify-content:space-between;padding:9px 12px;border-radius:9px;color:var(--mu);text-decoration:none;font-weight:600;font-size:13px}.nav a:hover{background:#ffffff08;color:var(--tx)}.nav a.active{background:#4cc9ff1a;color:var(--tx);box-shadow:inset 3px 0 var(--ac)}.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#ff6b61;color:#190606;font:700 10px/18px var(--sans);text-align:center}.badge[hidden]{display:none}.side .btn{margin-top:auto}
.main{min-width:0;padding:30px 36px 80px;max-width:1300px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}.head h1{margin:0;font:700 34px/1.05 var(--disp);letter-spacing:-.04em}.head p{margin:6px 0 0;color:var(--mu)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tab{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--mu);font-weight:600;font-size:13px}.tab b{margin-left:6px;color:var(--tx)}.tab.on{background:#4cc9ff1a;border-color:#4cc9ff55;color:var(--tx)}
.lib{border:1px solid var(--line);border-radius:16px;background:var(--p1);overflow:hidden}.libbar{padding:12px;border-bottom:1px solid var(--line)}.row{display:grid;grid-template-columns:72px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}.row:hover{background:#ffffff06}.row:last-child{border-bottom:0}.thumb{width:72px;height:48px;border-radius:8px;background:var(--p2);overflow:hidden;display:grid;place-items:center;color:var(--mu);font-weight:700}.thumb img{width:100%;height:100%;object-fit:cover}.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:var(--mu)}.st{padding:3px 9px;border-radius:99px;border:1px solid var(--line2);font-size:11px;font-weight:700;text-transform:capitalize;color:var(--mu)}.st.published{color:var(--ok);border-color:#47d16c55}.st.review{color:var(--warn);border-color:#ffbd5955}.acts{display:flex;gap:6px}.empty{padding:40px;text-align:center;color:var(--mu)}
.inbox-item{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--p1);margin-bottom:8px}.inbox-item.pend{border-color:#ff6b6155}.inbox-item small{color:var(--mu);display:block;margin-top:3px}
.err{padding:16px;border:1px solid #613a36;background:#211412;border-radius:12px;color:#ffb8ae}
/* modal + toast */
.modal{position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:20px;background:#02080dcc}.modal.open{display:grid}.dlg{width:min(860px,100%);max-height:90vh;overflow:auto;background:var(--p1);border:1px solid var(--line2);border-radius:18px}.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}.dlg-h h3{margin:0;font:700 17px var(--disp)}.dlg-b{padding:20px}.x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:transparent;font-size:18px}
.toasts{position:fixed;right:18px;bottom:18px;z-index:300;display:grid;gap:8px}.toast{padding:11px 15px;border:1px solid #4cc9ff33;border-left:3px solid var(--ok);border-radius:10px;background:#0a1721f5;font-weight:600;font-size:13px;box-shadow:0 14px 40px #0008}.toast.error{border-left-color:var(--bad)}.toast.info{border-left-color:var(--ac)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}.pick button{padding:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#08131b}.pick img{width:100%;height:100px;object-fit:cover;display:block}
/* ===== EDITOR ===== */
body.editing .side{display:none}body.editing .layout{display:block}body.editing .main{max-width:none;padding:0}
.ed{min-height:100vh;display:flex;flex-direction:column}
.ed-top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;background:#071018f2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.ed-top .sp{flex:1}.ed-state{display:flex;align-items:center;gap:7px;color:var(--mu);font-size:12px;font-weight:500;white-space:nowrap}.ed-state i{width:7px;height:7px;border-radius:50%;background:var(--ok)}.ed-state.dirty i{background:var(--warn)}
.stsel{width:auto;min-height:36px;padding:0 10px;font-size:13px;font-weight:600}
.ed-bar{position:sticky;top:56px;z-index:40;display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center;padding:7px 12px;background:#0a1621f5;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.ed-bar .g{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid var(--line)}.ed-bar .g:last-child{border:0}
.tb{min-width:32px;height:32px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:#b9cad4;font-weight:700;font-size:13px}.tb:hover{background:#ffffff0f;color:#fff}.tb.on{background:#4cc9ff26;color:var(--ac2)}.tb:disabled{opacity:.3}
.tsel{height:32px;border:1px solid var(--line);border-radius:7px;background:#0d1a25;padding:0 8px;font-size:13px;font-weight:600}
.tcol{width:28px;height:28px;padding:1px;border:1px solid var(--line);border-radius:7px;background:none}
.ed-tbl{display:none;justify-content:center;gap:4px;padding:6px;background:#0f2230;border-bottom:1px solid var(--line);position:sticky;top:104px;z-index:39;flex-wrap:wrap}.ed-tbl.show{display:flex}.ed-tbl .btn{min-height:28px;padding:0 10px;font-size:12px}
.ed-body{display:flex;flex:1;min-width:0}

.t-title::placeholder,.t-sub::placeholder{color:#3b5160}
/* content */
.ProseMirror{outline:0;min-height:55vh;font:400 19px/1.8 var(--read);color:#dbe7ed}
.ProseMirror>*+*{margin-top:1em}.ProseMirror p{margin:0}
.ProseMirror p.is-editor-empty:first-child::before{content:attr(data-placeholder);float:left;height:0;pointer-events:none;color:#3f5665}
.ProseMirror h1,.ProseMirror h2,.ProseMirror h3,.ProseMirror h4{font-family:var(--disp);color:#fff;letter-spacing:-.03em;line-height:1.15;margin-top:1.6em}
.ProseMirror h1{font-size:38px}.ProseMirror h2{font-size:30px}.ProseMirror h3{font-size:23px}.ProseMirror h4{font-size:18px}
.ProseMirror a{color:var(--ac);text-decoration:underline;text-underline-offset:3px}.ProseMirror strong{color:#fff}
.ProseMirror ul,.ProseMirror ol{padding-left:1.4em}.ProseMirror li p{margin:0}
.ProseMirror ul[data-type=taskList]{list-style:none;padding:0}.ProseMirror ul[data-type=taskList] li{display:flex;gap:10px;align-items:flex-start}.ProseMirror ul[data-type=taskList] li>label{margin-top:.5em}.ProseMirror ul[data-type=taskList] li>div{flex:1}
.ProseMirror blockquote{margin-left:0;padding:14px 20px;border-left:3px solid var(--ac);border-radius:0 12px 12px 0;background:#4cc9ff12;color:#c4d9e3;font-style:italic}
.ProseMirror code{padding:.1em .4em;border-radius:5px;background:#ffffff12;color:var(--ac2);font:500 .85em ui-monospace,monospace}
.ProseMirror pre{padding:16px 18px;border-radius:12px;background:#050c12;border:1px solid var(--line);overflow:auto}.ProseMirror pre code{background:none;padding:0;color:#cfe3ec;font-size:14px}
.ProseMirror hr{border:0;border-top:1px solid var(--line2);margin:2em 0}
.ProseMirror mark{border-radius:4px;padding:0 .15em}
.ProseMirror img{display:block;max-width:100%;height:auto;margin:1.4em auto;border-radius:12px;border:1px solid var(--line)}.ProseMirror img.ProseMirror-selectednode{outline:3px solid var(--ac)}
.ProseMirror .tableWrapper{overflow-x:auto;margin:1.4em 0}.ProseMirror table{width:100%;border-collapse:collapse;table-layout:fixed;font:400 15px/1.5 var(--sans)}.ProseMirror th,.ProseMirror td{position:relative;min-width:90px;padding:10px 12px;border:1px solid var(--line2);vertical-align:top}.ProseMirror th{background:#4cc9ff14;text-align:left;font-weight:700;color:#fff}.ProseMirror .selectedCell{background:#4cc9ff26}.ProseMirror .column-resize-handle{position:absolute;right:-2px;top:0;bottom:0;width:4px;background:var(--ac)}.ProseMirror.resize-cursor{cursor:col-resize}
::selection{background:#4cc9ff44}
/* floating */
.float{position:fixed;z-index:120;display:none;background:#0b1822;border:1px solid var(--line2);border-radius:11px;box-shadow:0 18px 50px #000a}.float.show{display:flex}
#bub{padding:4px;gap:1px}
#slash{flex-direction:column;width:290px;max-height:320px;overflow:auto;padding:6px}#slash button{display:flex;flex-direction:column;align-items:flex-start;padding:8px 10px;border:0;border-radius:8px;background:transparent;text-align:left}#slash button b{font-size:13px}#slash button small{color:var(--mu);font-size:12px}#slash button.on,#slash button:hover{background:#4cc9ff1f}
/* settings drawer */
.drawer{width:0;overflow:hidden;border-left:1px solid var(--line);background:#09141d;transition:width .22s ease;flex:0 0 auto;position:sticky;top:104px;height:calc(100vh - 104px)}.drawer.open{width:340px;overflow:auto}.drawer-in{width:340px;padding:8px 16px 40px}
.drawer details{border-bottom:1px solid var(--line);padding:12px 0}.drawer summary{cursor:pointer;font:700 13px var(--disp);list-style:none;display:flex;justify-content:space-between}.drawer summary::after{content:'+';color:var(--mu)}.drawer details[open] summary::after{content:'–'}
.f{display:grid;gap:5px;margin-top:12px}.f>span{font-size:12px;font-weight:600;color:var(--mu)}.f small{color:var(--mu);font-size:11px}
.cover{margin-top:12px;height:150px;border:1px dashed var(--line2);border-radius:12px;background:#07111a;overflow:hidden;display:grid;place-items:center;color:var(--mu);font-size:12px;text-align:center}.cover img{width:100%;height:100%;object-fit:cover}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:16px;padding:7px;background:#071018e8;border-top:1px solid var(--line);color:var(--mu);font-size:12px;pointer-events:none}
.prev{font:400 19px/1.8 var(--read);color:#dbe7ed}.prev h1{font:700 40px/1.1 var(--disp);margin:0 0 6px}.prev img{max-width:100%;border-radius:12px}.prev table{width:100%;border-collapse:collapse}.prev td,.prev th{border:1px solid var(--line2);padding:8px}.prev blockquote{border-left:3px solid var(--ac);margin-left:0;padding-left:16px;color:#c4d9e3}
@media(max-width:900px){.layout{display:block}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.nav{display:flex;overflow:auto}.side .btn{margin:0}.main{padding:20px 14px 80px}.row{grid-template-columns:56px 1fr auto}.row .st{display:none}.drawer.open{position:fixed;right:0;top:104px;z-index:90;width:min(340px,92vw)}.canvas{padding:30px 16px 120px}.ed-top .hide-m{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="layout"><aside class="side"><a class="brand-logo" href="/"><img src="/assets/images/logo.png" alt="FCMobiletools"></a>
<nav class="nav" id="adminNav"><a href="/admin/dashboard.html">Overview</a><a href="/admin/dashboard.html?section=redeem">Redeem Codes</a><a href="/admin/dashboard.html?section=football">Football Centre</a><a href="/admin/dashboard.html?section=media">Media Library</a><a href="/admin/dashboard.html?section=events">Events &amp; Resets</a><a class="active" id="navArticles" href="/admin/articles/">Articles</a><a id="inboxNav" href="/admin/articles/#inbox">Inbox <i class="badge" id="inboxBadge" hidden>0</i></a><a href="/admin/dashboard.html?section=creators">Creators</a><a href="/admin/dashboard.html?section=account">Account</a><a href="/admin/dashboard.html?section=ads">Ad Settings</a><a href="/admin/fc-mobile-27.html">FC Mobile 27 APK</a><a href="/admin/rank-up.html">Rank Up Admin</a></nav>
<button class="btn" id="logout" type="button">Sign out</button></aside>
<main class="main" id="app"></main></div>
<div class="toasts" id="toasts" aria-live="polite"></div><div class="modal" id="modal"><div class="dlg" id="dlg"></div></div>
<div class="float" id="bub"></div><div class="float" id="slash"></div>

<script type="module">
import {Editor} from 'https://esm.sh/@tiptap/core@2.11.5';
import StarterKit from 'https://esm.sh/@tiptap/starter-kit@2.11.5';
import Underline from 'https://esm.sh/@tiptap/extension-underline@2.11.5';
import Link from 'https://esm.sh/@tiptap/extension-link@2.11.5';
import Image from 'https://esm.sh/@tiptap/extension-image@2.11.5';
import Table from 'https://esm.sh/@tiptap/extension-table@2.11.5';
import TableRow from 'https://esm.sh/@tiptap/extension-table-row@2.11.5';
import TableHeader from 'https://esm.sh/@tiptap/extension-table-header@2.11.5';
import TableCell from 'https://esm.sh/@tiptap/extension-table-cell@2.11.5';
import TextAlign from 'https://esm.sh/@tiptap/extension-text-align@2.11.5';
import TextStyle from 'https://esm.sh/@tiptap/extension-text-style@2.11.5';
import Color from 'https://esm.sh/@tiptap/extension-color@2.11.5';
import Highlight from 'https://esm.sh/@tiptap/extension-highlight@2.11.5';
import Placeholder from 'https://esm.sh/@tiptap/extension-placeholder@2.11.5';
import CharacterCount from 'https://esm.sh/@tiptap/extension-character-count@2.11.5';
import TaskList from 'https://esm.sh/@tiptap/extension-task-list@2.11.5';
import TaskItem from 'https://esm.sh/@tiptap/extension-task-item@2.11.5';

const $=s=>document.querySelector(s),app=$('#app');let role='admin',ed=null,dirty=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,o={}){const p=role==='creator'?'/api/creator':'/api/admin';const r=await fetch(p+path,{credentials:'same-origin',...o});const b=await r.json().catch(()=>({}));if(r.status===401)throw Error((b.error||'Session expired')+' ['+p+path+']');if(!r.ok)throw Error(b.error||'Request failed ('+r.status+')');return b}
function toast(m,t='success'){const d=document.createElement('div');d.className='toast '+t;d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3800)}
const modal=$('#modal'),dlg=$('#dlg');
function openModal(h){dlg.innerHTML=h;modal.classList.add('open');dlg.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeModal)}
function closeModal(){modal.classList.remove('open');dlg.innerHTML=''}
modal.onclick=e=>{if(e.target===modal)closeModal()};addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const dlgHead=(t,s)=>`<div class="dlg-h"><div><h3>${t}</h3>${s?`<small style="color:var(--mu)">${s}</small>`:''}</div><button class="x" data-x aria-label="Close">×</button></div>`;
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* ---------- LIST ---------- */
const FILTERS={all:'All articles',review:'Needs review',draft:'Drafts',published:'Published',trash:'Trash'};
async function listView(filter='all'){
  document.body.classList.remove('editing');dirty=false;
  const out=await api('/articles'),list=out.articles||[];
  const tr=role==='admin'?((await api('/articles/trash').catch(()=>({articles:[]}))).articles||[]):list.filter(a=>a.data?.deletedAt);
  const n={all:list.length,review:0,draft:0,published:0,trash:tr.length};list.forEach(a=>{if(n[a.data?.status]!==undefined)n[a.data.status]++});
  const rows=(filter==='trash'?tr:list.filter(a=>filter==='all'||a.data?.status===filter));
  app.innerHTML=`<div class="head"><div><h1>Articles</h1><p>Write, review and publish from one place.</p></div><button class="btn pri" id="new">+ New article</button></div>
  <div class="tabs">${Object.entries(FILTERS).map(([k,v])=>`<button class="tab ${k===filter?'on':''}" data-f="${k}">${v}<b>${n[k]}</b></button>`).join('')}</div>
  <div class="lib"><div class="libbar"><input class="inp" id="q" placeholder="Search by title, author or category" aria-label="Search articles"></div>
  ${rows.map(a=>{const d=a.data||{};return `<div class="row" data-id="${esc(d.id)}"><span class="thumb">${d.image?`<img src="${esc(d.image)}" alt="">`:'FC'}</span><span><b>${esc(d.title||'Untitled')}</b><small>${esc(d.category||'Guides')} · ${esc(d.author||'')}</small></span><i class="st ${filter==='trash'?'':esc(d.status)}">${filter==='trash'?'trashed':esc(d.status||'draft')}</i><span class="acts">${filter==='trash'?`<button class="btn" data-restore="${esc(d.id)}">Restore</button>`:`<button class="btn dng" data-trash="${esc(d.id)}">Trash</button>`}</span></div>`}).join('')||'<div class="empty">Nothing here yet. Create an article to get started.</div>'}</div>`;
  $('#new').onclick=()=>openEditor(null);
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>listView(b.dataset.f));
  app.querySelectorAll('.row').forEach(r=>r.onclick=e=>{if(e.target.closest('button')||filter==='trash')return;openEditor(list.find(a=>String(a.data?.id)===r.dataset.id))});
  app.querySelectorAll('[data-trash]').forEach(b=>b.onclick=async()=>{if(!confirm('Move this article to Trash?'))return;try{await api('/articles/'+b.dataset.trash+'/trash',{method:'POST'});toast('Moved to Trash');listView(filter)}catch(e){toast(e.message,'error')}});
  app.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{try{await api('/articles/'+b.dataset.restore+'/restore',{method:'POST'});toast('Article restored');listView('all')}catch(e){toast(e.message,'error')}});
  $('#q').oninput=e=>{const q=e.target.value.toLowerCase();app.querySelectorAll('.row').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')};
}

/* ---------- MEDIA ---------- */
async function uploadFile(file){
  const s=await api('/media/sign'),fd=new FormData();
  fd.append('file',file);fd.append('api_key',s.apiKey);fd.append('timestamp',s.timestamp);fd.append('folder',s.folder);fd.append('signature',s.signature);
  const r=await fetch('https://api.cloudinary.com/v1_1/'+s.cloudName+'/image/upload',{method:'POST',body:fd}),d=await r.json();
  if(!r.ok)throw Error(d?.error?.message||'Upload failed');return d.secure_url;
}
async function mediaPicker(cb){
  const res=await api('/media');
  openModal(dlgHead('Media Library','Pick an image or upload a new one')+`<div class="dlg-b"><button class="btn pri" id="up">Upload image</button><input id="upf" type="file" accept="image/*" hidden><div class="pick">${(res.resources||[]).map(x=>`<button data-u="${esc(x.url)}"><img src="${esc(x.url)}" alt="" loading="lazy"></button>`).join('')}</div></div>`);
  dlg.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{cb(b.dataset.u);closeModal()});
  $('#up').onclick=()=>$('#upf').click();
  $('#upf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{toast('Uploading…','info');cb(await uploadFile(f));closeModal()}catch(err){toast(err.message,'error')}};
}

/* ---------- EDITOR ---------- */
const SLASH=[

}

  const TB=[['↶','Undo',e=>e.undo()],['↷','Redo',e=>e.redo()],'|','sel','|',

   ['❝','Quote',e=>e.toggleBlockquote(),'blockquote'],['•','Bullet list',e=>e.toggleBulletList(),'bulletList'],['1.','Numbered list',e=>e.toggleOrderedList(),'orderedList'],['☑','Checklist',e=>e.toggleTaskList(),'taskList'],'|',
   ['⬅','Align left',e=>e.setTextAlign('left'),{textAlign:'left'}],['↔','Align center',e=>e.setTextAlign('center'),{textAlign:'center'}],['➡','Align right',e=>e.setTextAlign('right'),{textAlign:'right'}],'|',
   ['🔗','Link  Ctrl+K',null,'link','link'],['🖼','Image from library',null,null,'img'],['⬆','Upload image',null,null,'upl'],['▦','Insert table',e=>e.insertTable({rows:3,cols:3,withHeaderRow:true}),'table'],['{ }','Code block',e=>e.toggleCodeBlock(),'codeBlock'],['―','Divider',e=>e.setHorizontalRule()],['Tx','Clear formatting',e=>e.unsetAllMarks().clearNodes()]];
  const bar=$('#bar'),btns=[];
  const fileIn=document.createElement('input');fileIn.type='file';fileIn.accept='image/*';fileIn.hidden=true;fileIn.onchange=()=>{add(fileIn.files[0]);fileIn.value=''};document.body.appendChild(fileIn);
  let g=document.createElement('div');g.className='g';bar.appendChild(g);
  TB.forEach(t=>{
   if(t==='|'){g=document.createElement('div');g.className='g';bar.appendChild(g);return}
   if(t==='sel'){const s=document.createElement('select');s.className='tsel';s.setAttribute('aria-label','Text style');s.innerHTML='<option value="p">Paragraph</option><option value="1">Heading 1</option><option value="2">Heading 2</option><option value="3">Heading 3</option><option value="4">Heading 4</option>';s.onchange=()=>{const c=ed.chain().focus();s.value==='p'?c.setParagraph().run():c.setHeading({level:+s.value}).run()};g.appendChild(s);btns.push(()=>{const h=[1,2,3,4].find(l=>ed.isActive('heading',{level:l}));s.value=h?String(h):'p'});return}

   const [l,ti,fn,act,kind]=t,b=document.createElement('button');b.type='button';b.className='tb';b.textContent=l;b.title=ti;b.setAttribute('aria-label',ti);
   b.onmousedown=e=>e.preventDefault();
   b.onclick=()=>{if(kind==='link')linkCmd();else if(kind==='img')mediaPicker(u=>ins(u));else if(kind==='upl')fileIn.click();else fn(ed.chain().focus()).run()};
   g.appendChild(b);if(act)btns.push(()=>b.classList.toggle('on',ed.isActive(act)));
  });
  const tblBar=$('#tbl');
  [['+ Row below',e=>e.addRowAfter()],['+ Row above',e=>e.addRowBefore()],['+ Column right',e=>e.addColumnAfter()],['+ Column left',e=>e.addColumnBefore()],['Toggle header',e=>e.toggleHeaderRow()],['Merge / split',e=>e.mergeOrSplit()],['− Row',e=>e.deleteRow()],['− Column',e=>e.deleteColumn()],['Delete table',e=>e.deleteTable()]].forEach(([l,fn])=>{const b=document.createElement('button');b.type='button';b.className='btn'+(/−|Delete/.test(l)?' dng':'');b.textContent=l;b.onmousedown=e=>e.preventDefault();b.onclick=()=>fn(ed.chain().focus()).run();tblBar.appendChild(b)});

  /* bubble menu */
  const bub=$('#bub');bub.innerHTML='';
  [['B',e=>e.toggleBold(),'bold'],['I',e=>e.toggleItalic(),'italic'],['U',e=>e.toggleUnderline(),'underline'],['S',e=>e.toggleStrike(),'strike'],['🔗',null,'link','link'],['H2',e=>e.toggleHeading({level:2}),'heading'],['❝',e=>e.toggleBlockquote(),'blockquote'],['▌',e=>e.toggleHighlight(),'highlight']].forEach(([l,fn,act,k])=>{
   const b=document.createElement('button');b.type='button';b.className='tb';b.textContent=l;b.onmousedown=e=>e.preventDefault();b.onclick=()=>{k==='link'?linkCmd():fn(ed.chain().focus()).run()};b.dataset.act=act;bub.appendChild(b)});
  const altBtn=document.createElement('button');altBtn.type='button';altBtn.className='tb';altBtn.textContent='Alt text';altBtn.onmousedown=e=>e.preventDefault();altBtn.onclick=()=>{const v=prompt('Alt text for this image',ed.getAttributes('image').alt||'');if(v!==null)ed.chain().focus().updateAttributes('image',{alt:v}).run()};
  const delBtn=document.createElement('button');delBtn.type='button';delBtn.className='tb';delBtn.textContent='Remove';delBtn.onmousedown=e=>e.preventDefault();delBtn.onclick=()=>ed.chain().focus().deleteSelection().run();
  const slash=$('#slash');let sIdx=0,sItems=[];

  function refresh(){
   btns.forEach(f=>f());
   tblBar.classList.toggle('show',ed.isActive('table'));
   const {from,to,empty}=ed.state.selection,isImg=ed.isActive('image');
   bub.querySelectorAll('[data-act]').forEach(b=>{b.style.display=isImg?'none':'';b.classList.toggle('on',ed.isActive(b.dataset.act))});

   if((!empty||isImg)&&ed.isFocused){const s=ed.view.coordsAtPos(from),e2=ed.view.coordsAtPos(to);bub.classList.add('show');const w=bub.offsetWidth;bub.style.left=Math.max(8,Math.min(innerWidth-w-8,(s.left+e2.right)/2-w/2))+'px';bub.style.top=Math.max(120,s.top-52)+'px'}else bub.classList.remove('show');
   /* slash */
   const {$from}=ed.state.selection,txt=$from.parent.textContent,m=empty&&$from.parent.type.name==='paragraph'&&/^\/([\w ]*)$/.exec(txt);
   if(m&&ed.isFocused){sItems=SLASH.filter(i=>i[0].toLowerCase().includes(m[1].toLowerCase()));if(!sItems.length){slash.classList.remove('show');return}sIdx=Math.min(sIdx,sItems.length-1);
    slash.innerHTML=sItems.map((i,n)=>`<button type="button" data-n="${n}" class="${n===sIdx?'on':''}"><b>${i[0]}</b><small>${i[1]}</small></button>`).join('');

  ed.view.dom.addEventListener('keydown',e=>{

  /* drawer + misc */

  $('#pickCover').onclick=()=>mediaPicker(u=>setCover(u));
  $('#upCover').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{try{toast('Uploading cover…','info');setCover(await uploadFile(i.files[0]))}catch(e){toast(e.message,'error')}};i.click()};

  };
  async function auto(){const st=$('#status').value;if(!dirty||busyAuto||st==='published')return;busyAuto=true;try{await save(st==='review'?'review':'draft',{silent:true})}finally{busyAuto=false}}

  const keys=e=>{if(!document.body.classList.contains('editing'))return removeEventListener('keydown',keys);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save($('#status').value==='review'?'review':'draft')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&ed?.isFocused){e.preventDefault();linkCmd()}};

async function revisions(id){try{const rows=(await api('/articles/'+id+'/revisions')).revisions||[];openModal(dlgHead('Revision history','Every save and review action is recorded')+`<div class="dlg-b">${rows.map(r=>`<div class="inbox-item"><div><b>Revision ${esc(r.revision_no)} · ${esc(r.action)}</b><small>${esc(r.editor_role)} · ${esc(r.review_status)} · ${new Date(r.created_at).toLocaleString()}${r.note?' · '+esc(r.note):''}</small></div></div>`).join('')||'<div class="empty">No revisions yet.</div>'}</div>`)}catch(e){toast(e.message,'error')}}

/* ---------- INBOX ---------- */
function refreshBadge(){api('/inbox').then(o=>{const it=o.items||[],c=role==='creator'?it.filter(x=>!x.read_at).length:it.length,b=$('#inboxBadge');if(b){b.textContent=c;b.hidden=c<1}}).catch(()=>{})}
async function inboxView(){
  document.body.classList.remove('editing');const items=(await api('/inbox')).items||[],w=role==='creator';
  app.innerHTML=`<div class="head"><div><h1>${w?'Editorial inbox':'Approval inbox'}</h1><p>${w?'Feedback from editors on your submissions.':'Review submissions, request changes or publish.'}</p></div></div>`+
  (items.map(x=>w?`<div class="inbox-item ${x.read_at?'':'pend'}"><div><b>${esc(x.title||'Editorial update')}</b><small>${esc(x.message||'')} · ${new Date(x.created_at).toLocaleString()}</small></div><div class="acts"><button class="btn" data-open="${esc(x.article_id||'')}">Open article</button>${x.read_at?'':`<button class="btn" data-read="${esc(x.id)}">Mark read</button>`}</div></div>`
   :`<div class="inbox-item pend"><div><b>${esc(x.title||'Untitled')}</b><small>${esc(x.author_name||'Creator')} · revision ${esc(x.revision_no||'1')} · ${new Date(x.created_at).toLocaleString()}${x.note?' · '+esc(x.note):''}</small></div><div class="acts"><button class="btn" data-open="${esc(x.article_id)}">Open</button><button class="btn" data-chg="${esc(x.article_id)}">Request changes</button><button class="btn pri" data-ok="${esc(x.article_id)}">Approve &amp; publish</button></div></div>`).join('')||'<div class="empty">Your inbox is clear.</div>');
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{if(!b.dataset.open)return;const o=await api('/articles');const it=(o.articles||[]).find(a=>String(a.data?.id)===b.dataset.open);if(it)openEditor(it)});
  app.querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{try{await api('/inbox/read',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:Number(b.dataset.read)})});inboxView();refreshBadge()}catch(e){toast(e.message,'error')}});
  app.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{if(!confirm('Approve and publish this article?'))return;try{await api('/articles/'+b.dataset.ok+'/approve',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({note:'Approved from inbox'})});toast('Approved and published');inboxView();refreshBadge()}catch(e){toast(e.message,'error')}});
  app.querySelectorAll('[data-chg]').forEach(b=>b.onclick=async()=>{const note=prompt('What should the creator change?','Please revise the article and resubmit.');if(note===null)return;try{await api('/articles/'+b.dataset.chg+'/request-changes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({note})});toast('Changes requested');inboxView();refreshBadge()}catch(e){toast(e.message,'error')}});
}

/* ---------- BOOT ---------- */
function authError(m){app.innerHTML=`<div class="err"><b>Admin session required</b><br>${esc(m)}</div><p><a class="btn pri" href="/admin/">Return to admin login</a></p>`}
function navState(){const inbox=location.hash==='#inbox';$('#navArticles').classList.toggle('active',!inbox);$('#inboxNav').classList.toggle('active',inbox)}
async function boot(){
  try{
    const r=await fetch('/api/admin/me',{credentials:'same-origin',cache:'no-store'});
    if(r.ok)role='admin';else{const c=await fetch('/api/creator/me',{credentials:'same-origin',cache:'no-store'});if(!c.ok||!(await c.json())?.creator)return authError('Your writer/editor session could not be verified.');role='creator'}
    $('#logout').onclick=async()=>{try{await api('/logout',{method:'POST'})}finally{try{await fetch(role==='creator'?'/api/creator/logout':'/api/admin/logout',{method:'POST',credentials:'same-origin'})}catch{}location.replace('/admin/')}};
    const p=new URLSearchParams(location.search),eid=p.get('edit');
    if(location.hash==='#inbox')await inboxView();
    else if(p.get('new')==='1')editorView(null);
    else if(eid&&/^\d+$/.test(eid)){const o=await api('/articles');const it=(o.articles||[]).find(x=>String(x.data?.id)===eid);if(it)editorView(it);else{history.replaceState(null,'','/admin/articles/');await listView('all')}}
    else{const f=p.get('filter');await listView(FILTERS[f]?f:'all')}
    navState();refreshBadge();
  }catch(e){authError(e?.message||'Unable to load the article workspace.')}
}
addEventListener('popstate',()=>location.reload());
addEventListener('hashchange',()=>{navState();location.hash==='#inbox'?inboxView():listView('all')});
boot();
</script></body></html>
