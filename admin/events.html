<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>FC Mobile Tools Admin Events</title><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700;800&display=swap');
:root{--bg:#070b10;--panel:#0d141b;--line:#20323d;--text:#f4f8fb;--muted:#8ea2b0;--cyan:#56d6ff;--blue:#4f7dff;--good:#67e7a6;--bad:#ff7d72;--sans:Manrope,system-ui,sans-serif;--display:Sora,system-ui,sans-serif;--mono:'IBM Plex Mono',monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(800px 500px at 5% 0,#56d6ff12,transparent 60%),radial-gradient(800px 520px at 100% 0,#4f7dff12,transparent 60%),var(--bg);color:var(--text);font:14px/1.55 var(--sans)}a{color:var(--cyan);text-decoration:none}.wrap{width:min(1120px,calc(100% - 30px));margin:auto;padding:34px 0 70px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:24px}.eyebrow{color:var(--cyan);font:700 8px var(--mono);letter-spacing:.16em}.top h1{margin:8px 0 4px;font:800 32px var(--display);letter-spacing:-.05em}.top p{margin:0;color:var(--muted);font-size:11px}.actions{display:flex;gap:8px}.btn{border:1px solid #29404d;border-radius:10px;background:#0d171e;color:#dbe7ee;padding:10px 13px;font:700 9px var(--mono);cursor:pointer}.btn.primary{border-color:#69dcff;background:linear-gradient(135deg,#69e0ff,#2aa8e8);color:#04131c}.btn:disabled{opacity:.55;cursor:wait}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{padding:20px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#0d151c,#091017);box-shadow:0 20px 60px #0005}.card h2{margin:0;font:700 17px var(--display)}.card>p{margin:5px 0 18px;color:#778a98;font-size:9px}.fields{display:grid;gap:13px}.two{grid-template-columns:1fr 1fr}.field label{display:block;margin-bottom:6px;color:#c9d7df;font-size:9px;font-weight:800}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #293e49;border-radius:10px;background:#071016;color:#f3f8fb;outline:0;font:600 10px var(--sans)}.field input:focus,.field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #56d6ff10}.preview{margin-top:14px;border:1px solid #1d3441;border-radius:13px;overflow:hidden;background:#071016;min-height:170px;display:grid;place-items:center}.preview img{display:block;width:100%;max-height:300px;object-fit:cover}.hint{margin-top:9px;color:#607484;font-size:8px}.savebar{position:sticky;bottom:16px;margin-top:15px;padding:12px 14px;border:1px solid #29414f;border-radius:13px;background:#0b151ced;backdrop-filter:blur(15px);display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 20px 45px #0008}.status{color:#7e92a0;font:700 8px var(--mono)}.status.good{color:var(--good)}.status.bad{color:var(--bad)}.wide{grid-column:1/-1}.back{margin-bottom:18px;font-size:9px;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.wide{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}}
</style></head><body><main class="wrap"><a class="back" href="/admin/">← Admin dashboard</a><header class="top"><div><div class="eyebrow">CONTENT CONTROL / UTILITIES</div><h1>Events & Resets</h1><p>Change countdown content here without touching page code. All settings are stored with the existing Football Centre data flow.</p></div><div class="actions"><a class="btn" href="/event-countdown" target="_blank" rel="noreferrer">View Event</a><a class="btn" href="/division-rivals-reset" target="_blank" rel="noreferrer">View Rivals</a></div></header><div id="error" class="card" hidden></div><section class="grid" id="app"></section><div class="savebar"><span id="status" class="status">Loading settings…</span><button id="save" class="btn primary" type="button" disabled>Save utility settings</button></div></main><script>
const app=document.getElementById('app'),error=document.getElementById('error'),statusEl=document.getElementById('status'),save=document.getElementById('save');let content=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch('/api/admin'+path,{credentials:'same-origin',...options});const b=await r.json().catch(()=>({}));if(r.status===401){location.replace('/admin/');throw Error('Session expired')}if(!r.ok)throw Error(b.error||`Request failed (${r.status})`);return b}
function showError(message){error.hidden=false;error.innerHTML='<strong>Could not load settings</strong><p style="margin:7px 0 0;color:#ffb8ae;font-size:10px">'+esc(message)+'</p>';statusEl.textContent='Error';statusEl.className='status bad';save.disabled=true}
function localToUtc(value){if(!value)return '';const d=new Date(value);return Number.isNaN(d.getTime())?'':d.toISOString()}
function utcToLocal(value){if(!value)return '';const d=new Date(value);if(Number.isNaN(d.getTime()))return '';const pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function render(){const e=content.eventCountdown||{},r=content.divisionRivalsReset||{};app.innerHTML=`
<section class="card"><h2>Event Countdown</h2><p>Control the anniversary event banner, title and exact event window</p><div class="fields"><div class="field"><label for="eventTitle">Event title</label><input id="eventTitle" value="${esc(e.title)}"></div><div class="field"><label for="eventSubtitle">Subtitle</label><input id="eventSubtitle" value="${esc(e.subtitle)}"></div><div class="field"><label for="eventAccent">Eyebrow label</label><input id="eventAccent" value="${esc(e.accent)}"></div><div class="field"><label for="eventBanner">Banner image URL</label><input id="eventBanner" value="${esc(e.banner)}"></div><div class="fields two"><div class="field"><label for="eventStart">Start time in your local timezone</label><input id="eventStart" type="datetime-local" value="${esc(utcToLocal(e.startUtc))}"></div><div class="field"><label for="eventEnd">End time in your local timezone</label><input id="eventEnd" type="datetime-local" value="${esc(utcToLocal(e.endUtc))}"></div></div><div class="field"><label><input id="eventEnabled" type="checkbox" ${e.enabled!==false?'checked':''} style="width:auto;margin-right:7px"> Enable Event Countdown</label></div></div><div class="preview" id="preview"><span class="hint">Banner preview</span></div><div class="hint">Dates are converted to UTC before saving so every visitor gets the same event window in their own timezone.</div></section>
<section class="card"><h2>Division Rivals Reset</h2><p>Set the recurring weekly reset day and UTC time</p><div class="fields"><div class="field"><label for="drTitle">Title</label><input id="drTitle" value="${esc(r.title)}"></div><div class="field"><label for="drLabel">Short label</label><input id="drLabel" value="${esc(r.label)}"></div><div class="fields two"><div class="field"><label for="drDay">Reset day</label><select id="drDay">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((d,i)=>`<option value="${i}" ${Number(r.weekdayUtc)===i?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label for="drTime">Reset time UTC</label><input id="drTime" type="time" value="${String(r.hourUtc??0).padStart(2,'0')}:${String(r.minuteUtc??0).padStart(2,'0')}"></div></div><div class="field"><label for="drNote">Admin note</label><input id="drNote" value="${esc(r.note)}"></div><div class="field"><label><input id="drEnabled" type="checkbox" ${r.enabled!==false?'checked':''} style="width:auto;margin-right:7px"> Enable Division Rivals Reset</label></div></div><div class="hint">Default is Thursday at 01:00 UTC. Change it here if the live FC Mobile schedule changes.</div></section>`;
const img=document.getElementById('preview');const banner=document.getElementById('eventBanner');const preview=()=>{const url=banner.value.trim();img.innerHTML=url?`<img src="${esc(url)}" alt="Banner preview" onerror="this.parentElement.innerHTML='<span class=\"hint\">Could not load banner image</span>'">`:'<span class="hint">Banner preview</span>'};banner.addEventListener('input',preview);preview();save.disabled=false}
async function load(){try{const b=await api('/football');content=b.content;render();statusEl.textContent='Ready to edit';statusEl.className='status good'}catch(e){showError(e.message)}}
save.addEventListener('click',async()=>{if(!content)return;save.disabled=true;statusEl.textContent='Saving…';statusEl.className='status';try{const e=content.eventCountdown||{},r=content.divisionRivalsReset||{};e.enabled=document.getElementById('eventEnabled').checked;e.title=document.getElementById('eventTitle').value.trim();e.subtitle=document.getElementById('eventSubtitle').value.trim();e.accent=document.getElementById('eventAccent').value.trim();e.banner=document.getElementById('eventBanner').value.trim();e.startUtc=localToUtc(document.getElementById('eventStart').value);e.endUtc=localToUtc(document.getElementById('eventEnd').value);r.enabled=document.getElementById('drEnabled').checked;r.title=document.getElementById('drTitle').value.trim();r.label=document.getElementById('drLabel').value.trim();r.weekdayUtc=Number(document.getElementById('drDay').value);const [hour,minute]=document.getElementById('drTime').value.split(':').map(Number);r.hourUtc=Number.isFinite(hour)?hour:0;r.minuteUtc=Number.isFinite(minute)?minute:0;r.note=document.getElementById('drNote').value.trim();content.eventCountdown=e;content.divisionRivalsReset=r;const b=await api('/football',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({content})});statusEl.textContent=`Saved · ${b.commitSha?.slice(0,7)||'commit'}`;statusEl.className='status good';save.disabled=false}catch(e){statusEl.textContent=e.message;statusEl.className='status bad';save.disabled=false}});
load();
</script></body></html>
