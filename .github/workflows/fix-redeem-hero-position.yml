name: Fix redeem hero position
on:
  push:
    branches: [main]
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix redeem hero object position') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix hero positioning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/redeem-codes.astro')
          s=p.read_text()
          marker='/* FINAL HERO POSITION FIX */'
          if marker not in s:
            s += r'''
<style is="global">
/* FINAL HERO POSITION FIX */
.codes-page .codes-wrap{position:relative}
.codes-page .hero{
  position:relative!important;
  display:block!important;
  min-height:clamp(520px,68vh,680px)!important;
  margin:0!important;
  padding:clamp(42px,6vw,78px) 0 34px!important;
  overflow:visible!important;
  border:0!important;
  border-radius:0!important;
  background:transparent!important;
  box-shadow:none!important;
}
.codes-page .hero:before,.codes-page .hero:after{display:none!important}
.codes-page .hero-copy{
  position:relative!important;
  z-index:5!important;
  width:min(650px,58%)!important;
  max-width:650px!important;
  margin:0!important;
}
.codes-page .hero-object-main{
  position:absolute!important;
  z-index:2!important;
  top:12px!important;
  right:-18px!important;
  bottom:auto!important;
  left:auto!important;
  width:min(520px,45vw)!important;
  height:auto!important;
  min-height:0!important;
  margin:0!important;
  padding:0!important;
  display:block!important;
  transform:none!important;
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
}
.codes-page .hero-object-main:before,.codes-page .hero-object-main:after{display:none!important}
.codes-page .hero-object-main img{
  display:block!important;
  width:100%!important;
  height:auto!important;
  max-width:none!important;
  object-fit:contain!important;
  filter:drop-shadow(0 28px 55px rgba(0,0,0,.46))!important;
}
@media(max-width:900px){
  .codes-page .hero{min-height:auto!important;padding-top:34px!important}
  .codes-page .hero-copy{width:100%!important;max-width:720px!important}
  .codes-page .hero-object-main{
    position:relative!important;
    top:auto!important;right:auto!important;
    width:min(520px,78vw)!important;
    margin:-10px auto 0!important;
  }
}
@media(max-width:600px){
  .codes-page .hero{padding:28px 0 24px!important}
  .codes-page .hero-object-main{width:min(390px,92vw)!important;margin:0 auto!important}
}
</style>
'''
            p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/redeem-codes.astro
          git diff --cached --quiet || git commit -m "Fix redeem hero object position"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-redeem-hero-position.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/fix-redeem-hero-position.yml
          git diff --cached --quiet || git commit -m "Remove temporary hero position workflow"
          git push
