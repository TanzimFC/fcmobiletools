name: Run calculator system patch
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message == 'run calculator system patch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/apply-calculator-system.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/training-calculator.astro src/pages/rank-up-calculator.astro src/pages/redeem-codes.astro src/worker.mjs admin/dashboard.html
          git commit -m 'apply calculator data rendering and admin endpoints'
          git push origin main
      - name: Cleanup
        if: always()
        run: |
          git fetch origin main
          git checkout main
          git rm -f scripts/apply-calculator-system.py .github/workflows/run-calculator-system-patch.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'remove temporary calculator patch files' || true
          git push origin main || true
