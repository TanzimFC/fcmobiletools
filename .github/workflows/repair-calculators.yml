name: Repair calculators and data centre
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'repair calculators and data centre')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replace calculator pages with clean data-driven versions
        shell: bash
        run: |
          cat > src/pages/training-calculator.astro <<'EOF'
---
import BaseLayout from '../layouts/BaseLayout.astro';
import { TRAINING_LEVELS, FODDER, MAX_TRAINING_LEVEL } from '../data/fcMobileTraining.js';
const fmt = (n) => Number(n).toLocaleString();
---
<BaseLayout title="FC Mobile Training Calculator | XP Calculator | FCMOBILETOOLS" description="Calculate FC Mobile Training XP, cards required, excess XP and every Training Level from 0 to 30 with a complete reference table.">
<main class="training-page">
<header class="hero"><div class="wrap"><nav><a href="/">FCMOBILETOOLS</a><span>›</span><span>Training Calculator</span></nav><div class="hero-grid"><div><span class="eyebrow">FC MOBILE / TRAINING LAB</span><h1>Training <em>Calculator</em></h1><p>Calculate the exact XP needed to reach any Training Level, the cards required and the remaining XP.</p><div class="pills"><span>LEVEL 0–30</span><span>XP PLANNER</span><span>FULL REFERENCE</span></div></div><div class="hero-mark"><strong>XP</strong><small>TRAINING</small></div></div></div></header>
<section class="wrap section"><div class="card"><div class="head"><div><span class="label">XP PLANNER</span><h2>Build your training plan</h2><p>All options below are populated from the training data source</p></div><b class="max">MAX R30</b></div><div class="fields"><label>Current Level<select id="currentLevel">{TRAINING_LEVELS.map((_, i) => <option value={i}>Level {i}</option>)}</select></label><label>Target Level<select id="targetLevel">{TRAINING_LEVELS.map((_, i) => <option value={i}>Level {i}</option>)}</select></label><label>Fodder OVR<select id="fodderId">{FODDER.map((f) => <option value={f.id}>{f.label} — {fmt(f.xp)} XP</option>)}</select></label></div><div id="error" class="error" hidden></div><div class="result"><div><small>XP REQUIRED</small><strong id="required">0</strong><p id="summary">Select your levels</p></div><div class="stats"><div><small>CARDS NEEDED</small><b id="cards">0</b></div><div><small>XP PER CARD</small><b id="perCard">0</b></div><div><small>EXCESS XP</small><b id="extra">0</b></div><div><small>LEVELS GAINED</small><b id="gained">0</b></div></div></div><div class="progress"><div><span id="from">LEVEL 0</span><b id="pct">0%</b><span id="to">LEVEL 30</span></div><i id="fill"></i></div><div class="break"><div class="break-title"><span class="label">SELECTED ROUTE</span><h3>Level-by-level XP</h3></div><div class="table-scroll"><table><thead><tr><th>LEVEL</th><th>XP TO NEXT</th><th>TOTAL XP</th></tr></thead><tbody id="breakdown"></tbody></table></div></div></div></section>
<section class="reference"><div class="wrap"><div class="section-title"><span class="label">REFERENCE DATA</span><h2>FC Mobile Training XP table</h2><p>The complete level data is rendered on the page, not dependent on a client-side table fill.</p></div><div class="reference-grid"><div class="ref-card"><h3>XP by Training Level</h3><div class="table-scroll"><table><thead><tr><th>LEVEL</th><th>TOTAL XP</th><th>XP TO NEXT</th></tr></thead><tbody>{TRAINING_LEVELS.map((xp, i) => <tr><td>Level {i}</td><td>{fmt(xp)} XP</td><td>{i < MAX_TRAINING_LEVEL ? `${fmt(TRAINING_LEVELS[i + 1] - xp)} XP` : 'MAX'}</td></tr>)}</tbody></table></div></div><div class="ref-card"><h3>Fodder XP Values</h3><div class="fodder-grid">{FODDER.map((f) => <div><span>{f.label}</span><b>{fmt(f.xp)} XP</b></div>)}</div></div></div></div></section>
<section class="faq"><div class="wrap"><span class="label">FAQ</span><h2>FC Mobile Training Calculator FAQ</h2><details open><summary>How much XP do I need?</summary><p>Choose a current and target Training Level and the calculator uses the exact difference between the stored XP totals.</p></details><details><summary>How are cards calculated?</summary><p>Required XP is divided by the selected fodder XP and rounded up to the next whole card.</p></details></div></section>
</main>
<script>
import { calculateTraining } from '../lib/fcMobileTraining.js';
import { TRAINING_LEVELS, FODDER, MAX_TRAINING_LEVEL } from '../data/fcMobileTraining.js';
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n).toLocaleString();
const current = $('currentLevel'); const target = $('targetLevel'); const fodder = $('fodderId');
current.value = '0'; target.value = String(MAX_TRAINING_LEVEL); if (FODDER.length) fodder.value = FODDER[FODDER.length - 1].id;
function render(){
  const d = calculateTraining({currentLevel: current.value, targetLevel: target.value, fodderId: fodder.value});
  if(!d.valid){ $('error').hidden=false; $('error').textContent=d.error; return; }
  $('error').hidden=true; $('required').textContent=fmt(d.requiredXP); $('cards').textContent=fmt(d.cards); $('perCard').textContent=fmt(d.fodder.xp); $('extra').textContent=fmt(d.extraXP); $('gained').textContent=String(d.targetLevel-d.currentLevel); $('summary').textContent=`Level ${d.currentLevel} → Level ${d.targetLevel} using ${d.fodder.label}`; $('from').textContent=`LEVEL ${d.currentLevel}`; $('to').textContent=`LEVEL ${d.targetLevel}`; const pct=MAX_TRAINING_LEVEL ? Math.round((d.targetLevel/MAX_TRAINING_LEVEL)*100) : 0; $('pct').textContent=`${pct}%`; $('fill').style.width=`${pct}%`;
  const rows=[]; for(let i=d.currentLevel;i<d.targetLevel;i++){ rows.push(`<tr><td>Level ${i} → ${i+1}</td><td>${fmt(TRAINING_LEVELS[i+1]-TRAINING_LEVELS[i])} XP</td><td>${fmt(TRAINING_LEVELS[i+1])} XP</td></tr>`); } $('breakdown').innerHTML=rows.length ? rows.join('') : '<tr><td colspan="3">No XP required — already at the target level</td></tr>';
}
[current,target,fodder].forEach((el)=>el.addEventListener('change',render)); render();
</script>
<style>
:root{--bg:#05080d;--panel:#0b121b;--line:#213342;--text:#f5fbff;--muted:#8195a5;--cyan:#36c9ff;--blue:#4b7dff;--mono:'IBM Plex Mono',monospace;--sans:'Manrope',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}.hero{border-bottom:1px solid var(--line);background:radial-gradient(circle at 12% 0,#36c9ff15,transparent 36%),radial-gradient(circle at 90% 50%,#4b7dff12,transparent 35%)}.hero>.wrap{padding:28px 0 62px}.hero nav{display:flex;gap:10px;color:#607484;font:700 9px var(--mono);margin-bottom:60px}.hero nav a{color:var(--cyan)}.hero-grid{display:grid;grid-template-columns:1fr 260px;gap:50px;align-items:center}.eyebrow,.label{font:800 9px var(--mono);letter-spacing:.16em;color:var(--cyan)}h1{font-size:clamp(54px,8vw,96px);line-height:.88;letter-spacing:-.08em;margin:15px 0 22px}h1 em{font-style:normal;background:linear-gradient(100deg,#fff,var(--cyan));background-clip:text;color:transparent}.hero p{max-width:680px;color:#8ea1b0;font-size:15px;line-height:1.75}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:25px}.pills span{padding:8px 10px;border:1px solid var(--line);border-radius:7px;color:#718696;font:700 8px var(--mono)}.hero-mark{height:220px;display:grid;place-items:center;align-content:center;border:1px solid #36c9ff28;border-radius:38px;background:linear-gradient(145deg,#102331,#071018);box-shadow:0 0 90px #36c9ff12}.hero-mark strong{font:900 82px var(--mono);letter-spacing:-.1em}.hero-mark small{color:var(--cyan);font:800 8px var(--mono);letter-spacing:.2em}.section{padding:45px 0 70px}.card,.ref-card{border:1px solid var(--line);background:linear-gradient(145deg,#0c151f,#080e15);border-radius:24px;overflow:hidden;box-shadow:0 30px 90px #00000045}.head{display:flex;justify-content:space-between;padding:28px;border-bottom:1px solid var(--line)}h2{font-size:27px;letter-spacing:-.05em;margin:7px 0}.head p,.section-title p{margin:0;color:var(--muted);font-size:11px}.max{align-self:start;color:var(--cyan);border:1px solid #36c9ff30;background:#36c9ff08;padding:10px 12px;border-radius:9px;font:900 9px var(--mono)}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:24px 28px}.fields label{display:grid;gap:8px;color:#90a3b1;font:800 9px var(--mono)}select{width:100%;padding:14px;border-radius:11px;border:1px solid #293b4b;background:#070e15;color:#f5fbff;font:700 11px var(--mono)}.result{margin:0 28px;border:1px solid #36c9ff25;border-radius:17px;background:linear-gradient(135deg,#0e2532,#09141d);padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.result small,.stats small{font:800 8px var(--mono);color:#6e9aab;letter-spacing:.12em}.result strong{display:block;font:900 clamp(46px,7vw,76px) var(--mono);letter-spacing:-.08em;margin:8px 0}.result p{font:700 9px var(--mono);color:#8ca8b5}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats div{padding:14px;border:1px solid #ffffff10;background:#ffffff06;border-radius:10px}.stats b{display:block;margin-top:7px;font:900 17px var(--mono)}.progress{padding:25px 28px}.progress>div{display:flex;justify-content:space-between;color:#708491;font:800 8px var(--mono)}.progress b{color:var(--cyan)}.progress>i{display:block;height:7px;width:0;margin-top:9px;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:.3s}.break{border-top:1px solid var(--line)}.break-title{padding:24px 28px 15px}.break-title h3{margin:7px 0 0;font-size:18px}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;padding:13px 16px;border-top:1px solid #1b2a35;font-size:10px}th{color:#68808e;font:800 8px var(--mono);letter-spacing:.1em}td{color:#d7e5eb}.reference{padding:70px 0;background:#070c12;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.section-title{margin-bottom:22px}.reference-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.ref-card{padding:22px}.ref-card h3{margin:0 0 17px;font-size:17px}.fodder-grid{display:grid;gap:8px}.fodder-grid div{display:flex;justify-content:space-between;align-items:center;padding:13px;border:1px solid #ffffff0d;border-radius:10px;background:#ffffff04}.fodder-grid span{font-size:10px;color:#8397a5}.fodder-grid b{font:800 11px var(--mono);color:var(--cyan)}.faq{padding:70px 0}.faq h2{margin-bottom:22px}.faq details{border-top:1px solid var(--line);padding:17px 0}.faq summary{cursor:pointer;font-weight:800;font-size:12px}.faq p{color:var(--muted);font-size:11px;line-height:1.7}.error{margin:0 28px 15px;padding:11px;border:1px solid #ff4d5e35;background:#ff4d5e0d;color:#ff9ca5;border-radius:9px;font:700 9px var(--mono)}@media(max-width:800px){.hero-grid,.reference-grid,.result{grid-template-columns:1fr}.hero-mark{display:none}.fields{grid-template-columns:1fr}.wrap{width:calc(100% - 28px)}}
</style>
EOF

          cat > src/pages/rank-up-calculator.astro <<'EOF'
---
import BaseLayout from '../layouts/BaseLayout.astro';
import { RANKS, RANK_COSTS } from '../data/fcMobileRankUp.js';
const fmt=(n)=>Number(n).toLocaleString();
---
<BaseLayout title="FC Mobile Rank Up Calculator | Rank Up Points | FCMOBILETOOLS" description="Calculate FC Mobile Rank Up Points, rank costs, OVR gain and Skill Points with a complete Base OVR reference table.">
<main class="rank-page"><header class="hero"><div class="wrap"><nav><a href="/">FCMOBILETOOLS</a><span>›</span><span>Rank Up Calculator</span></nav><div class="hero-grid"><div><span class="eyebrow">FC MOBILE / RANK LAB</span><h1>Rank Up <em>Calculator</em></h1><p>Calculate the exact Rank Up Points required for every rank step and compare the full Base OVR cost table.</p><div class="pills"><span>RANK UP POINTS</span><span>BASE OVR</span><span>R0 → R5</span></div></div><div class="hero-mark"><strong>R5</strong><small>ORANGE</small></div></div></div></header>
<section class="wrap section"><div class="card"><div class="head"><div><span class="label">RANK UP PLANNER</span><h2>Build your rank path</h2><p>All ranks and costs come from the editable Rank Up data source</p></div><b class="max">R5 ORANGE</b></div><div class="fields"><label>Base OVR<input id="base" type="number" min="0" max="150" value="110"></label><label>Current Rank<select id="current">{RANKS.map((r)=><option value={r.value}>R{r.value} · {r.name}</option>)}</select></label><label>Target Rank<select id="target">{RANKS.map((r)=><option value={r.value}>R{r.value} · {r.name}</option>)}</select></label><label>Available RP<input id="available" type="number" min="0" placeholder="Optional"></label></div><div id="error" class="error" hidden></div><div class="result"><div><small>RP REQUIRED</small><strong id="required">0</strong><p id="status">Choose your rank path</p></div><div class="stats"><div><small>OVR AFTER RANK</small><b id="ovr">110</b></div><div><small>SKILL POINTS</small><b id="skills">0</b></div><div><small>RANKS GAINED</small><b id="gained">0</b></div><div><small>RP REMAINING</small><b id="remaining">—</b></div></div></div><div class="path"><span class="label">RANK PROGRESSION</span><div id="rankPath"></div></div><div class="steps"><div class="steps-head"><div><span class="label">COST BREAKDOWN</span><h3>Every rank step</h3></div><b id="costTotal">0 RP</b></div><div id="stepRows"></div></div></div>
<div class="reference"><div class="section-title"><span class="label">REFERENCE DATA</span><h2>Rank Up Points by Base OVR</h2><p>Every bracket and every R1–R5 cost is visible below.</p></div><div class="table-scroll"><table><thead><tr><th>BASE OVR</th><th>R1 GREEN</th><th>R2 BLUE</th><th>R3 PURPLE</th><th>R4 RED</th><th>R5 ORANGE</th></tr></thead><tbody>{RANK_COSTS.map((row)=><tr><td>{row.label}</td>{row.costs.map((cost)=><td>{fmt(cost)} RP</td>)}</tr>)}</tbody></table></div></div></section>
<section class="faq"><div class="wrap"><span class="label">FAQ</span><h2>FC Mobile Rank Up Calculator FAQ</h2><details open><summary>How are Rank Up Points calculated?</summary><p>The calculator finds the Base OVR bracket and adds each cost between the current and target rank.</p></details><details><summary>Which ranks are supported?</summary><p>{RANKS.map((r)=>`R${r.value} ${r.name}`).join(' · ')}.</p></details></div></section></main>
<script>
import { calculateRankUp } from '../lib/fcMobileRankUp.js';
import { RANKS } from '../data/fcMobileRankUp.js';
const $=(id)=>document.getElementById(id); const fmt=(n)=>Number(n).toLocaleString();
const base=$('base'),current=$('current'),target=$('target'),available=$('available'); current.value='0'; target.value='5';
function render(){
 const d=calculateRankUp({baseOVR:base.value,currentRank:current.value,targetRank:target.value,availableRP:available.value});
 if(!d.valid){$('error').hidden=false;$('error').textContent=d.error;return;} $('error').hidden=true; $('required').textContent=fmt(d.requiredRP); $('ovr').textContent=fmt(d.targetOVR); $('skills').textContent=String(d.skillPoints); $('gained').textContent=String(d.ranksGained); $('costTotal').textContent=`${fmt(d.requiredRP)} RP`; $('status').textContent=`${d.bracket.label} · R${d.currentRank} → R${d.targetRank}`); $('remaining').textContent=d.remainingRP===null?'—':fmt(d.remainingRP);
 const path=RANKS.map((r)=>`<div class="rank-node ${r.value===d.currentRank?'current':''} ${r.value===d.targetRank?'target':''}"><b>R${r.value}</b><span>${r.name}</span></div>`).join('<i></i>'); $('rankPath').innerHTML=path;
 $('stepRows').innerHTML=d.steps.length?d.steps.map((s)=>`<div class="step"><div><b>R${s.from} → R${s.to}</b><small>${RANKS[s.to].name}</small></div><strong>${fmt(s.cost)} RP</strong></div>`).join(''):'<div class="empty">No RP required — already at the selected rank</div>';
}
[base,current,target,available].forEach((el)=>el.addEventListener('input',render)); render();
</script>
<style>
:root{--bg:#05080d;--panel:#0b121b;--line:#213342;--text:#f5fbff;--muted:#8195a5;--cyan:#36c9ff;--blue:#4b7dff;--gold:#ffb84a;--mono:'IBM Plex Mono',monospace;--sans:'Manrope',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}.hero{border-bottom:1px solid var(--line);background:radial-gradient(circle at 12% 0,#36c9ff15,transparent 36%),radial-gradient(circle at 90% 50%,#4b7dff12,transparent 35%)}.hero>.wrap{padding:28px 0 62px}.hero nav{display:flex;gap:10px;color:#607484;font:700 9px var(--mono);margin-bottom:60px}.hero nav a{color:var(--cyan)}.hero-grid{display:grid;grid-template-columns:1fr 260px;gap:50px;align-items:center}.eyebrow,.label{font:800 9px var(--mono);letter-spacing:.16em;color:var(--cyan)}h1{font-size:clamp(54px,8vw,96px);line-height:.88;letter-spacing:-.08em;margin:15px 0 22px}h1 em{font-style:normal;background:linear-gradient(100deg,#fff,var(--cyan));background-clip:text;color:transparent}.hero p{max-width:680px;color:#8ea1b0;font-size:15px;line-height:1.75}.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:25px}.pills span{padding:8px 10px;border:1px solid var(--line);border-radius:7px;color:#718696;font:700 8px var(--mono)}.hero-mark{height:220px;display:grid;place-items:center;align-content:center;border:1px solid #36c9ff28;border-radius:38px;background:linear-gradient(145deg,#102331,#071018);box-shadow:0 0 90px #36c9ff12}.hero-mark strong{font:900 70px var(--mono);letter-spacing:-.1em}.hero-mark small{color:var(--cyan);font:800 8px var(--mono);letter-spacing:.2em}.section{padding:45px 0 70px}.card,.reference{border:1px solid var(--line);background:linear-gradient(145deg,#0c151f,#080e15);border-radius:24px;overflow:hidden;box-shadow:0 30px 90px #00000045}.head{display:flex;justify-content:space-between;padding:28px;border-bottom:1px solid var(--line)}h2{font-size:27px;letter-spacing:-.05em;margin:7px 0}.head p,.section-title p{margin:0;color:var(--muted);font-size:11px}.max{align-self:start;color:var(--gold);border:1px solid #ffb84a35;background:#ffb84a08;padding:10px 12px;border-radius:9px;font:900 9px var(--mono)}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:24px 28px}.fields label{display:grid;gap:8px;color:#90a3b1;font:800 9px var(--mono)}input,select{width:100%;padding:14px;border-radius:11px;border:1px solid #293b4b;background:#070e15;color:#f5fbff;font:700 11px var(--mono)}.result{margin:0 28px;border:1px solid #36c9ff25;border-radius:17px;background:linear-gradient(135deg,#0e2532,#09141d);padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.result small,.stats small{font:800 8px var(--mono);color:#6e9aab;letter-spacing:.12em}.result strong{display:block;font:900 clamp(46px,7vw,76px) var(--mono);letter-spacing:-.08em;margin:8px 0}.result p{font:700 9px var(--mono);color:#8ca8b5}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats div{padding:14px;border:1px solid #ffffff10;background:#ffffff06;border-radius:10px}.stats b{display:block;margin-top:7px;font:900 17px var(--mono)}.path{padding:27px 28px}.path>div{display:flex;align-items:center;margin-top:17px;overflow:auto;padding-bottom:4px}.rank-node{min-width:92px;text-align:center}.rank-node b{width:52px;height:52px;margin:auto;display:grid;place-items:center;border:1px solid #344857;border-radius:16px;background:#0b141d;color:#738895;font:900 10px var(--mono)}.rank-node span{display:block;margin-top:8px;color:#708491;font-size:9px}.rank-node.current b{border-color:var(--cyan);color:var(--cyan)}.rank-node.target b{background:linear-gradient(145deg,#36c9ff,#2877db);color:#031018;border-color:var(--cyan)}.path i{display:block;min-width:35px;height:2px;background:#2a3e4c}.steps{margin:0 28px 28px;border:1px solid var(--line);border-radius:15px;overflow:hidden}.steps-head{display:flex;justify-content:space-between;padding:19px;border-bottom:1px solid var(--line)}.steps-head h3{margin:7px 0 0}.steps-head>b{color:var(--cyan);font:900 15px var(--mono)}.step{display:flex;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}.step:last-child{border:0}.step b{font-size:11px}.step small{display:block;color:#617887;font-size:8px;margin-top:4px}.step strong{font:900 13px var(--mono);color:#dff8ff}.empty{padding:20px;color:#718592;font-size:10px}.reference{padding:26px;margin-top:14px}.section-title{margin-bottom:20px}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:13px 16px;border-top:1px solid #1b2a35;font-size:10px}th{color:#68808e;font:800 8px var(--mono)}td{color:#d7e5eb}.faq{padding:70px 0}.faq h2{margin-bottom:22px}.faq details{border-top:1px solid var(--line);padding:17px 0}.faq summary{cursor:pointer;font-weight:800;font-size:12px}.faq p{color:var(--muted);font-size:11px;line-height:1.7}.error{margin:0 28px 15px;padding:11px;border:1px solid #ff4d5e35;background:#ff4d5e0d;color:#ff9ca5;border-radius:9px;font:700 9px var(--mono)}@media(max-width:850px){.hero-grid,.reference,.result{grid-template-columns:1fr}.hero-mark{display:none}.fields{grid-template-columns:1fr}.wrap{width:calc(100% - 28px)}}
</style>
