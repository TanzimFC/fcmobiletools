          cat > admin/calculators.html <<'EOF'
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Calculator Data Centre</title><style>body{margin:0;background:#05080d;color:#f5fbff;font:14px Manrope,system-ui,sans-serif}*{box-sizing:border-box}.wrap{width:min(1180px,calc(100% - 32px));margin:auto;padding:30px 0 70px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}h1{margin:0;font-size:34px;letter-spacing:-.05em}p{color:#8195a5}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:1px solid #213342;background:#0b121b;color:#9bb0bd;border-radius:9px;padding:10px 14px;cursor:pointer}.tab.active{border-color:#36c9ff55;color:#36c9ff;background:#36c9ff0b}.panel{display:none;border:1px solid #213342;background:#0b121b;border-radius:18px;padding:20px}.panel.active{display:block}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}button{border:1px solid #36c9ff55;background:#36c9ff12;color:#36c9ff;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}button.secondary{color:#9bb0bd;border-color:#334654;background:#101923}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{border-bottom:1px solid #1d2d39;padding:10px;text-align:left}th{color:#6f8795;font-size:10px}input{width:100%;min-width:70px;background:#070e15;color:#fff;border:1px solid #293b4b;border-radius:7px;padding:9px}.rank-name{min-width:110px}.status{margin-top:12px;color:#7f98a6;font-size:12px}.danger{color:#ff8994}.hint{font-size:11px;color:#708592}</style></head><body><main class="wrap"><header><div><h1>Calculator Data Centre</h1><p>Maintain Rank Up Points and Training XP without editing calculator code</p></div><a href="/admin" style="color:#36c9ff">← Admin</a></header><div class="tabs"><button class="tab active" data-tab="rank">Rank Up Points</button><button class="tab" data-tab="training">Training XP</button></div><section id="rank" class="panel active"><div class="toolbar"><div><b>Rank Up Points</b><div class="hint">Each row controls one Base OVR bracket and R1–R5 costs</div></div><button id="saveRank">Save Rank Up Data</button></div><div class="table-wrap"><table><thead><tr><th>Min OVR</th><th>Max OVR</th><th>Label</th><th>R1</th><th>R2</th><th>R3</th><th>R4</th><th>R5</th></tr></thead><tbody id="rankRows"></tbody></table></div><div id="rankStatus" class="status"></div></section><section id="training" class="panel"><div class="toolbar"><div><b>Training XP</b><div class="hint">Edit the cumulative XP for every Training Level and fodder card XP</div></div><button id="saveTraining">Save Training Data</button></div><h3>Training Levels</h3><div class="table-wrap"><table><thead><tr><th>Level</th><th>Total XP</th></tr></thead><tbody id="levelRows"></tbody></table></div><h3>Fodder XP</h3><div class="table-wrap"><table><thead><tr><th>ID</th><th>Label</th><th>XP</th></tr></thead><tbody id="fodderRows"></tbody></table></div><div id="trainingStatus" class="status"></div></section></main><script>
const $=id=>document.getElementById(id); let rankData=null,trainingData=null;
async function api(path,options){const r=await fetch('/api/admin/'+path,options);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`Request failed ${r.status}`);return d;}
function rankUI(){ $('rankRows').innerHTML=rankData.costs.map((r,i)=>`<tr><td><input data-r="${i}" data-k="min" type="number" value="${r.min}"></td><td><input data-r="${i}" data-k="max" value="${r.max===Infinity?'Infinity':r.max}"></td><td><input class="rank-name" data-r="${i}" data-k="label" value="${r.label}"></td>${r.costs.map((v,j)=>`<td><input data-r="${i}" data-c="${j}" type="number" min="0" value="${v}"></td>`).join('')}</tr>`).join(''); }
function trainingUI(){ $('levelRows').innerHTML=trainingData.levels.map((v,i)=>`<tr><td>Level ${i}</td><td><input data-level="${i}" type="number" min="0" value="${v}"></td></tr>`).join(''); $('fodderRows').innerHTML=trainingData.fodder.map((f,i)=>`<tr><td>${f.id}</td><td>${f.label}</td><td><input data-fodder="${i}" type="number" min="0" value="${f.xp}"></td></tr>`).join(''); }
async function load(){try{rankData=await api('rank-up');trainingData=await api('training');rankUI();trainingUI();}catch(e){$('rankStatus').textContent=e.message;$('rankStatus').className='status danger';}}
$('rankRows').addEventListener('input',e=>{const el=e.target;if(el.dataset.r===undefined)return;const r=rankData.costs[Number(el.dataset.r)];if(el.dataset.c!==undefined)r.costs[Number(el.dataset.c)]=Number(el.value);else if(el.dataset.k==='min')r.min=Number(el.value);else if(el.dataset.k==='max')r.max=el.value==='Infinity'?Infinity:Number(el.value);else r.label=el.value;});
$('levelRows').addEventListener('input',e=>{if(e.target.dataset.level!==undefined)trainingData.levels[Number(e.target.dataset.level)]=Number(e.target.value);}); $('fodderRows').addEventListener('input',e=>{if(e.target.dataset.fodder!==undefined)trainingData.fodder[Number(e.target.dataset.fodder)].xp=Number(e.target.value);});
$('saveRank').onclick=async()=>{try{$('rankStatus').textContent='Saving…';const d=await api('rank-up',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(rankData)});$('rankStatus').textContent=`Saved · commit ${d.commitSha}`;}catch(e){$('rankStatus').textContent=e.message;$('rankStatus').className='status danger';}};
$('saveTraining').onclick=async()=>{try{$('trainingStatus').textContent='Saving…';const d=await api('training',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(trainingData)});$('trainingStatus').textContent=`Saved · commit ${d.commitSha}`;}catch(e){$('trainingStatus').textContent=e.message;$('trainingStatus').className='status danger';}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');});load();
</script></body></html>
EOF

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='admin/dashboard.html';
          if(fs.existsSync(p)){
            let s=fs.readFileSync(p,'utf8');
            if(!s.includes('/admin/calculators.html')){
              s=s.replace(/(<nav[^>]*>)/i,'$1<a href="/admin/calculators.html">Calculator Data</a>');
              fs.writeFileSync(p,s);
            }
          }
          NODE

      - name: Build and verify
        run: npm ci && npm run build
      - name: Commit repaired calculators
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/training-calculator.astro src/pages/rank-up-calculator.astro admin/calculators.html admin/dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "repair calculators and data centre"
          git push origin main
      - name: Remove repair workflow
        if: success()
        run: |
          git rm .github/workflows/repair-calculators.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "remove calculator repair workflow"
          git push origin main
