name: Build shared nav/footer

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'partials/**'
      - 'scripts/build.js'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build pages from partials
        run: node scripts/build.js

      - name: Commit built pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild pages from shared nav/footer"
          file_pattern: '*.html **/*.html'
