name: Verify Supabase Editorial Build

on:
  push:
    branches:
      - supabase-lexical-editorial
      - supabase-lexical-editorial-v2
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Worker syntax
        run: node scripts/check-worker-syntax.mjs

      - name: Editorial regression checks
        run: node scripts/verify-editorial-runtime.mjs

      - name: Production Cloudflare build
        run: node scripts/build-static.mjs

      - name: Verify generated worker
        run: node -e "const fs=require('node:fs');if(!fs.existsSync('dist/_worker.js/index.js')){console.error('Missing dist/_worker.js/index.js');process.exit(1)};console.log('Generated Cloudflare worker verified.')"
        
      - name: Validate generated redirects
        run: node -e "const fs=require('node:fs');const p='dist/_redirects';if(!fs.existsSync(p)){console.log('No generated _redirects file.');process.exit(0)};const lines=fs.readFileSync(p,'utf8').split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('#'));const seen=new Set();for(let i=0;i<lines.length;i++){const parts=lines[i].split(/\s+/);if(parts.length<2||parts.length>3)throw new Error('_redirects line '+(i+1)+' must contain 2 or 3 tokens: '+lines[i]);if(seen.has(parts[0]))throw new Error('Duplicate _redirects source on line '+(i+1)+': '+parts[0]);seen.add(parts[0]);}console.log('Generated _redirects validated:',lines.length,'rules.')"
