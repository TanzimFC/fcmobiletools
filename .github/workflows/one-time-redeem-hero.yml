name: One time redeem hero polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-redeem-hero.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch redeem page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/redeem-codes.astro')
          s = p.read_text()
          old = 'https://res.cloudinary.com/b0qikv7n/image/upload/f_auto,q_auto,w_1200/v1789653531/fc-mobile-tools/o6ocwktktmw5yml9n8km.png'
          new = 'https://res.cloudinary.com/b0qikv7n/image/upload/f_auto,q_auto,w_1600/v1789654488/fc-mobile-tools/wsaga0c3xdaqq3yggrme.png'
          s = s.replace(old, new)
          s = s.replace('title="FC Mobile Redeem Codes"\n  description="Find working FC Mobile redeem codes, check active and expired status, copy codes instantly and open the official EA redemption page."', 'title="FC Mobile Redeem Codes | Working Codes & Rewards"\n  description="Find working FC Mobile redeem codes, check active and expired codes, copy codes instantly and redeem rewards through the official EA page."')
          marker = '<script define:vars={{ pageSchema, breadcrumbSchema }}>'
          css = '''<style is:global>
          .codes-page .hero{position:relative;display:block;min-height:clamp(520px,62vw,720px);overflow:hidden;border:1px solid #1c3548;border-radius:30px;background:#06141e url("https://res.cloudinary.com/b0qikv7n/image/upload/f_auto,q_auto,w_1800/v1789654488/fc-mobile-tools/wsaga0c3xdaqq3yggrme.png") center/cover no-repeat;box-shadow:0 35px 100px #0009,inset 0 0 0 1px #55c7f222}
          .codes-page .hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#020b12f5 0%,#06131dcc 38%,#06131d66 68%,#06131d22 100%),linear-gradient(0deg,#02080dcc 0%,transparent 55%,#02080d33 100%);pointer-events:none}
          .codes-page .hero-copy{position:relative;z-index:3;max-width:700px;min-height:clamp(520px,62vw,720px);display:flex;flex-direction:column;justify-content:center;padding:clamp(45px,7vw,90px)}
          .codes-page .hero-copy h1{max-width:650px;font-size:clamp(48px,7vw,88px);line-height:.94;letter-spacing:-.065em;text-shadow:0 8px 40px #0008}
          .codes-page .hero-copy .hero-lede{max-width:590px;color:#d1e3ef}
          .codes-page .hero-points{display:none!important}
          .codes-page .hero-art{display:none!important}
          .codes-page .aurora{opacity:.18}
          .codes-page .seo-expanded{margin-top:22px;padding:34px;border:1px solid #1d3343;border-radius:22px;background:linear-gradient(145deg,#0b151f,#071018)}
          .codes-page .seo-expanded h2{margin-bottom:14px}
          .codes-page .seo-expanded p{max-width:900px;color:#a9bac8;line-height:1.85}
          @media(max-width:700px){.codes-page .hero{min-height:600px;border-radius:22px;background-position:58% center}.codes-page .hero-copy{min-height:600px;padding:32px 24px;justify-content:flex-end;padding-bottom:48px}.codes-page .hero-copy h1{font-size:clamp(42px,12vw,64px)}.codes-page .hero-actions{flex-direction:column}.codes-page .hero-actions .btn{width:100%}}
          </style>

          '''
          if 'codes-page .hero{position:relative;display:block' not in s:
              s = s.replace(marker, css + marker)
          seo = '''
          <section class="seo-expanded" aria-labelledby="redeem-guide-heading">
            <span class="section-kicker">FC MOBILE REDEEM CODE GUIDE</span>
            <h2 id="redeem-guide-heading">FC Mobile redeem codes, rewards and redemption help</h2>
            <p>Looking for working FC Mobile redeem codes? TanzimFC keeps a searchable FC Mobile code database with active, scheduled and expired records, reward details, release dates and verification dates. Use the active section for current codes, then open the official EA redemption page to redeem your reward.</p>
            <p>FC Mobile codes can provide rewards such as coins, gems, player items, packs and other in-game bonuses when an official promotion is available. Codes can expire or reach their redemption limit, so always check the status shown on this page before trying one.</p>
            <p>If an FC Mobile redeem code does not work, check that it is copied exactly, that the code is still active, and that you are signed in to the correct EA account. The official redemption destination is linked directly from each active code.</p>
          </section>
          '''
          if 'FC Mobile redeem codes, rewards and redemption help' not in s:
              s = s.replace('      <footer class="footer-line">', seo + '\n      <footer class="footer-line">')
          p.write_text(s)
          PY
      - name: Commit patch and remove one time workflow
        run: |
          rm -f .github/workflows/one-time-redeem-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/redeem-codes.astro .github/workflows/one-time-redeem-hero.yml
          git diff --cached --quiet && exit 0
          git commit -m "design: refine redeem hero and search content"
          git push
