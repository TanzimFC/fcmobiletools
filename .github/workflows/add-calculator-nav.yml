name: Add calculator navigation
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message == 'run calculator navigation patch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add-calculator-nav.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin/dashboard.html
          git commit -m 'add calculator data navigation'
          git push origin main
      - name: Cleanup
        if: always()
        run: |
          git fetch origin main
          git checkout main
          git rm -f scripts/add-calculator-nav.py .github/workflows/add-calculator-nav.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'remove temporary calculator navigation files' || true
          git push origin main || true
