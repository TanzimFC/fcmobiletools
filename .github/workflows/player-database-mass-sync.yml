name: Player Database Mass Sync

on:
  push:
    branches: [main]
    paths:
      - "scripts/player-collector/**"
      - ".github/workflows/player-database-mass-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 */12 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Zenith API
        run: node -e "fetch('https://zenithfcm.com/api/players?limit=1&offset=0&rank=0&sort_by=ovr&order=desc&include_price=false').then(async r => { console.log('Zenith status:', r.status); const t=await r.text(); console.log(t.slice(0,1000)); if(!r.ok) process.exit(1); })"

      - name: Collect full player catalog from Zenith API
        env:
          PLAYER_SOURCE_API_BASE_URL: https://zenithfcm.com/api
          PLAYER_API_PAGE_SIZE: 1000
          PLAYER_API_DELAY_MS: 200
          PLAYER_MAX_RANK: 5
        run: node scripts/player-collector/collect.mjs

      - name: Normalize and quality-gate
        env:
          PLAYER_QUALITY_MIN: 60
        run: node scripts/player-collector/normalize.mjs

      - name: Import verified players
        env:
          SUPABASE_URL: ${{ secrets.PLAYER_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLAYER_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/player-collector/import.mjs

      - name: Upload collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-collection-${{ github.run_number }}
          path: scripts/player-collector/data/
          retention-days: 7
