name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fcmobiletools-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify legacy workers.dev redirect
        run: |
          set -euo pipefail
          headers="$(curl -sSIL --max-redirs 0 --retry 4 --retry-delay 3 --connect-timeout 10 --max-time 30 https://tanzimfc.fcmobiletools.workers.dev/)"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -Eiq '^HTTP/[0-9.]+ 301($| )' || { echo 'Legacy hostname did not return HTTP 301.' >&2; exit 1; }
          printf '%s\n' "$headers" | grep -Eiq '^location: https://fcmobiletools\.online/?\r? || { echo 'Legacy homepage does not redirect to the canonical homepage.' >&2; exit 1; }
