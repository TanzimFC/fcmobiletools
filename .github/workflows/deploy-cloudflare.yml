name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: fcmobiletools-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify legacy workers.dev redirects
        run: |
          set -euo pipefail

          check_redirect() {
            local path="$1"
            local expected="https://fcmobiletools.online${path}"
            local headers status location

            headers="$(curl -sS -D - -o /dev/null --max-redirs 0 --retry 4 --retry-delay 3 --connect-timeout 10 --max-time 30 "https://tanzimfc.fcmobiletools.workers.dev${path}")"
            printf '%s\n' "$headers"

            status="$(printf '%s\n' "$headers" | awk 'NR==1 { print $2; exit }')"
            location="$(printf '%s\n' "$headers" | awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/\r$/, ""); sub(/^[^:]*:[[:space:]]*/, ""); print; exit }')"

            [[ "$status" == "301" ]] || { echo "Expected HTTP 301 for $path, got: $status" >&2; exit 1; }
            [[ "$location" == "$expected" ]] || { echo "Expected Location: $expected, got: $location" >&2; exit 1; }

            echo "Verified 301: https://tanzimfc.fcmobiletools.workers.dev${path} -> ${location}"
          }

          check_redirect "/"
          check_redirect "/football-centre"
          check_redirect "/fc-mobile-27/"
          check_redirect "/reset-center/"
          check_redirect "/blog?type=reviews"
          check_redirect "/blog?type=analysis"
