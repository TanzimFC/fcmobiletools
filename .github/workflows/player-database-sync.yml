name: Player Database Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Supabase sync credentials
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.PLAYER_SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLAYER_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "${SUPABASE_SECRET_KEY}" ] && [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Add PLAYER_SUPABASE_SECRET_KEY to GitHub Actions secrets (legacy PLAYER_SUPABASE_SERVICE_ROLE_KEY is also accepted)."
            exit 1
          fi

      - name: Sync player database
        env:
          SUPABASE_URL: https://moczgrwxtfexdbjthxpd.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.PLAYER_SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLAYER_SUPABASE_SERVICE_ROLE_KEY }}
          UPSTREAM_BASE_URL: ${{ secrets.PLAYER_UPSTREAM_BASE_URL }}
          UPSTREAM_SEARCH_ENDPOINT: ${{ secrets.PLAYER_UPSTREAM_SEARCH_ENDPOINT }}
          UPSTREAM_COOKIE: ${{ secrets.PLAYER_UPSTREAM_COOKIE }}
          UPSTREAM_SECURE_TOKEN: ${{ secrets.PLAYER_UPSTREAM_SECURE_TOKEN }}
          UPSTREAM_CLIENT_FINGERPRINT: ${{ secrets.PLAYER_UPSTREAM_CLIENT_FINGERPRINT }}
          PLAYER_PAGE_SIZE: 1000
          PLAYER_REQUEST_DELAY_MS: 500
        run: node --experimental-strip-types scripts/player-pipeline/src/sync-v2.ts
