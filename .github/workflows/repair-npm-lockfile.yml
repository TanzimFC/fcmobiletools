name: Repair npm lockfile

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install and production build
        run: |
          npm ci
          npm run build

      - name: Replace Bun lockfile with npm lockfile
        run: |
          rm -f bun.lock bun.lockb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git rm -f bun.lock bun.lockb 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No lockfile repair needed."
            exit 0
          fi
          git commit -m "fix dependency lockfile for Cloudflare builds"
          git push
