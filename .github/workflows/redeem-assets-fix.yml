name: Redeem assets fix
on:
  push:
    branches: [main]
    paths:
      - scripts/redeem-assets-fix.cjs
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair generated script interpolation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/redeem-assets-fix.cjs')
          text = p.read_text()
          replacements = {
              'rotate(${tilt}deg) translate3d(${x * 4}px, ${y * 3}px, 0)': 'rotate(\\${tilt}deg) translate3d(\\${x * 4}px, \\${y * 3}px, 0)',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY
      - name: Patch page
        run: node scripts/redeem-assets-fix.cjs
      - name: Commit page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/redeem-codes.astro
          git commit -m "design: final redeem hero polish"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Cleanup
        run: |
          rm -f scripts/redeem-assets-fix.cjs
          git rm -f .github/workflows/redeem-assets-fix.yml
          git add -A
          git commit -m "chore: remove temporary redeem patch files" || true
          git push || true
