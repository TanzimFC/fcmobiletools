name: Redeem assets fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch page
        run: node scripts/redeem-assets-fix.cjs
      - name: Commit page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/redeem-codes.astro
          git commit -m "design: separate redeem hero assets"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Cleanup
        run: |
          rm scripts/redeem-assets-fix.cjs
          git rm .github/workflows/redeem-assets-fix.yml
          git add -A
          git commit -m "chore: remove temporary redeem asset files"
          git push
