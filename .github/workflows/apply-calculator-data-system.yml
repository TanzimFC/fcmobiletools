name: Apply calculator data system
on:
  push:
    branches: [main]
jobs:
  apply:
    if: github.event.head_commit.message == 'add calculator data management system'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite calculator pages and add admin data centre
        shell: bash
        run: |
          cat > src/pages/training-calculator.astro <<'EOF'
---
import BaseLayout from '../layouts/BaseLayout.astro';
import { TRAINING_LEVELS, FODDER, MAX_TRAINING_LEVEL, TRAINING_TRANSFER_RATE } from '../data/fcMobileTraining.js';
const fmt = (n) => new Intl.NumberFormat('en-US').format(n);
---
<BaseLayout title="FC Mobile Training Calculator | XP Calculator & Training Cost | FCMOBILETOOLS" description="FC Mobile Training Calculator for XP required, cards needed, training levels and fodder XP from Level 0 to 30.">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"FC Mobile Training Calculator","applicationCategory":"UtilitiesApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<main class="training-page">
<header class="hero"><div class="wrap"><div class="eyebrow"><i></i> FC MOBILE / TRAINING LAB</div><div class="hero-grid"><div><h1>Training <em>Calculator</em></h1><p>Calculate the exact XP, cards and level path for FC Mobile training. The reference data is rendered directly from the site's training database.</p><div class="chips"><span>XP PLANNER</span><span>LEVEL 0–{MAX_TRAINING_LEVEL}</span><span>LIVE DATA</span></div></div><div class="hero-stat"><small>MAX TRAINING</small><b>{MAX_TRAINING_LEVEL}</b><span>LEVELS</span></div></div></div></header>
<section class="wrap section"><div class="panel planner"><div class="panel-head"><div><span class="label">CALCULATOR</span><h2>Build your training plan</h2><p>All controls are populated from the same data used by the calculator logic</p></div></div><div class="inputs"><label>Current level<select id="currentLevel">{TRAINING_LEVELS.map((_,i)=><option value={i}>Level {i}</option>)}</select></label><label>Target level<select id="targetLevel">{TRAINING_LEVELS.map((_,i)=><option value={i} selected={i===MAX_TRAINING_LEVEL}>Level {i}</option>)}</select></label><label>Fodder OVR<select id="fodderId">{FODDER.map(f=><option value={f.id} selected={f.id==='95+'}>{f.label} — {fmt(f.xp)} XP</option>)}</select></label></div><div id="alert" class="alert" hidden></div><div class="result"><div><small>XP REQUIRED</small><strong id="xpRequired">0</strong><p id="planText">Choose your target level</p></div><div class="stats"><article><small>CARDS NEEDED</small><b id="cardsNeeded">0</b><span id="cardText">—</span></article><article><small>XP PER CARD</small><b id="xpPerCard">0</b><span>XP value</span></article><article><small>EXCESS XP</small><b id="extraXP">0</b><span>after plan</span></article><article><small>LEVELS GAINED</small><b id="levelsGained">0</b><span id="levelText">—</span></article></div></div><div class="progress"><div><span id="progressFrom">LEVEL 0</span><b id="progressPct">0%</b><span id="progressTo">LEVEL 30</span></div><i id="progressFill"></i></div><div class="break"><button id="toggleBreakdown" type="button">VIEW LEVEL BREAKDOWN +</button><div id="breakdown" hidden><table><thead><tr><th>LEVEL</th><th>XP TO LEVEL</th><th>TOTAL XP</th></tr></thead><tbody id="breakdownTable"></tbody></table></div></div></div>
<div class="two"><article class="panel"><span class="label">REVERSE PLANNER</span><h2>XP budget → level</h2><p>Find the highest level reachable from a starting level</p><div class="inputs two-in"><label>Starting level<select id="reverseStart">{TRAINING_LEVELS.map((_,i)=><option value={i}>Level {i}</option>)}</select></label><label>Available XP<input id="xpBudget" type="number" min="0" step="100" placeholder="10000"></label></div><div id="reverseOut" class="mini">Enter an XP budget</div></article><article class="panel"><span class="label">TRANSFER CHECK</span><h2>Training transfer</h2><p>Check stored XP received after transfer</p><label>Source level<select id="transferLevel">{TRAINING_LEVELS.map((_,i)=><option value={i}>Level {i}</option>)}</select></label><div class="transfer"><div><small>STORED</small><b id="sourceXP">0</b></div><div><small>RECEIVED</small><b id="receivedXP">0</b></div><div><small>LOST</small><b id="lostXP">0</b></div></div></article></div></section>
<section class="reference"><div class="wrap"><span class="label">REFERENCE DATA</span><h2>FC Mobile training XP table</h2><p class="sub">{TRAINING_LEVELS.length} level entries and {FODDER.length} fodder XP entries loaded directly into the page</p><div class="ref-grid"><article class="panel"><div class="table-head"><h3>XP by level</h3><b>{TRAINING_LEVELS.length} ROWS</b></div><div class="scroll"><table><thead><tr><th>LEVEL</th><th>TOTAL XP</th><th>TO NEXT</th></tr></thead><tbody id="fullTable">{TRAINING_LEVELS.map((v,i)=><tr><td>Level {i}</td><td>{fmt(v)} XP</td><td>{i<MAX_TRAINING_LEVEL ? `${fmt(TRAINING_LEVELS[i+1]-v)} XP` : 'MAX'}</td></tr>)}</tbody></table></div></article><article class="panel"><div class="table-head"><h3>Fodder XP</h3><b>{FODDER.length} ENTRIES</b></div><div class="fodder">{FODDER.map(f=><div><span>{f.label}</span><b>{fmt(f.xp)} XP</b></div>)}</div></article></div></div></section>
<section class="faq wrap"><span class="label">FAQ</span><h2>FC Mobile Training Calculator FAQ</h2><details open><summary>How is XP required calculated?</summary><p>The calculator subtracts the total XP at the current level from the total XP at the target level.</p></details><details><summary>How are cards needed calculated?</summary><p>Required XP is divided by the selected fodder XP and rounded up to a whole card.</p></details><details><summary>Can the training data be updated?</summary><p>Yes. Admins can update the training XP and fodder values in the Calculator Data centre without editing the public page.</p></details></section>
</main>
<style>
:root{--bg:#05080d;--panel:#0b121b;--line:#203040;--text:#f5fbff;--muted:#8093a3;--cyan:#36c9ff;--blue:#4b7dff;--red:#ff4d5e;--sans:'Manrope',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}.hero{border-bottom:1px solid var(--line);background:radial-gradient(circle at 80% 10%,#36c9ff18,transparent 35%),radial-gradient(circle at 10% 0,#4b7dff12,transparent 32%);padding:72px 0 60px}.eyebrow,.label{font:800 9px var(--mono);letter-spacing:.16em;color:var(--cyan)}.eyebrow i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px #ff4d5e14}.hero-grid{display:grid;grid-template-columns:1fr 180px;gap:60px;align-items:center}.hero h1{font:900 clamp(52px,8vw,92px)/.92 var(--sans);letter-spacing:-.075em;margin:16px 0}.hero h1 em{font-style:normal;color:var(--cyan)}.hero p,.sub,.panel p{color:var(--muted);line-height:1.7}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.chips span{padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:#718596;font:700 8px var(--mono)}.hero-stat{text-align:center;border-left:1px solid var(--line);padding-left:30px}.hero-stat small,.hero-stat span{display:block;color:#667b8a;font:700 8px var(--mono)}.hero-stat b{display:block;font:900 76px var(--mono);color:var(--cyan);letter-spacing:-.08em}.section{padding:42px 0 70px}.panel{background:linear-gradient(145deg,#0c151f,#080e15);border:1px solid var(--line);border-radius:22px;box-shadow:0 25px 80px #0005}.planner{overflow:hidden}.panel-head{padding:28px;border-bottom:1px solid var(--line)}h2{font-size:27px;letter-spacing:-.045em;margin:7px 0}h3{margin:0}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:24px 28px}.inputs label{display:grid;gap:8px;font:800 9px var(--mono);color:#8ba0af}select,input{width:100%;padding:14px 12px;border:1px solid #293b4b;background:#070e15;color:#f0f7fa;border-radius:11px;outline:0;font:700 11px var(--mono)}select:focus,input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #36c9ff12}.result{margin:0 28px;border:1px solid #36c9ff2b;border-radius:18px;background:#0b1a25;padding:24px;display:grid;grid-template-columns:1fr 1.2fr;gap:18px}.result small,.stats small,.transfer small{font:800 8px var(--mono);color:#6e9aab;letter-spacing:.1em}.result strong{display:block;font:900 clamp(48px,7vw,76px) var(--mono);letter-spacing:-.08em;margin:7px 0}.result p{margin:0;font:700 9px var(--mono)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats article,.transfer div{padding:14px;border:1px solid #ffffff10;background:#ffffff05;border-radius:11px}.stats b,.transfer b{display:block;font:900 17px var(--mono);margin-top:6px}.stats span{color:#607887;font-size:8px}.progress{padding:25px 28px}.progress>div{display:flex;justify-content:space-between;font:800 8px var(--mono);color:#708694}.progress b{color:var(--cyan)}.progress i{display:block;height:7px;width:0;margin-top:9px;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px}.break{border-top:1px solid var(--line)}.break button{margin:18px 28px;border:1px solid var(--line);background:#0c151e;color:#8ba0ae;border-radius:9px;padding:10px 12px;font:800 8px var(--mono)}table{width:100%;border-collapse:collapse;font:700 9px var(--mono)}th,td{text-align:left;padding:12px 16px;border-bottom:1px solid #1b2a35}th{color:#5f7786;font-size:8px}td{color:#b9c9d2}.scroll{overflow:auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.two .panel{padding:24px}.two-in{padding:20px 0 0}.mini{margin-top:16px;padding:13px;border:1px solid #36c9ff18;background:#36c9ff06;border-radius:10px;color:#8eaebb;font:700 9px var(--mono)}.transfer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.reference{padding:70px 0;background:#071018;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.sub{font-size:12px}.ref-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin-top:22px}.ref-grid .panel{padding:20px}.table-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.table-head b{color:var(--cyan);font:700 8px var(--mono)}.fodder{display:grid;gap:8px}.fodder div{display:flex;justify-content:space-between;padding:13px;border:1px solid #ffffff0b;background:#ffffff04;border-radius:10px;font-size:10px}.fodder b{font-family:var(--mono);color:var(--cyan)}.faq{padding:70px 0}.faq details{border-bottom:1px solid var(--line);padding:18px 0}.faq summary{cursor:pointer;font-weight:800}.faq details p{font-size:11px}.alert{margin:0 28px 18px;padding:12px;border:1px solid #ff4d5e44;background:#ff4d5e0b;color:#ff9aa3;border-radius:10px;font:700 9px var(--mono)}@media(max-width:800px){.hero-grid,.result,.two,.ref-grid{grid-template-columns:1fr}.hero-stat{border-left:0;border-top:1px solid var(--line);padding:18px 0 0;text-align:left}.inputs{grid-template-columns:1fr}.hero{padding-top:48px}.wrap{width:min(100% - 26px,1180px)}}
</style>
<script>
import { calculateTraining, calculateTransfer } from '../lib/fcMobileTraining.js';
import { TRAINING_LEVELS, FODDER, MAX_TRAINING_LEVEL } from '../data/fcMobileTraining.js';
const $=(s)=>document.querySelector(s), fmt=(n)=>new Intl.NumberFormat('en-US').format(n);
const current=$('#currentLevel'),target=$('#targetLevel'),fodder=$('#fodderId');
function render(){const d=calculateTraining({currentLevel:current.value,targetLevel:target.value,fodderId:fodder.value});if(!d.valid){$('#alert').hidden=false;$('#alert').textContent=d.error;return}$('#alert').hidden=true;$('#xpRequired').textContent=fmt(d.requiredXP);$('#cardsNeeded').textContent=fmt(d.cardsNeeded);$('#xpPerCard').textContent=fmt(d.xpPerCard);$('#extraXP').textContent=fmt(d.excessXP);$('#levelsGained').textContent=d.levelsGained;$('#cardText').textContent=fodder.options[fodder.selectedIndex]?.textContent||'';$('#levelText').textContent=`Level ${d.currentLevel} → Level ${d.targetLevel}`;$('#planText').textContent=`Level ${d.currentLevel} to Level ${d.targetLevel}`;$('#progressFrom').textContent=`LEVEL ${d.currentLevel}`;$('#progressTo').textContent=`LEVEL ${d.targetLevel}`;$('#progressPct').textContent=`${Math.round((d.targetLevel/MAX_TRAINING_LEVEL)*100)}%`;$('#progressFill').style.width=`${Math.round((d.targetLevel/MAX_TRAINING_LEVEL)*100)}%`;$('#breakdownTotal').textContent=fmt(d.requiredXP)+' XP';$('#breakdownTable').innerHTML=d.breakdown.map(x=>`<tr><td>Level ${x.level}</td><td>${fmt(x.xpToNext)} XP</td><td>${fmt(x.totalXP)} XP</td></tr>`).join('')}
function reverse(){const s=Number($('#reverseStart').value),b=Number($('#xpBudget').value||0);let level=s;for(let i=s+1;i<=MAX_TRAINING_LEVEL;i++){if(b < TRAINING_LEVELS[i]-TRAINING_LEVELS[s]) break;level=i}$('#reverseOut').textContent=`Level ${level} reachable · ${fmt(Math.max(0,b-(TRAINING_LEVELS[level]-TRAINING_LEVELS[s])))} XP remaining`}
function transfer(){const d=calculateTransfer(Number($('#transferLevel').value));if(!d.valid)return;$('#sourceXP').textContent=fmt(d.sourceXP);$('#receivedXP').textContent=fmt(d.transferredXP);$('#lostXP').textContent=fmt(d.sourceXP-d.transferredXP)}
[current,target,fodder].forEach(x=>x.addEventListener('change',render));$('#xpBudget').addEventListener('input',reverse);$('#reverseStart').addEventListener('change',reverse);$('#transferLevel').addEventListener('change',transfer);$('#toggleBreakdown').addEventListener('click',()=>{const x=$('#breakdown');x.hidden=!x.hidden;$('#toggleBreakdown').textContent=x.hidden?'VIEW LEVEL BREAKDOWN +':'HIDE LEVEL BREAKDOWN −'});target.value=String(MAX_TRAINING_LEVEL);render();reverse();transfer();
</script>
</BaseLayout>
EOF

