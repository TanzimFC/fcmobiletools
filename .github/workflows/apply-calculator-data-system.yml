---
import BaseLayout from '../layouts/BaseLayout.astro';
import { RANKS, RANK_COSTS } from '../data/fcMobileRankUp.js';
const fmt=(n)=>new Intl.NumberFormat('en-US').format(n);
const costRows=RANK_COSTS.map(row=>({label:row.label,costs:row.costs}));
---
<BaseLayout title="FC Mobile Rank Up Calculator | Rank Up Points Cost | FCMOBILETOOLS" description="FC Mobile Rank Up Calculator for Rank Up Points, OVR gain, Skill Points and exact rank progression costs by Base OVR.">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"FC Mobile Rank Up Calculator","applicationCategory":"UtilitiesApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<main class="rank-page"><header class="hero"><div class="wrap"><div class="eyebrow"><i></i> FC MOBILE / RANK LAB</div><div class="hero-grid"><div><h1>Rank Up <em>Calculator</em></h1><p>Calculate exact Rank Up Points, OVR gain and Skill Points from Base to Orange. The cost table is rendered from the site's rank-up database.</p><div class="chips"><span>RANK UP POINTS</span><span>BASE OVR</span><span>6 RANK STAGES</span></div></div><div class="rank-stack">{RANKS.map(r=><div><b>R{r.value}</b><span>{r.name}</span></div>)}</div></div></div></header>
<section class="wrap section"><div class="panel planner"><div class="panel-head"><span class="label">CALCULATOR</span><h2>Map your rank path</h2><p>All rank controls and costs are populated from the same source data</p></div><div class="inputs"><label>Base OVR<input id="base" type="number" min="0" max="200" value="110"></label><label>Current rank<select id="current">{RANKS.map(r=><option value={r.value}>R{r.value} · {r.name}</option>)}</select></label><label>Target rank<select id="target">{RANKS.map(r=><option value={r.value} selected={r.value===5}>R{r.value} · {r.name}</option>)}</select></label><label>Available RP <span class="optional">optional</span><input id="available" type="number" min="0" placeholder="Leave blank"></label></div><div id="alert" class="alert" hidden></div><div class="result"><div><small>REQUIRED RP</small><strong id="requiredRP">0</strong><p id="planText">Choose a rank path</p></div><div class="stats"><article><small>OVR AFTER RANK</small><b id="targetOVR">0</b><span id="ovrText">—</span></article><article><small>SKILL POINTS</small><b id="skillPoints">0</b><span>from ranks gained</span></article><article><small>RANKS GAINED</small><b id="ranksGained">0</b><span id="rankText">—</span></article><article><small>RP BALANCE</small><b id="balance">—</b><span id="balanceText">available RP</span></article></div></div><div class="path" id="path"></div><div class="break"><h3>Cost breakdown</h3><div class="scroll"><table><thead><tr><th>FROM</th><th>TO</th><th>RP COST</th></tr></thead><tbody id="breakdown"></tbody></table></div></div></div></section>
<section class="reference"><div class="wrap"><span class="label">REFERENCE DATA</span><h2>Rank Up Points cost table</h2><p class="sub">Every Base OVR bracket and all five rank-step costs are present in the page source</p><div class="panel table-panel"><div class="scroll"><table><thead><tr><th>BASE OVR</th><th>R0 → R1</th><th>R1 → R2</th><th>R2 → R3</th><th>R3 → R4</th><th>R4 → R5</th></tr></thead><tbody>{costRows.map(row=><tr><td>{row.label}</td>{row.costs.map(c=><td>{fmt(c)} RP</td>)}</tr>)}</tbody></table></div></div></div></section>
<section class="faq wrap"><span class="label">FAQ</span><h2>FC Mobile Rank Up Calculator FAQ</h2><details open><summary>What are Rank Up Points used for?</summary><p>Rank Up Points are used for the rank progression steps shown in this calculator.</p></details><details><summary>How does Base OVR affect the cost?</summary><p>The calculator selects the matching Base OVR bracket, then adds the RP cost for each rank step between your current and target rank.</p></details><details><summary>Can the Rank Up Points table be updated?</summary><p>Yes. Admins can update every Base OVR bracket and rank-step cost in the Calculator Data centre.</p></details></section></main>
<style>
:root{--bg:#05080d;--panel:#0b121b;--line:#203040;--text:#f5fbff;--muted:#8093a3;--cyan:#36c9ff;--blue:#4b7dff;--red:#ff4d5e;--sans:'Manrope',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}.hero{padding:72px 0 60px;border-bottom:1px solid var(--line);background:radial-gradient(circle at 80% 10%,#36c9ff18,transparent 35%),radial-gradient(circle at 10% 0,#4b7dff12,transparent 32%)}.eyebrow,.label{font:800 9px var(--mono);letter-spacing:.16em;color:var(--cyan)}.eyebrow i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red)}.hero-grid{display:grid;grid-template-columns:1fr 320px;gap:50px;align-items:center}.hero h1{font:900 clamp(52px,8vw,92px)/.92 var(--sans);letter-spacing:-.075em;margin:16px 0}.hero h1 em{font-style:normal;color:var(--cyan)}.hero p,.sub,.panel p{color:var(--muted);line-height:1.7}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.chips span{padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:#718596;font:700 8px var(--mono)}.rank-stack{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rank-stack div{padding:15px 10px;border:1px solid #36c9ff20;background:#36c9ff06;border-radius:12px}.rank-stack b{display:block;font:900 21px var(--mono);color:var(--cyan)}.rank-stack span{display:block;color:#68808e;font:700 7px var(--mono);margin-top:3px}.section{padding:42px 0 70px}.panel{background:linear-gradient(145deg,#0c151f,#080e15);border:1px solid var(--line);border-radius:22px;box-shadow:0 25px 80px #0005}.planner{overflow:hidden}.panel-head{padding:28px;border-bottom:1px solid var(--line)}h2{font-size:27px;letter-spacing:-.045em;margin:7px 0}.inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:24px 28px}.inputs label{display:grid;gap:8px;font:800 9px var(--mono);color:#8ba0af}.optional{font-weight:600;color:#536c7c}input,select{width:100%;padding:14px 12px;border:1px solid #293b4b;background:#070e15;color:#f0f7fa;border-radius:11px;outline:0;font:700 11px var(--mono)}input:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #36c9ff12}.result{margin:0 28px;border:1px solid #36c9ff2b;border-radius:18px;background:#0b1a25;padding:24px;display:grid;grid-template-columns:1fr 1.2fr;gap:18px}.result small,.stats small{font:800 8px var(--mono);color:#6e9aab;letter-spacing:.1em}.result strong{display:block;font:900 clamp(48px,7vw,76px) var(--mono);letter-spacing:-.08em;margin:7px 0}.result p{margin:0;font:700 9px var(--mono)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats article{padding:14px;border:1px solid #ffffff10;background:#ffffff05;border-radius:11px}.stats b{display:block;font:900 17px var(--mono);margin-top:6px}.stats span{display:block;color:#607887;font-size:8px;margin-top:4px}.path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:24px 28px;border-bottom:1px solid var(--line)}.path .rank{padding:10px 12px;border:1px solid #36c9ff2a;background:#36c9ff07;border-radius:10px;font:800 9px var(--mono)}.path .arrow{color:#567181}.break{padding:22px 28px}.break h3{font-size:15px;margin:0 0 12px}table{width:100%;border-collapse:collapse;font:700 9px var(--mono)}th,td{text-align:left;padding:12px 16px;border-bottom:1px solid #1b2a35}th{color:#5f7786;font-size:8px}td{color:#b9c9d2}.scroll{overflow:auto}.reference{padding:70px 0;background:#071018;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.table-panel{margin-top:22px;padding:8px}.alert{margin:0 28px 18px;padding:12px;border:1px solid #ff4d5e44;background:#ff4d5e0b;color:#ff9aa3;border-radius:10px;font:700 9px var(--mono)}.faq{padding:70px 0}.faq details{border-bottom:1px solid var(--line);padding:18px 0}.faq summary{cursor:pointer;font-weight:800}.faq details p{font-size:11px}@media(max-width:900px){.hero-grid,.result{grid-template-columns:1fr}.inputs{grid-template-columns:1fr 1fr}}@media(max-width:560px){.inputs{grid-template-columns:1fr}.wrap{width:calc(100% - 26px)}}
</style>
<script>
import { calculateRankUp } from '../lib/fcMobileRankUp.js';
import { RANKS, RANK_COSTS } from '../data/fcMobileRankUp.js';
const $=s=>document.querySelector(s),fmt=n=>new Intl.NumberFormat('en-US').format(n);const base=$('#base'),current=$('#current'),target=$('#target'),available=$('#available');
function render(){const d=calculateRankUp({baseOVR:base.value,currentRank:current.value,targetRank:target.value,availableRP:available.value});if(!d.valid){$('#alert').hidden=false;$('#alert').textContent=d.error;return}$('#alert').hidden=true;$('#requiredRP').textContent=fmt(d.requiredRP);$('#targetOVR').textContent=fmt(d.targetOVR);$('#skillPoints').textContent=d.skillPoints;$('#ranksGained').textContent=d.ranksGained;$('#planText').textContent=`${d.bracket.label} · ${RANKS[d.currentRank].name} → ${RANKS[d.targetRank].name}`;$('#ovrText').textContent=`Base ${d.baseOVR} + ${d.ranksGained}`;$('#rankText').textContent=`R${d.currentRank} → R${d.targetRank}`;$('#balance').textContent=d.remainingRP===null?'—':fmt(d.remainingRP);$('#balanceText').textContent=d.remainingRP===null?'enter available RP to check':'remaining RP';$('#path').innerHTML=d.ranks.slice(d.currentRank,d.targetRank+1).map((r,i)=>`${i?'<span class="arrow">→</span>':''}<span class="rank">R${r.value} · ${r.name}</span>`).join('');$('#breakdown').innerHTML=d.steps.map(s=>`<tr><td>R${s.from} · ${RANKS[s.from].name}</td><td>R${s.to} · ${RANKS[s.to].name}</td><td>${fmt(s.cost)} RP</td></tr>`).join('')}
[base,current,target,available].forEach(x=>x.addEventListener('input',render));target.value='5';render();
</script></BaseLayout>
