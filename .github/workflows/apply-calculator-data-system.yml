ebar{position:sticky;bottom:14px;margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:#0b141beF;border:1px solid #294452;border-radius:12px;backdrop-filter:blur(15px)}#status{color:#8297a5;font:700 8px 'IBM Plex Mono',monospace}.hint{color:#687f8e;font-size:9px;line-height:1.6;margin:0 0 16px}.training-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.xp-row{display:grid;grid-template-columns:1fr 130px;gap:8px;margin-bottom:8px}.xp-row input{width:100%;padding:10px;border:1px solid #29404d;border-radius:9px;background:#071017;color:#fff;font:700 10px 'IBM Plex Mono',monospace}@media(max-width:800px){.grid,.training-grid{grid-template-columns:1fr}.table-head,.row{grid-template-columns:1fr repeat(5,minmax(70px,1fr)) auto;min-width:650px}.panel{overflow:auto}}
</style></head><body><main class="wrap"><div class="head"><div><div class="eyebrow">FCMOBILETOOLS / DATA CONTROL</div><h1>Calculator Data Centre</h1><p>Update calculator source data once and let the public calculators consume the new values</p></div><a href="/admin/">← Dashboard</a></div><div class="tabs"><button id="rankTab" class="active">Rank Up Points</button><button id="trainingTab">Training XP</button></div><section id="rankPanel" class="panel"><p class="hint">Edit the five step costs for each Base OVR bracket and the six rank labels. Values are validated before they are written to main.</p><div id="rankNames" class="rank-name"></div><div class="table-head"><span>BASE OVR</span><span>R0 → R1</span><span>R1 → R2</span><span>R2 → R3</span><span>R3 → R4</span><span>R4 → R5</span><span></span></div><div id="rankRows"></div></section><section id="trainingPanel" class="panel" hidden><p class="hint">Training XP is the cumulative XP required to reach each level. Fodder entries define the XP value of each training card range.</p><div class="training-grid"><div><div class="label">LEVEL XP / 0–30</div><div id="levels"></div></div><div><div class="label">FODDER XP</div><div id="fodder"></div></div></div></section><div class="savebar"><span id="status">Loading data…</span><button id="save" class="btn primary">Save changes</button></div></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rankData=null,trainingData=null,mode='rank';
async function api(path,opt){const r=await fetch('/api/admin/'+path,{credentials:'same-origin',...opt});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||`Request failed (${r.status})`);return b}
function renderRank(){const r=rankData;$('#rankNames').innerHTML=r.ranks.map((x,i)=>`<label>R${i}<input data-rank-name="${i}" value="${esc(x.name)}"></label>`).join('');$('#rankRows').innerHTML=r.costs.map((x,i)=>`<div class="row"><b>${esc(x.label)}</b>${x.costs.map((c,j)=>`<input data-cost="${i}-${j}" type="number" min="0" step="1" value="${c}">`).join('')}<span></span></div>`).join('')}
function renderTraining(){const t=trainingData;$('#levels').innerHTML=t.levels.map((x,i)=>`<div class="xp-row"><span class="field">Level ${i}<input data-level="${i}" type="number" min="0" value="${x}"></span><span></span></div>`).join('');$('#fodder').innerHTML=t.fodder.map((x,i)=>`<div class="xp-row"><span class="field">${esc(x.label)}<input data-f-label="${i}" value="${esc(x.label)}"></span><span class="field">XP<input data-f-xp="${i}" type="number" min="0" value="${x.xp}"></span></div>`).join('')}
function collect(){if(mode==='rank'){rankData.ranks.forEach((x,i)=>x.name=$(`[data-rank-name="${i}"]`).value.trim());rankData.costs.forEach((x,i)=>x.costs=x.costs.map((_,j)=>Number($(`[data-cost="${i}-${j}"]`).value)));}else{trainingData.levels=trainingData.levels.map((_,i)=>Number($(`[data-level="${i}"]`).value));trainingData.fodder=trainingData.fodder.map((x,i)=>({id:x.id,label:$(`[data-f-label="${i}"]`).value.trim(),xp:Number($(`[data-f-xp="${i}"]`).value)}))}}
async function load(){const [r,t]=await Promise.all([api('rank-up'),api('training')]);rankData=r;trainingData=t;renderRank();renderTraining();$('#status').textContent='Data loaded';}
$('#rankTab').onclick=()=>{mode='rank';$('#rankTab').classList.add('active');$('#trainingTab').classList.remove('active');$('#rankPanel').hidden=false;$('#trainingPanel').hidden=true};$('#trainingTab').onclick=()=>{mode='training';$('#trainingTab').classList.add('active');$('#rankTab').classList.remove('active');$('#rankPanel').hidden=true;$('#trainingPanel').hidden=false};$('#save').onclick=async()=>{try{collect();$('#save').disabled=true;$('#status').textContent='Validating and saving…';if(mode==='rank')await api('rank-up',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(rankData)});else await api('training',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(trainingData)});$('#status').textContent='Saved to main · deployment triggered';}catch(e){$('#status').textContent=e.message}finally{$('#save').disabled=false}};load().catch(e=>$('#status').textContent=e.message);
</script></body></html>
