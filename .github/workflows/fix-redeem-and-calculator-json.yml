name: Fix redeem hero and calculator JSON data
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix source data and redeem hero
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/data/fcMobileTraining.js')
          s=p.read_text()
          s=s.replace('  52000, 60000, 69000, 79000, 90000, 102000, 115000, 129000, 144000, 160000,\n];', '  52000, 60000, 69000, 79000, 90000, 102000, 115000, 129000, 144000, 160000\n];')
          p.write_text(s)
          p=Path('src/data/fcMobileRankUp.js')
          s=p.read_text().replace('label: \'110+\', costs:', 'label: \'110+\', costs:')
          p.write_text(s)
          p=Path('src/pages/redeem-codes.astro')
          s=p.read_text()
          old='''<div class="hero-showcase" aria-label="FC Mobile redeem code artwork">\n  <div class="hero-stage">\n    <div class="hero-stage-glow"></div>\n    <div class="hero-ring hero-ring-one"></div>\n    <div class="hero-ring hero-ring-two"></div>\n    <div class="hero-object-main"><img src={heroObject} alt="FC Mobile redeem codes" loading="eager" /></div>\n  </div>\n</div>'''
          new='''<div class="hero-object-main" aria-label="FC Mobile redeem code artwork"><img src={heroObject} alt="FC Mobile redeem codes" loading="eager" /></div>'''
          s=s.replace(old,new)
          s=s.replace('<div class="hero-showcase" aria-label="FC Mobile redeem code artwork">\n  <div class="hero-object-main"><img src={heroObject} alt="FC Mobile redeem codes" loading="eager" /></div>\n</div>', '<div class="hero-object-main" aria-label="FC Mobile redeem code artwork"><img src={heroObject} alt="FC Mobile redeem codes" loading="eager" /></div>')
          marker='/* Final redeem hero: artwork and title sit directly on the page background */'
          if marker in s:
            start=s.index(marker)
            end=s.find('</style>', start)
            css='''.codes-page .hero{background:transparent!important;box-shadow:none!important;border:0!important;padding-top:clamp(44px,7vw,90px)!important;}\n.codes-page .hero-copy{position:relative;z-index:2;max-width:680px!important;}\n.codes-page .hero h1{max-width:700px!important;margin:0!important;line-height:.92!important;letter-spacing:-.065em!important;}\n.codes-page .hero-lede{max-width:600px!important;margin-top:22px!important;}\n.codes-page .hero-object-main{display:block!important;background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;margin:clamp(8px,1vw,18px) auto 0!important;width:min(760px,92vw)!important;position:relative!important;z-index:1!important;}\n.codes-page .hero-object-main img{display:block!important;width:100%!important;max-width:760px!important;height:auto!important;filter:drop-shadow(0 28px 55px rgba(0,0,0,.48));}\n.codes-page .hero-showcase,.codes-page .hero-stage,.codes-page .hero-stage-glow,.codes-page .hero-ring,.codes-page .hero-ring-one,.codes-page .hero-ring-two{display:none!important;}\n@media(max-width:700px){.codes-page .hero{padding-top:34px!important}.codes-page .hero h1{font-size:clamp(43px,13vw,68px)!important}.codes-page .hero-lede{margin-top:17px!important}.codes-page .hero-object-main{width:min(620px,106vw)!important;margin-top:2px!important;margin-left:50%;transform:translateX(-50%);}.codes-page .hero-object-main img{width:100%!important;max-width:none!important;}}'''
            s=s[:start]+css+'\n'+s[end:]
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/fcMobileTraining.js src/data/fcMobileRankUp.js src/pages/redeem-codes.astro
          git diff --cached --quiet || git commit -m 'fix calculator JSON and redeem hero layout'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-redeem-and-calculator-json.yml
          git add .github/workflows/fix-redeem-and-calculator-json.yml
          git diff --cached --quiet || git commit -m 'remove temporary calculator fix workflow'
          git push || true
