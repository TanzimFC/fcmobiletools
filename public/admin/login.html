<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Admin Sign In — FC Mobile Tools</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070c12;color:#f3f8fc;font-family:Inter,system-ui,sans-serif;padding:24px}form{width:min(420px,100%);box-sizing:border-box;background:#0d141c;border:1px solid #20303e;border-radius:16px;padding:28px}small{color:#8695a3;font:700 10px ui-monospace,monospace;letter-spacing:.12em}h1{margin:7px 0;font-size:25px}p{color:#8695a3;font-size:13px}label{display:block;color:#8695a3;font-size:11px;margin-top:16px}input{display:block;width:100%;box-sizing:border-box;margin-top:6px;background:#121b26;border:1px solid #20303e;border-radius:9px;padding:11px;color:#f3f8fc;outline:0}input:focus{border-color:#38bdf8}button{width:100%;margin-top:18px;background:#38bdf8;border:0;border-radius:9px;padding:11px;font-weight:800;cursor:pointer;color:#03121c}button:disabled{opacity:.6;cursor:wait}#err{color:#f87171;font-size:12px;min-height:18px;margin-top:10px}</style></head><body><form id="login"><small>FC MOBILE TOOLS</small><h1>Admin sign in</h1><p>Sign in to manage articles and CMS content.</p><label>USERNAME<input id="username" name="username" autocomplete="username" required></label><label>PASSWORD<input id="password" name="password" type="password" autocomplete="current-password" required></label><div id="err"></div><button id="submit" type="submit">Sign in</button></form><script>const form=document.getElementById('login'),btn=document.getElementById('submit'),err=document.getElementById('err');fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'}).then(r=>{if(r.ok)location.replace('/admin/articles')}).catch(()=>{});form.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Signing in…';try{const r=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Sign in failed');location.replace('/admin/articles')}catch(x){err.textContent=x.message;btn.disabled=false;btn.textContent='Sign in'}});</script></body></html>
