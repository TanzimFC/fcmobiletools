<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Articles — FC Mobile Tools</title><style>:root{--bg:#070c12;--surface:#0d141c;--surface2:#121b26;--border:#20303e;--text:#f3f8fc;--muted:#8a99a7;--blue:#38bdf8;--green:#48d98a;--red:#f87171}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;background:#070c12f2;border-bottom:1px solid var(--border);padding:14px 20px;display:flex;gap:12px;align-items:center;z-index:5}header b{font-size:15px}header span{color:var(--muted);font-size:12px}header .grow{flex:1}.btn{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#03121c}.btn.green{background:var(--green);border-color:var(--green);color:#03140b}.btn:disabled{opacity:.5;cursor:not-allowed}.layout{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 58px)}aside{border-right:1px solid var(--border);padding:16px;overflow:auto}.main{padding:24px;max-width:1100px;width:100%;margin:auto}.list{display:grid;gap:8px}.item{padding:12px;border:1px solid var(--border);background:var(--surface);border-radius:9px;cursor:pointer}.item:hover,.item.active{border-color:#38bdf855;background:var(--surface2)}.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{color:var(--muted)}h1{font-size:25px;margin:0 0 18px}label{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;margin:15px 0 6px}input,textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px;outline:0}input:focus,textarea:focus{border-color:var(--blue)}textarea{min-height:430px;resize:vertical;font:14px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{color:var(--muted);font-size:12px}.error{margin:12px 0;padding:11px;border:1px solid #7a2222;background:#7a22221a;color:#ffb3b3;border-radius:8px;display:none}.notice{margin:12px 0;padding:11px;border:1px solid #2a5368;background:#38bdf81a;color:#bfeaff;border-radius:8px;display:none}.empty{color:var(--muted);padding:25px 5px;text-align:center}.actions{display:flex;gap:8px;margin-top:14px}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--border);max-height:280px}.main{padding:18px}}
</style></head><body><header><b>FC Mobile Tools · CMS</b><span id="who">Checking session…</span><div class="grow"></div><button class="btn" id="logout">Sign out</button></header><div class="layout"><aside><div class="row" style="justify-content:space-between"><b>Articles</b><button class="btn primary" id="new">+ New</button></div><div id="list" class="list" style="margin-top:12px"><div class="empty">Loading articles…</div></div></aside><main><div id="error" class="error"></div><div id="notice" class="notice"></div><section id="editor"><h1 id="heading">New article</h1><label>Title</label><input id="title" placeholder="Article title"><label>URL slug</label><input id="slug" placeholder="article-slug"><label>Excerpt</label><input id="excerpt" placeholder="Short description"><label>Category</label><input id="category" value="Guides"><label>Article HTML</label><textarea id="content" placeholder="Write the article directly as HTML…"></textarea><div class="actions"><button class="btn primary" id="save">Save draft</button><button class="btn green" id="submit">Submit for review</button><span class="status" id="status"></span></div></section></main></div><script>(function(){'use strict';var posts={},current=null;var $=function(id){return document.getElementById(id)},show=function(id,msg){$(id).textContent=msg;$(id).style.display='block'},hide=function(id){$(id).style.display='none'},api=async function(path,opt){var r=await fetch(path,Object.assign({credentials:'same-origin',cache:'no-store'},opt||{})),d=await r.json().catch(function(){return{}});if(!r.ok)throw Error(d.error||('Request failed ('+r.status+')'));return d},esc=function(s){return String(s||'').replace(/[&<>]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]})};function slug(s){return String(s||'').toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')};function clear(){current=null;$('heading').textContent='New article';$('title').value='';$('slug').value='';$('excerpt').value='';$('category').value='Guides';$('content').value='';$('status').textContent='New local editor';document.querySelectorAll('.item').forEach(function(x){x.classList.remove('active')})};function fill(p){current=p;$('heading').textContent=p.title||'Untitled article';$('title').value=p.title||'';$('slug').value=p.slug||'';$('excerpt').value=p.excerpt||'';$('category').value=p.category||'Guides';$('content').value=p.content||'';$('status').textContent=(p.status||'draft').toUpperCase();document.querySelectorAll('.item').forEach(function(x){x.classList.toggle('active',x.dataset.id===p.slug)})};function render(){var a=Object.values(posts).sort(function(x,y){return String(y.updatedAt||'').localeCompare(String(x.updatedAt||''))});$('list').innerHTML=a.length?a.map(function(p){return'<div class="item" data-id="'+esc(p.slug)+'"><b>'+esc(p.title||'Untitled')+'</b><small>'+esc(p.status||'draft')+' · /'+esc(p.slug)+'</small></div>'}).join(''):'<div class="empty">No articles yet.</div>';document.querySelectorAll('.item').forEach(function(x){x.onclick=function(){fill(posts[x.dataset.id])}})}async function load(){try{hide('error');var me=await api('/api/auth/me');$('who').textContent=(me.user.displayName||me.user.username)+' · '+me.user.role;var out=await api('/api/posts');posts={};(out.posts||[]).forEach(function(p){posts[p.slug]=p});render();if(!current&&Object.keys(posts).length)fill(posts[Object.keys(posts)[0]])}catch(e){show('error','CMS data could not load: '+e.message+'. The editor itself is still available; you can create a new local article or retry.');$('status').textContent='API error';render()}}async function save(submit){var title=$('title').value.trim(),content=$('content').value.trim(),s=slug($('slug').value||title);if(!title||!content){show('error','Title and article HTML are required.');return}hide('error');var payload={title:title,slug:s,excerpt:$('excerpt').value,description:$('excerpt').value,content:content,category:$('category').value||'Guides',author:'',tags:[],seoTitle:'',seoDescription:'',type:'guide',readingTime:0};try{$('save').disabled=true;$('submit').disabled=true;var out;if(current){out=await api('/api/posts/'+encodeURIComponent(current.slug),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(payload)})}else{out=await api('/api/posts',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)})}current=out.post;posts[current.slug]=current;if(submit){out=await api('/api/posts/'+encodeURIComponent(current.slug)+'/submit',{method:'POST'});current=out.post;posts[current.slug]=current}render();fill(current);show('notice',submit?'Article saved and submitted for review.':'Article saved as a draft.');setTimeout(function(){hide('notice')},3000)}catch(e){show('error','Save failed: '+e.message)}finally{$('save').disabled=false;$('submit').disabled=false}}$('new').onclick=function(){clear();hide('error');hide('notice')};$('title').oninput=function(){if(!current||!$('slug').value.trim())$('slug').value=slug($('title').value)};$('save').onclick=function(){save(false)};$('submit').onclick=function(){save(true)};$('logout').onclick=async function(){try{await api('/api/auth/logout',{method:'POST'})}finally{location.href='/admin/login'}};load()})()</script></body></html>
