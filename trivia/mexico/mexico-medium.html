<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mexico Medium — A Nation's Story | FC Mobile Trivia</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: #f5f5f5;
    font-family: Inter, Arial, sans-serif;
}

nav {
    height: 64px;
    border-bottom: 1px solid #181818;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
}

nav a {
    color: #999;
    text-decoration: none;
    font-size: 14px;
}

nav a:hover {
    color: #b982ff;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 55px 20px;
}

.back {
    color: #999;
    text-decoration: none;
    font-size: 14px;
}

.header {
    margin: 35px 0;
}

.header h1 {
    margin: 0 0 8px;
    font-size: 40px;
}

.header p {
    color: #888;
    line-height: 1.6;
}

.progress {
    height: 4px;
    background: #191919;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 45px;
}

.progress span {
    display: block;
    height: 100%;
    width: 66.66%;
    background: #8c51d0;
}

.challenge {
    margin-bottom: 70px;
}

.challenge-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.challenge-title {
    color: #bd8cff;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.question-count {
    color: #777;
    font-size: 13px;
}

.question {
    border: 1px solid #242424;
    background: #090909;
    border-radius: 17px;
    padding: 25px;
    margin-bottom: 18px;
}

.question-number {
    color: #8d5bc8;
    font-size: 12px;
    margin-bottom: 12px;
}

.question h2 {
    margin: 0 0 20px;
    font-size: 18px;
    line-height: 1.5;
}

.options {
    display: grid;
    gap: 9px;
}

.option {
    width: 100%;
    padding: 13px 15px;
    background: #101010;
    border: 1px solid #272727;
    color: #ddd;
    border-radius: 10px;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
    transition: .2s;
}

.option:hover {
    border-color: #7950a8;
}

.option.selected {
    border-color: #a96fff;
    background: #17101f;
}

.answer {
    display: none;
    margin-top: 20px;
    padding: 18px;
    border-radius: 12px;
    background: #100d13;
    border-left: 3px solid #a96fff;
}

.answer.show {
    display: block;
}

.answer strong {
    color: #c697ff;
}

.answer p {
    color: #aaa;
    line-height: 1.6;
    font-size: 14px;
    margin-bottom: 0;
}

.reveal {
    margin-top: 14px;
    border: 1px solid #39274d;
    background: transparent;
    color: #c18dff;
    padding: 9px 14px;
    border-radius: 8px;
    cursor: pointer;
}

@media(max-width:600px) {
    nav {
        justify-content: flex-start;
        padding: 0 15px;
        overflow-x: auto;
    }

    .header h1 {
        font-size: 32px;
    }

    .challenge-header {
        gap: 15px;
    }
}
</style>
</head>

<body>

<nav>
    <a href="/">Home</a>
    <a href="/#tools">Tools</a>
    <a href="/football-centre">Football Centre</a>
    <a href="/creator.html">Creator</a>
    <a href="/trivia/" style="color:#b982ff">Trivia</a>
</nav>

<main class="container">

<a class="back" href="/trivia/mexico.html">← Mexico</a>

<section class="header">
    <h1>🇲🇽 Mexico — Medium</h1>
    <p>
        Three challenges · 4 questions each · 12 questions total
    </p>
</section>

<div class="progress">
    <span></span>
</div>

<div id="quiz"></div>

</main>

<script>

const challenges = [

{
    name: "Challenge I",

    questions: [

        {
            q: "Mexico national-team nickname",
            options: [
                "El Tri",
                "Los Aztecas",
                "El Verde",
                "Los Guerreros"
            ],
            answer: "El Tri",
            explanation:
                "Mexico's national football team is commonly known as El Tri, referring to the team's traditional three-colour identity."
        },

        {
            q: "Mexican scorer in three consecutive WCs: 2010, 2014, 2018",
            options: [
                "Javier “Chicharito” Hernández",
                "Hugo Sánchez",
                "Rafael Márquez",
                "Carlos Vela"
            ],
            answer: "Javier “Chicharito” Hernández",
            explanation:
                "Javier Hernández scored for Mexico at the 2010, 2014 and 2018 FIFA World Cups."
        },

        {
            q: "2026 Group A opponent listed with Mexico",
            options: [
                "South Africa",
                "Germany",
                "Brazil",
                "Spain"
            ],
            answer: "South Africa",
            explanation:
                "South Africa was listed alongside Mexico in Group A for the 2026 FIFA World Cup."
        },

        {
            q: "Mexico coach at 2014 WC, “El Piojo”",
            options: [
                "Miguel Herrera",
                "Ricardo La Volpe",
                "Javier Aguirre",
                "Juan Carlos Osorio"
            ],
            answer: "Miguel Herrera",
            explanation:
                "Miguel Herrera, nicknamed “El Piojo”, coached Mexico at the 2014 World Cup."
        }

    ]
},

{
    name: "Challenge II",

    questions: [

        {
            q: "Team Luis Hernández scored against in 1998 to equalize 2–2",
            options: [
                "Netherlands",
                "Belgium",
                "Germany",
                "Brazil"
            ],
            answer: "Netherlands",
            explanation:
                "Luis Hernández scored Mexico's second goal against the Netherlands in the 1998 World Cup group stage."
        },

        {
            q: "Historic home stadium of Mexico",
            options: [
                "Estadio Azteca",
                "Estadio Jalisco",
                "Estadio Olímpico",
                "Estadio BBVA"
            ],
            answer: "Estadio Azteca",
            explanation:
                "Estadio Azteca in Mexico City is one of the country's most iconic football stadiums and has hosted multiple World Cups."
        },

        {
            q: "Mexico's first World Cup victory",
            options: [
                "1962 vs Czechoslovakia",
                "1958 vs Sweden",
                "1970 vs Belgium",
                "1930 vs France"
            ],
            answer: "1962 vs Czechoslovakia",
            explanation:
                "Mexico recorded its first FIFA World Cup victory by defeating Czechoslovakia 3–1 at the 1962 tournament in Chile."
        },

        {
            q: "Mexican goalkeeper famous for colorful self-designed jerseys",
            options: [
                "Jorge Campos",
                "Guillermo Ochoa",
                "Oswaldo Sánchez",
                "Antonio Carbajal"
            ],
            answer: "Jorge Campos",
            explanation:
                "Jorge Campos became famous for his distinctive, colourful goalkeeper kits, many of which he designed himself."
        }

    ]
},

{
    name: "Challenge III",

    questions: [

        {
            q: "Mexico's opponent in the 2012 Olympic football final",
            options: [
                "Brazil",
                "Argentina",
                "Spain",
                "Germany"
            ],
            answer: "Brazil",
            explanation:
                "Mexico defeated Brazil 2–1 in the men's football final at the 2012 London Olympics."
        },

        {
            q: "Number of times Mexico hosted the WC before 2026",
            options: [
                "2",
                "1",
                "3",
                "4"
            ],
            answer: "2",
            explanation:
                "Before the 2026 tournament, Mexico had hosted the FIFA World Cup twice: in 1970 and 1986."
        },

        {
            q: "Argentine coach of Mexico at 2006 WC",
            options: [
                "Ricardo La Volpe",
                "Gerardo Martino",
                "César Luis Menotti",
                "Marcelo Bielsa"
            ],
            answer: "Ricardo La Volpe",
            explanation:
                "Argentine coach Ricardo La Volpe led Mexico at the 2006 FIFA World Cup in Germany."
        },

        {
            q: "Mexican scorer of the famous header vs Italy in 2002",
            options: [
                "Jared Borgetti",
                "Luis Hernández",
                "Cuauhtémoc Blanco",
                "Rafael Márquez"
            ],
            answer: "Jared Borgetti",
            explanation:
                "Jared Borgetti scored a memorable headed goal against Italy during Mexico's 2002 World Cup group-stage match."
        }

    ]
}

];


function renderQuiz() {

    const quiz = document.getElementById("quiz");

    challenges.forEach((challenge) => {

        const section = document.createElement("section");

        section.className = "challenge";

        section.innerHTML = `
            <div class="challenge-header">
                <div class="challenge-title">
                    ${challenge.name}
                </div>

                <div class="question-count">
                    ${challenge.questions.length} Questions
                </div>
            </div>
        `;

        challenge.questions.forEach((item, index) => {

            const question = document.createElement("article");

            question.className = "question";

            question.innerHTML = `
                <div class="question-number">
                    Question ${index + 1} of ${challenge.questions.length}
                </div>

                <h2>${item.q}</h2>

                <div class="options">
                    ${item.options.map(option => `
                        <button class="option">
                            ${option}
                        </button>
                    `).join("")}
                </div>

                <button class="reveal">
                    Show answer
                </button>

                <div class="answer">
                    <strong>
                        Correct answer: ${item.answer}
                    </strong>

                    <p>
                        ${item.explanation}
                    </p>
                </div>
            `;

            const options =
                question.querySelectorAll(".option");

            options.forEach(option => {

                option.addEventListener("click", () => {

                    options.forEach(button => {
                        button.classList.remove("selected");
                    });

                    option.classList.add("selected");
                });

            });

            const reveal =
                question.querySelector(".reveal");

            const answer =
                question.querySelector(".answer");

            reveal.addEventListener("click", () => {

                answer.classList.add("show");

                reveal.style.display = "none";

            });

            section.appendChild(question);

        });

        quiz.appendChild(section);

    });

}

renderQuiz();

</script>

</body>
</html>
